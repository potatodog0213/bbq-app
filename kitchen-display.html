<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馬鈴吉碳烤｜廚房出單螢幕</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#f8eddb;--green:#09bf6a;--pink:#d60f63}*{box-sizing:border-box}body{margin:0;background:#171b20;color:#f7f3ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.login{max-width:400px;margin:10vh auto;background:#252b32;padding:25px;border-radius:18px}.login input{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:0}.login button{width:100%;padding:12px;border:0;border-radius:9px;font-weight:900}.header{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;background:#242a31;position:sticky;top:0;z-index:3}.header h1{font-size:21px;margin:0}.header span{color:#b8c0c8;font-size:13px}.columns{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:13px;padding:14px;align-items:start}.col{border-radius:14px;overflow:hidden;background:#252b32;min-height:70vh}.colhead{padding:13px 15px;font-size:17px;font-weight:950;display:flex;justify-content:space-between;align-items:center}.col[data-channel=onsite] .colhead{background:#f8eddb;color:#493727}.col[data-channel=ubereats] .colhead{background:#09bf6a;color:white}.col[data-channel=foodpanda] .colhead{background:#d60f63;color:white}.list{padding:10px;display:grid;gap:10px}.ticket{background:#343c45;border:1px solid #46515d;border-radius:12px;padding:13px}.ticket.done{opacity:.48}.ticket-top{display:flex;justify-content:space-between;gap:10px;font-weight:950;font-size:17px}.ticket-time{font-size:12px;color:#c2cbd3;margin:7px 0}.ticket-items{font-size:16px;line-height:1.7;font-weight:800}.ticket-note{background:#4a3c2d;padding:8px;border-radius:8px;margin-top:8px;color:#ffe2b8}.ticket-actions{display:flex;gap:7px;margin-top:11px}.ticket-actions button{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.start{background:#f2c879}.finish{background:#83d6a6}.cancel{background:#f39a9a}.tag{font-size:11px;background:#4b5661;padding:4px 7px;border-radius:6px}.empty{color:#9da7b0;text-align:center;padding:25px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#c2cbd3}@media(max-width:1150px){.columns{grid-template-columns:1fr 1fr}}@media(max-width:650px){.columns{grid-template-columns:1fr}.header h1{font-size:17px}}
</style></head><body>
<div id="login" class="login" style="display:none"><h2>店家登入</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="密碼"><button onclick="signIn()">登入</button><p id="error"></p></div>
<div id="screen" style="display:none"><header class="header"><h1>🍢 馬鈴吉碳烤｜廚房出單螢幕</h1><div><span id="clock"></span>　<span class="legend">現場・UberEats・foodpanda・客人線上訂單</span></div></header><main class="columns">
<section class="col" data-channel="onsite"><div class="colhead">現場 POS <span id="count-onsite">0</span></div><div class="list" id="list-onsite"></div></section>
<section class="col" data-channel="ubereats"><div class="colhead">UberEats <span id="count-ubereats">0</span></div><div class="list" id="list-ubereats"></div></section>
<section class="col" data-channel="foodpanda"><div class="colhead">foodpanda <span id="count-foodpanda">0</span></div><div class="list" id="list-foodpanda"></div></section>
<section class="col" data-channel="customer"><div class="colhead" style="background:#e8d9c6;color:#493727">客人線上訂單 <span id="count-customer">0</span></div><div class="list" id="list-customer"></div></section>
</main></div>
<script>
const URL='https://gyonwgjafukzlmnosykt.supabase.co',KEY='sb_publishable_T6IA7G9XaIvuGN-fOMX7Xw_FlPoi0OP',sb=supabase.createClient(URL,KEY);
const labels={onsite:'現場',ubereats:'UberEats',foodpanda:'foodpanda',customer:'線上訂單'};
let live=null,pos=[],customer=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString('zh-TW');
function showLogin(msg=''){document.getElementById('login').style.display='block';document.getElementById('error').textContent=msg}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){showLogin(error.message);return}boot()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}const {data:{user}}=await sb.auth.getUser();if(user?.app_metadata?.role!=='store_owner'){await sb.auth.signOut();showLogin('此帳號未授權');return}document.getElementById('login').style.display='none';document.getElementById('screen').style.display='block';await refresh();subscribe();setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleString('zh-TW')},1000)}
async function refresh(){const start=new Date();start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);const [p,c]=await Promise.all([sb.from('pos_orders').select('*').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at',{ascending:true}),sb.from('customer_orders').select('id,customer_name,pickup_time,items,total_amount,note,status,created_at,daily_sequence,order_number').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at',{ascending:true})]);if(p.error)console.error('POS 訂單讀取失敗',p.error);if(c.error)console.error('客人線上訂單讀取失敗',c.error);pos=p.data||[];customer=c.data||[];render()}
function render(){const all=[...pos.map(o=>({...o,_source:'pos',_channel:o.channel})),...customer.filter(o=>!['completed','cancelled'].includes(o.status)).map(o=>({...o,_source:'customer',_channel:'customer'}))];const active=all.filter(o=>!['completed','cancelled'].includes(o.status));const buckets={onsite:active.filter(o=>o._channel==='onsite'),ubereats:active.filter(o=>o._channel==='ubereats'),foodpanda:active.filter(o=>o._channel==='foodpanda'),customer:active.filter(o=>o._channel==='customer')};Object.entries(buckets).forEach(([ch,rows])=>{document.getElementById('count-'+ch).textContent=rows.length;document.getElementById('list-'+ch).innerHTML=rows.map(o=>ticket(o)).join('')||'<div class="empty">目前沒有待處理訂單</div>'})}
function ticket(o){const isCustomer=o._source==='customer',state=o.status,number=isCustomer?(o.daily_sequence||o.order_number||String(o.id).slice(0,6)):o.order_no;const items=Array.isArray(o.items)?o.items:[];const statusLabel={new:'待處理',confirmed:'已確認',preparing:'製作中',completed:'已完成',cancelled:'已取消'}[state]||state;const itemHtml=items.map(i=>`<div>${esc(i.name||i.product_name||'餐點')} × ${Number(i.quantity)||0}${i.spice_level?'・'+esc(i.spice_level):''}${i.is_gift?'（贈品）':''}</div>`).join('');return `<article class="ticket ${state==='completed'?'done':''}"><div class="ticket-top"><span>${isCustomer?'客人線上':'POS'} #${esc(number)}</span><span class="tag">${statusLabel}</span></div><div class="ticket-time">${new Date(o.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}　${isCustomer&&o.pickup_time?'取餐 '+new Date(o.pickup_time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):''}</div><div class="ticket-items">${itemHtml||'（無餐點明細）'}</div>${isCustomer?`<div class="ticket-time">客人：${esc(o.customer_name||'未提供')}</div>`:''}${o.note?`<div class="ticket-note">備註：${esc(o.note)}</div>`:''}<div class="ticket-actions">${state==='new'?(isCustomer?`<button class="start" onclick="updateCustomer('${o.id}','confirmed')">確認訂單</button>`:`<button class="start" onclick="updatePos('${o.id}','preparing')">開始製作</button>`):''}${state==='confirmed'?`<button class="start" onclick="updateCustomer('${o.id}','preparing')">開始製作</button>`:''}${state==='preparing'?`<button class="finish" onclick="${isCustomer?`updateCustomer('${o.id}','completed')`:`updatePos('${o.id}','completed')`}">完成餐點</button>`:''}${!isCustomer&&state==='new'?`<button class="cancel" onclick="updatePos('${o.id}','cancelled')">取消</button>`:''}</div></article>`}
async function updatePos(id,status){if(status==='preparing'&&!window.confirm('確定要開始製作這筆訂單嗎？'))return;const {error}=await sb.from('pos_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('更新失敗：'+error.message);return}await refresh()}
async function updateCustomer(id,status){if(status==='preparing'&&!window.confirm('確定要開始製作這筆訂單嗎？'))return;const {data,error}=await sb.functions.invoke('customer-orders',{body:{action:'owner-update-status',order_id:id,status}});if(error||!data?.ok){alert(data?.error||'客人訂單狀態更新失敗');return}await refresh()}
function subscribe(){if(live)sb.removeChannel(live);live=sb.channel('malinji-kitchen-live').on('postgres_changes',{event:'*',schema:'public',table:'pos_orders'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'customer_orders'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'customer_order_addons'},refresh).subscribe()}
boot().catch(e=>{console.error(e);showLogin('載入失敗：'+e.message)});
</script></body></html>
