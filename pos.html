<script>

(function(){try{const u=new URL(location.href);let d=false;['utm_source','utm_medium','utm_campaign','_source'].forEach(function(key){if(u.searchParams.has(key)){u.searchParams.delete(key);d=true;}});if(d)history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}})();
const SUPABASE_KEY='sb_publishable_T6IA7G9XaIvuGN-fOMX7Xw_FlPoi0OP';
const sb=window.supabase.createClient('https://gyonwgjafukzlmnosykt.supabase.co',SUPABASE_KEY);
const CHANNELS={onsite:{label:'現場',color:'#f8eddb'},ubereats:{label:'UberEats',color:'#09bf6a'},foodpanda:{label:'foodpanda',color:'#d60f63'}};

let products=[],images={},menuSettings={},giftDrinkIds=[],soldOutDrinkIds=[],rates={ubereatsCommissionRate:0,foodpandaCommissionRate:0},channel='onsite',category='碳烤伴餐類',cart={},giftQty={},orders=[],orderFilter='all',realtime=null,quickOptions={spice_level:'不辣',sauce_level:null,pepper_level:null},selectedOrderDate=localDate(new Date()),submittingOrder=false,pickerYear=null,pickerMonth=null,tempPickerDate=null;
const money=n=>'$'+(Number(n)||0).toLocaleString('zh-TW');

  const y=d.getFullYear(),
        m=String(d.getMonth()+1).padStart(2,'0'),

const priceFor=(p)=>{const base=Number(p.price)||0;if(channel==='ubereats'){const r=Number(rates.ubereatsCommissionRate)||0;return r>=100?null:Math.round(base/(1-r/100))}if(channel==='foodpanda'){const r=Number(rates.foodpandaCommissionRate)||0;return r>=100?null:Math.round(base/(1-r/100))}return base};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}const {data:{user}}=await sb.auth.getUser();if(user?.app_metadata?.role!=='store_owner'){await sb.auth.signOut();showLogin('此帳號未授權為店家管理帳號');return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='grid';document.getElementById('today-label').textContent=localDate(new Date());await loadMenu();updateDateTriggerText();await loadOrders();subscribe();showView('cashier',document.querySelector('.nav'))}
function showLogin(msg=''){document.getElementById('login').style.display='block';document.getElementById('login-error').textContent=msg}
async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){showLogin('登入失敗：'+error.message);return}await boot()}
async function loadMenu(){const [p,m,s]=await Promise.all([sb.from('products').select('*').order('id',{ascending:true}),sb.from('menu_generator_settings').select('settings_json').eq('id','default').maybeSingle(),sb.from('settings').select('settings_json').eq('month',localDate(new Date()).slice(0,7)).maybeSingle()]);if(p.error||m.error||s.error)throw new Error((p.error||m.error||s.error).message);products=p.data||[];const cfg=m.data?.settings_json||{};images=cfg.customerOrderProductImages||{};menuSettings=cfg.menuItemSettings||{};const drinkProducts=products.filter(p=>productCategory(p)==='飲品類');const allDrinkIds=drinkProducts.map(p=>String(p.id));giftDrinkIds=Array.isArray(cfg.customerOrderGiftDrinkProductIds)?cfg.customerOrderGiftDrinkProductIds.map(String).filter(id=>allDrinkIds.includes(id)):[];soldOutDrinkIds=cfg.customerOrderSoldOutDate===localDate(new Date())?new Set((cfg.customerOrderSoldOutProductIds||[]).map(String)):new Set();rates={...rates,...(s.data?.settings_json||{})};renderCategories();renderQuickOptions();renderProducts()}
function renderCategories(){const cats=CATEGORY_ORDER.filter(c=>products.some(p=>productCategory(p)===c));document.getElementById('categories').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}
function setCategory(c){category=c;renderCategories();renderProducts()}
function setChannel(c){channel=c;if(c!=='onsite'){giftQty={}};document.querySelectorAll('.channel').forEach(b=>b.classList.toggle('active',b.dataset.channel===c));document.getElementById('cart-channel').textContent=CHANNELS[c].label;document.getElementById('submit').className='submit '+(c==='onsite'?'':c);renderProducts();renderCart()}
function renderQuickOptions(){const groups={spice_level:{id:'quick-spice',values:['不辣','小辣','中辣','大辣']},sauce_level:{id:'quick-sauce',values:['醬多','醬少','不醬']},pepper_level:{id:'quick-pepper',values:['胡椒多','胡椒少','不胡椒']}};for(const [key,group] of Object.entries(groups)){document.getElementById(group.id).innerHTML=group.values.map(v=>`<button type="button" class="${quickOptions[key]===v?'selected':''}" aria-pressed="${quickOptions[key]===v}" onclick="toggleQuickOption('${key}','${v}')">${v}</button>`).join('')}}
function toggleQuickOption(key,value){quickOptions[key]=quickOptions[key]===value?null:value;renderQuickOptions()}
function productDisplayName(p){return p.name||p.product_name||p.title||p.item_name||p.display_name||'未命名商品'}
function renderProducts(){
  const list = products.filter(
    p => !category || productCategory(p) === category
  );

  document.getElementById('products').innerHTML =
    list.map(p => {
      const info = images[String(p.id)];
      const url = typeof info === 'string'
        ? info
        : (info?.url || info?.image_url || info?.src || info?.publicUrl || '');

      const price = priceFor(p);
      const name = productDisplayName(p);

      return `
        <article class="product" onclick="addItem('${esc(p.id)}')">
          ${url
            ? `<img src="${esc(url)}" alt="${esc(name)}" loading="lazy">`
            : '<div class="noimg">🍢</div>'
          }
          <div class="pbody">
            <div class="pname">${esc(name)}</div>
            <div class="pprice">${price === null ? '無法計算' : money(price)}</div>
            <div class="psub">
              ${CHANNELS[channel].label}・${channel === 'onsite' ? '現場售價' : '打平售價'}
            </div>
          </div>
        </article>
      `;
    }).join('') || '<div class="empty">沒有符合的品項</div>';
}

function addItem(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const price=priceFor(p);if(price===null){alert('抽成率為 100%，無法計算打平售價');return}const productId=String(p.id),options={...quickOptions},key=[productId,options.spice_level||'',options.sauce_level||'',options.pepper_level||''].join('|');cart[key]??={product_id:p.id,name:productDisplayName(p),quantity:0,unit_price:price,image_url:(typeof images[productId]==='string'?images[productId]:images[productId]?.url)||'',category:productCategory(p),...options};cart[key].quantity++;cart[key].unit_price=price;renderCart()}
function adjust(id,delta){if(!cart[id])return;cart[id].quantity+=delta;if(cart[id].quantity<=0)delete cart[id];renderCart()}
function removeItem(id){if(!cart[id])return;delete cart[id];renderCart()}
function paidTotal(){return Object.values(cart).reduce((sum,i)=>sum+i.quantity*i.unit_price,0)}
function giftLimit(){return Math.floor(paidTotal()/400)}
function selectedGiftCount(){return Object.values(giftQty).reduce((sum,n)=>sum+(Number(n)||0),0)}
function changeGiftQty(id,delta){const max=giftLimit(),current=Number(giftQty[id])||0;if(delta>0&&selectedGiftCount()>=max)return;const next=Math.max(0,Math.min(max,current+delta));if(next)giftQty[id]=next;else delete giftQty[id];renderCart()}
function renderCart(){let excess=Math.max(0,selectedGiftCount()-giftLimit());for(const id of Object.keys(giftQty).reverse()){if(excess<=0)break;const take=Math.min(excess,Number(giftQty[id])||0);giftQty[id]-=take;excess-=take;if(giftQty[id]<=0)delete giftQty[id]}const entries=Object.entries(cart),total=paidTotal(),drinks=products.filter(p=>giftDrinkIds.includes(String(p.id))&&!soldOutDrinkIds.has(String(p.id)));const spiceOrder=['不辣','小辣','中辣','大辣'];const row=([id,i])=>`<div class="cart-row"><div class="cart-product-cell"><div class="cart-product-meta"><strong title="${esc(i.name)}">${esc(i.name)}</strong>${(i.sauce_level||i.pepper_level)?`<small class="cart-item-options">${[i.sauce_level&&esc(i.sauce_level),i.pepper_level&&esc(i.pepper_level)].filter(Boolean).join('・')}</small>`:''}</div><button class="cart-delete" title="刪除商品" onclick="removeItem('${esc(id)}')">×</button></div><div class="cart-unit-price">${money(i.unit_price)}</div><div class="cart-qty-cell"><div class="qty cart-qty-line"><button onclick="adjust('${esc(id)}',-1)">−</button><b>${i.quantity}</b><button onclick="adjust('${esc(id)}',1)">＋</button></div></div><div class="cart-line-subtotal">${money(i.quantity*i.unit_price)}</div></div>`;let html=entries.length?spiceOrder.map(spice=>{const group=entries.filter(([,i])=>(i.spice_level||'不辣')===spice);return group.length?`<section class="cart-spice-group"><div class="cart-spice-title">${spice}</div>${group.map(row).join('')}</section>`:''}).join(''):'<div class="cart-empty">尚未選擇餐點</div>';if(channel==='onsite'&&giftLimit()>0){html+=`<div class="gift-panel"><h3>🎁 滿額贈飲料｜可選 ${giftLimit()} 杯，已選 ${selectedGiftCount()} 杯</h3>${drinks.map(p=>{const id=String(p.id),qty=Number(giftQty[id])||0;return `<div class="gift-row"><strong>${esc(p.name)}</strong><div class="gift-controls"><button onclick="changeGiftQty('${esc(id)}',-1)">−</button><b>${qty}</b><button onclick="changeGiftQty('${esc(id)}',1)" ${selectedGiftCount()>=giftLimit()?'disabled':''}>＋</button></div></div>`}).join('')||'<small>目前沒有可供贈送的飲料（可能尚未設定或皆已售完）</small>'}</div>`}document.getElementById('cart').innerHTML=html;document.getElementById('total').textContent=money(total);document.getElementById('cart-quantity').textContent=Object.values(cart).reduce((n,i)=>n+i.quantity,0)+selectedGiftCount()}
async function submitOrder(){if(submittingOrder)return;const entries=Object.values(cart);if(!entries.length){alert('請先選擇餐點');return}const total=paidTotal();const giftItems=(channel==='onsite'?Object.entries(giftQty).filter(([,quantity])=>Number(quantity)>0).map(([id,quantity])=>{const p=products.find(x=>String(x.id)===String(id));return {product_id:p?.id,name:p?.name||'贈品飲料',quantity:Number(quantity),unit_price:0,subtotal:0,is_gift:true,category:'飲品類'}}):[]);if(channel==='onsite'&&selectedGiftCount()>giftLimit()){alert('贈品飲料數量超過可贈送杯數');return}const payload={channel,items:[...entries.map(i=>({...i,subtotal:i.quantity*i.unit_price,is_gift:false})),...giftItems],total_amount:total,note:'',status:'new'};submittingOrder=true;const button=document.getElementById('submit');button.disabled=true;button.textContent='送單中…';try{const {error}=await sb.from('pos_orders').insert(payload);if(error){alert('送單失敗：'+error.message);return}cart={};giftQty={};quickOptions={spice_level:'不辣',sauce_level:null,pepper_level:null};renderQuickOptions();renderCart();openSuccess()}catch(e){console.error(e);alert('送單失敗：'+(e?.message||'請稍後再試'))}finally{submittingOrder=false;button.disabled=false;button.textContent='送出訂單'}}
function openSuccess(){document.getElementById('success-overlay').classList.add('show')}
function closeSuccess(){document.getElementById('success-overlay').classList.remove('show')}
function dateBounds(dateString){const [y,m,d]=dateString.split('-').map(Number);const start=new Date(y,m-1,d,0,0,0,0);const end=new Date(y,m-1,d+1,0,0,0,0);return {start,end}}
async function loadOrders(){const {start,end}=dateBounds(selectedOrderDate);const {data,error}=await sb.from('pos_orders').select('*').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at',{ascending:false});if(error){console.error(error);return}orders=data||[];renderOrders()} 
function applyOrderDate(){if(!selectedOrderDate)return;loadOrders()}
function updateDateTriggerText(){const el=document.getElementById('date-trigger-text');if(el)el.textContent=selectedOrderDate||'選擇日期'}
function toggleDatePicker(e){if(e)e.stopPropagation();const panel=document.getElementById('date-picker');const trigger=document.getElementById('date-trigger');const open=panel.classList.contains('show');if(open){closeDatePicker();return}const parts=(selectedOrderDate||localDate(new Date())).split('-').map(Number);pickerYear=parts[0];pickerMonth=parts[1]-1;tempPickerDate=selectedOrderDate;renderDatePicker();panel.classList.add('show');trigger.classList.add('open');trigger.setAttribute('aria-expanded','true');setTimeout(()=>document.addEventListener('click',onDatePickerOutside),0)}
function closeDatePicker(){const panel=document.getElementById('date-picker');const trigger=document.getElementById('date-trigger');panel.classList.remove('show');trigger.classList.remove('open');trigger.setAttribute('aria-expanded','false');document.removeEventListener('click',onDatePickerOutside)}
function onDatePickerOutside(e){const panel=document.getElementById('date-picker');const trigger=document.getElementById('date-trigger');if(panel.contains(e.target)||trigger.contains(e.target))return;closeDatePicker()}
function changePickerMonth(delta){pickerMonth+=delta;if(pickerMonth<0){pickerMonth=11;pickerYear--}else if(pickerMonth>11){pickerMonth=0;pickerYear++}renderDatePicker()}
function renderDatePicker(){const title=document.getElementById('dp-title');const daysEl=document.getElementById('dp-days');title.textContent=pickerYear+' 年 '+(pickerMonth+1)+' 月';const first=new Date(pickerYear,pickerMonth,1);const startWeekday=first.getDay();const daysInMonth=new Date(pickerYear,pickerMonth+1,0).getDate();const prevDays=new Date(pickerYear,pickerMonth,0).getDate();const todayStr=localDate(new Date());let html='';for(let i=0;i<startWeekday;i++){const d=prevDays-startWeekday+i+1;html+=`<button type="button" class="dp-day other" disabled>${d}</button>`}for(let d=1;d<=daysInMonth;d++){const ds=pickerYear+'-'+String(pickerMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const cls=['dp-day'];if(ds===todayStr)cls.push('today');if(ds===tempPickerDate)cls.push('selected');html+=`<button type="button" class="${cls.join(' ')}" onclick="selectPickerDate('${ds}')">${d}</button>`}const totalCells=startWeekday+daysInMonth;const remain=(7-totalCells%7)%7;for(let i=1;i<=remain;i++){html+=`<button type="button" class="dp-day other" disabled>${i}</button>`}daysEl.innerHTML=html}
function selectPickerDate(ds){tempPickerDate=ds;renderDatePicker()}
function pickToday(){tempPickerDate=localDate(new Date());const parts=tempPickerDate.split('-').map(Number);pickerYear=parts[0];pickerMonth=parts[1]-1;renderDatePicker()}
function confirmPickerDate(){if(!tempPickerDate)return;selectedOrderDate=tempPickerDate;updateDateTriggerText();closeDatePicker();loadOrders()}
function backToToday(){selectedOrderDate=localDate(new Date());updateDateTriggerText();closeDatePicker();loadOrders()}
function renderOrders(){
  const sum={onsite:0,ubereats:0,foodpanda:0};
  orders.forEach(o=>sum[o.channel]=(sum[o.channel]||0)+Number(o.total_amount||0));
  document.getElementById('summary').innerHTML=Object.entries(CHANNELS).map(([k,v])=>`<div class="metric" style="border-top:5px solid ${v.color}">${v.label}<b>${money(sum[k])}</b><small>${orders.filter(o=>o.channel===k).length} 筆訂單</small></div>`).join('');
  const rows=orders.filter(o=>orderFilter==='all'||o.channel===orderFilter);
  document.getElementById('query-date-label').textContent='目前查詢：'+selectedOrderDate;
  const statusMap={new:'待製作',preparing:'製作中',completed:'已完成',cancelled:'已取消'};
  document.getElementById('today-orders').innerHTML=rows.map(o=>{
    const ch=o.channel||'onsite';
    const chClass='ch-'+(CHANNELS[ch]?ch:'onsite');
    const items=Array.isArray(o.items)?o.items:[];
    const spiceOrder=['不辣','小辣','中辣','大辣'];
    const bySpice={};
    items.forEach(i=>{
      const sp=spiceOrder.includes(i.spice_level)?i.spice_level:(i.is_gift?'贈品':(i.spice_level||'其他'));
      (bySpice[sp]=bySpice[sp]||[]).push(i);
    });
    const groupOrder=[...spiceOrder,'贈品','其他'];
    const itemsHtml=groupOrder.filter(sp=>bySpice[sp]?.length).map(sp=>{
      const rows=bySpice[sp].map(i=>{
        const gift=!!i.is_gift;
        const qty=Number(i.quantity)||0;
        const unit=Number(i.unit_price)||0;
        const sub=i.subtotal!=null?Number(i.subtotal):(unit*qty);
        const opts=[];
        if(i.sauce_level)opts.push(esc(i.sauce_level));
        if(i.pepper_level)opts.push(esc(i.pepper_level));
        return `<div class="oi-row ${gift?'order-item-gift':''}">
          <div class="oi-name">${esc(i.name||i.product_name||'餐點')}${gift?'<span class="gift-badge">贈品</span>':''}${opts.length?`<small class="order-item-opts">${opts.join('・')}</small>`:''}</div>
          <div class="oi-unit">${gift?'—':money(unit)}</div>
          <div class="oi-qty">${qty}</div>
          <div class="oi-sub">${gift?'—':money(sub)}</div>
        </div>`;
      }).join('');
      return `<div class="oi-spice-group"><div class="oi-spice-title">${esc(sp)}</div><div class="oi-head"><span>商品名稱</span><span>單價</span><span>數量</span><span>小計</span></div>${rows}</div>`;
    }).join('')||'<div style="color:#897866;padding:8px 0">（無品項）</div>';
    const st=o.status||'new';
    const actions=`<button class="order-edit-btn" onclick="openEditOrder('${o.id}')">修改訂單</button>`+(st==='new'?`<button class="start-btn" onclick="setOrderStatus('${o.id}','preparing')">開始製作</button>`:'')+(st==='preparing'?`<button class="done-btn" onclick="setOrderStatus('${o.id}','completed')">完成</button>`:'');
    return `<article class="order-card ${chClass}">
      <div class="order-card-head"><span>#${esc(o.order_no)}・${esc(CHANNELS[ch]?.label||ch)}</span><span class="status-pill ${st}">${statusMap[st]||st}</span></div>
      <div class="order-card-body">
        <div class="order-items-table">${itemsHtml}</div>
        <div class="order-meta">
          <span>${new Date(o.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span>
          <span class="order-amount">${money(o.total_amount)}</span>
          ${o.note?`<span>備註：${esc(o.note)}</span>`:''}
        </div>
        <div class="status-actions">${actions}</div>
      </div>
    </article>`;
  }).join('')||'<div class="empty">這一天沒有訂單</div>';
}
function filterOrders(f){orderFilter=f;renderOrders()}
async function setOrderStatus(id,status){const {error}=await sb.from('pos_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('更新失敗：'+error.message);return}await loadOrders()}
function showView(view,button){document.getElementById('cashier').style.display=view==='cashier'?'block':'none';document.getElementById('orders').style.display=view==='orders'?'block':'none';document.getElementById('page-title').textContent=view==='cashier'?'收銀台':'今日訂單';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b===button));if(view==='orders')loadOrders()}

let editingOrderId=null,editingItems=[],editAddCategory='',editAddSpice='不辣',editAddSauce='',editAddPepper='';
function openEditOrder(id){
  const o=orders.find(x=>String(x.id)===String(id));
  if(!o){alert('找不到訂單');return;}
  editingOrderId=id;
  editingItems=(Array.isArray(o.items)?o.items:[]).map(i=>({
    product_id:i.product_id,
    name:i.name||i.product_name||'餐點',
    quantity:Number(i.quantity)||1,
    unit_price:Number(i.unit_price)||0,
    subtotal:Number(i.subtotal)!=null?Number(i.subtotal):(Number(i.unit_price)||0)*(Number(i.quantity)||0),
    is_gift:!!i.is_gift,
    spice_level:i.spice_level||'不辣',
    sauce_level:i.sauce_level||null,
    pepper_level:i.pepper_level||null,
    category:i.category||''
  }));
  const cats=CATEGORY_ORDER.filter(c=>products.some(pr=>productCategory(pr)===c));
  editAddCategory=cats[0]||'碳烤伴餐類';
  editAddSpice='不辣';editAddSauce='';editAddPepper='';
  document.getElementById('edit-title').textContent='修改訂單 #'+(o.order_no||'');
  renderEditBody();
  document.getElementById('edit-overlay').classList.add('show');
}
function closeEditOrder(){
  document.getElementById('edit-overlay').classList.remove('show');
  editingOrderId=null;editingItems=[];
}
function renderEditBody(){
  const spice=['不辣','小辣','中辣','大辣'];
  const body=document.getElementById('edit-body');
  const rows=editingItems.length?editingItems.map((i,idx)=>{
    const spiceOpts=spice.map(s=>`<option value="${s}" ${i.spice_level===s?'selected':''}>${s}</option>`).join('');
    const optBits=[i.sauce_level,i.pepper_level].filter(Boolean).map(esc).join('・');
    return `<div class="edit-row">
      <div><strong>${esc(i.name)}</strong>${i.is_gift?' <span class="gift-badge">贈品</span>':''}${optBits?`<small class="order-item-opts">${optBits}</small>`:''}<div style="font-size:12px;color:#897866;margin-top:2px">${money(i.unit_price)}</div></div>
      <select onchange="editingItems[${idx}].spice_level=this.value">${spiceOpts}</select>
      <input type="number" min="1" max="99" value="${i.quantity}" onchange="editQty(${idx},this.value)">
      <button type="button" class="cart-delete" onclick="editRemove(${idx})" title="移除">×</button>
    </div>`;
  }).join(''):'<p style="color:#897866">尚未有品項，請下方加點</p>';

  const cats=CATEGORY_ORDER.filter(c=>products.some(pr=>productCategory(pr)===c));
  const catBtns=cats.map(c=>`<button type="button" class="${editAddCategory===c?'active':''}" onclick="editAddCategory='${c}';renderEditBody()">${c}</button>`).join('');
  const list=products.filter(pr=>productCategory(pr)===editAddCategory);
  const prodBtns=list.map(pr=>{
    const price=Number(pr.price)||0;
    const name=productDisplayName(pr);
    return `<button type="button" onclick="editAddProduct('${esc(String(pr.id))}')">${esc(name)}<br><small>${money(price)}</small></button>`;
  }).join('')||'<span style="color:#897866;font-size:12px">此分類無品項</span>';

  const spiceOpts=spice.map(s=>`<option value="${s}" ${editAddSpice===s?'selected':''}>${s}</option>`).join('');
  const sauceOpts=['','醬多','醬少','不醬'].map(s=>`<option value="${s}" ${editAddSauce===s?'selected':''}>${s||'醬料'}</option>`).join('');
  const pepperOpts=['','胡椒多','胡椒少','不胡椒'].map(s=>`<option value="${s}" ${editAddPepper===s?'selected':''}>${s||'胡椒'}</option>`).join('');

  body.innerHTML=`
    <div style="font-weight:900;margin-bottom:6px">目前品項</div>
    ${rows}
    <div class="edit-add-panel">
      <h4>➕ 加點品項</h4>
      <div class="edit-add-opts">
        <select onchange="editAddSpice=this.value">${spiceOpts}</select>
        <select onchange="editAddSauce=this.value">${sauceOpts}</select>
        <select onchange="editAddPepper=this.value">${pepperOpts}</select>
      </div>
      <div class="edit-add-cats">${catBtns}</div>
      <div class="edit-add-products">${prodBtns}</div>
    </div>
    <p style="font-size:12px;color:#897866;margin:10px 0 0">可加點、改辣度／數量或移除；儲存後會同步到廚房。</p>`;
}
function editQty(idx,val){
  const n=Math.max(1,Math.min(99,Number(val)||1));
  editingItems[idx].quantity=n;
  if(!editingItems[idx].is_gift)editingItems[idx].subtotal=(Number(editingItems[idx].unit_price)||0)*n;
}
function editRemove(idx){
  editingItems.splice(idx,1);
  renderEditBody();
}
function editAddProduct(id){
  const pr=products.find(x=>String(x.id)===String(id));
  if(!pr)return;
  const price=Number(pr.price)||0;
  const name=productDisplayName(pr);
  const spice=editAddSpice||'不辣';
  const sauce=editAddSauce||null;
  const pepper=editAddPepper||null;
  // merge same product+options
  const key=[String(pr.id),spice,sauce||'',pepper||''].join('|');
  const existing=editingItems.find(i=>!i.is_gift&&[String(i.product_id),i.spice_level||'',i.sauce_level||'',i.pepper_level||''].join('|')===key);
  if(existing){
    existing.quantity+=1;
    existing.subtotal=(Number(existing.unit_price)||0)*existing.quantity;
  }else{
    editingItems.push({
      product_id:pr.id,
      name,
      quantity:1,
      unit_price:price,
      subtotal:price,
      is_gift:false,
      spice_level:spice,
      sauce_level:sauce,
      pepper_level:pepper,
      category:productCategory(pr)
    });
  }
  renderEditBody();
}
async function saveEditOrder(){
  if(!editingOrderId)return;
  if(!editingItems.length){alert('至少保留一個品項');return;}
  const items=editingItems.map(i=>({
    product_id:i.product_id,
    name:i.name,
    quantity:Number(i.quantity)||1,
    unit_price:Number(i.unit_price)||0,
    subtotal:i.is_gift?0:(Number(i.unit_price)||0)*(Number(i.quantity)||1),
    is_gift:!!i.is_gift,
    spice_level:i.spice_level||'不辣',
    sauce_level:i.sauce_level||null,
    pepper_level:i.pepper_level||null,
    category:i.category||''
  }));
  const total=items.reduce((s,i)=>s+(i.is_gift?0:Number(i.subtotal)||0),0);
  const {error}=await sb.from('pos_orders').update({
    items,
    total_amount:total,
    updated_at:new Date().toISOString()
  }).eq('id',editingOrderId);
  if(error){alert('儲存失敗：'+error.message);return;}
  closeEditOrder();
  await loadOrders();
}

function subscribe(){if(realtime)sb.removeChannel(realtime);realtime=sb.channel('pos-orders-live').on('postgres_changes',{event:'*',schema:'public',table:'pos_orders'},()=>loadOrders()).subscribe()}
boot().catch(e=>{console.error(e);showLogin('載入失敗：'+e.message)});
