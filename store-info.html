<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店面資訊｜馬鈴吉碳烤</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8eddb;--card:#fffaf1;--ink:#493b30;--muted:#887968;--accent:#a65e36;--line:#eadbc7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif;padding:24px 14px}
main{max-width:620px;margin:auto}
header{text-align:center;padding:20px 10px 26px}
h1{font-size:27px;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 16px}
.hours{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hours:last-child{border:0}
.closed{color:#a34d3b}
.open{color:#52764d}
.notice{line-height:1.8;white-space:pre-wrap}
label{display:block;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
textarea{min-height:76px;resize:vertical}
button{border:0;border-radius:10px;background:var(--accent);color:white;padding:12px 18px;font-size:15px;cursor:pointer}
button.secondary{background:#8b7b69}
button:disabled{opacity:.55}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hidden{display:none!important}
.status{font-size:14px;color:var(--muted);margin-top:12px;white-space:pre-wrap}
.day-editor{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;align-items:center;margin:10px 0}
.day-editor input[type=checkbox]{width:18px;height:18px}
.day-editor input[type=time]{min-width:0}
@media(max-width:420px){body{padding:14px 10px}.card{padding:16px}.day-editor{grid-template-columns:70px 1fr 1fr}}

.map-wrap{width:100%;overflow:hidden;border-radius:12px}
.map-wrap iframe{display:block;width:100%;height:340px;border:0}
@media(max-width:420px){.map-wrap iframe{height:260px}}


body{background:linear-gradient(180deg,#efddc5,#f8eddb 280px);padding:18px 14px 40px}
main{max-width:680px}
header{padding:28px 10px}
h1{font-size:clamp(30px,7vw,38px);font-weight:900;letter-spacing:2px;color:#69432d}
.subtitle{letter-spacing:2px}
.card{border-radius:20px;padding:22px;border-color:#ead8c0;box-shadow:0 7px 22px #76502b12}
h2{font-size:19px;font-weight:800;color:#74482e}
.hours{padding:14px 2px}
.notice{font-size:15px;line-height:1.9}
.store-address{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px;background:#f7eddf;border-radius:13px;line-height:1.7}
.store-address a{flex-shrink:0;color:white;background:#a65e36;padding:10px 14px;border-radius:10px;text-decoration:none;font-size:14px}
.next-open{padding:17px 19px;background:#70472f;color:white;border-radius:16px;margin-bottom:17px}
.next-open small{display:block;color:#f2d9bd;font-size:13px;margin-bottom:6px}
.next-open strong{font-size:20px}
.invoice-tag{display:inline-block;padding:9px 15px;border-radius:30px;background:#e8f0df;color:#49683f;font-weight:800;font-size:14px;margin-top:12px}
button{font-weight:700;min-height:44px}
input,textarea{padding:13px;border-radius:11px}
@media(max-width:420px){body{padding:12px 10px 30px}.card{padding:17px}.map-wrap iframe{height:245px}.store-address{align-items:flex-start;flex-direction:column}.store-address a{width:100%;text-align:center}}
</style>
</head>
<body>
<main>
<header>
<h1 id="storeTitle">馬鈴吉碳烤</h1>
<div class="invoice-tag">&#10003; &#26412;&#24215;&#20813;&#38283;&#32113;&#19968;&#30332;&#31080;</div>
</header>


<section class="card">
 <h2>&#24215;&#38754;&#20301;&#32622;</h2>
 <div class="map-wrap">
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3617.2594754954484!2d121.29638007592358!3d24.957285041375606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34681949a5c8ba57%3A0xc973dd1e00e800d!2z6aas6Yi05ZCJ56Kz54Ok!5e0!3m2!1szh-TW!2stw!4v1795555581190!5m2!1szh-TW!2stw" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
 </div>
</section>
<section class="card">
<h2>&#24215;&#38754;&#22320;&#22336;</h2>
<div class="store-address"><span id="addressView">&#22320;&#22336;&#36617;&#20837;&#20013;</span><a id="mapLink" href="#" target="_blank" rel="noopener">&#23566;&#33322;&#21069;&#24448; &#8599;</a></div>
</section>
<div class="next-open"><small>&#19979;&#27425;&#29151;&#26989;&#26178;&#27573;</small><strong id="nextOpenView">&#35336;&#31639;&#20013;</strong></div>
<section class="card">
<h2>營業時間</h2>
<div id="hoursView">載入中…</div>
</section>





<section class="card hidden" id="loginPanel">
<h2>店家登入</h2>
<label>登入信箱</label>
<input id="email" type="email" autocomplete="username">
<label>密碼</label>
<input id="password" type="password" autocomplete="current-password">
<div class="actions"><button id="loginBtn">登入並修改資訊</button></div>
<div class="status" id="loginStatus"></div>
</section>

<section class="card hidden" id="editPanel">
<h2>修改店面資訊</h2>
<label>店家名稱</label>
<input id="editName">
<label>&#24215;&#23478;&#22320;&#22336;</label>
<input id="editAddress" placeholder="Address">
<label><input id="cashEnabled" type="checkbox"> 開放現金付款</label>
<label><input id="bankEnabled" type="checkbox"> 開放銀行轉帳</label>
<label>銀行轉帳說明</label>
<textarea id="bankNote"></textarea>
<label>取餐注意事項</label>
<textarea id="pickupNotice"></textarea>
<label>每日營業時間</label>
<div id="hoursEditor"></div>
<div class="actions">
<button id="saveBtn">儲存修改</button>
<button class="secondary" id="logoutBtn">登出</button>
</div>
<div class="status" id="editStatus"></div>
</section>
</main>

<script>
const SUPABASE_URL='https://gyonwgjafukzlmnosykt.supabase.co';
const SUPABASE_KEY='sb_publishable_T6IA7G9XaIvuGN-fOMX7Xw_FlPoi0OP';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const editing=new URLSearchParams(location.search).get('edit')==='1';
const days=['mon','tue','wed','thu','fri','sat','sun'];
let currentInfo=null;

const defaultHours={
mon:{label:'星期一',open:true,start:'17:30',end:'00:00'},
tue:{label:'星期二',open:true,start:'17:30',end:'00:00'},
wed:{label:'星期三',open:false,start:'17:30',end:'00:00'},
thu:{label:'星期四',open:true,start:'17:30',end:'00:00'},
fri:{label:'星期五',open:true,start:'17:30',end:'00:00'},
sat:{label:'星期六',open:true,start:'17:30',end:'00:00'},
sun:{label:'星期日',open:true,start:'17:30',end:'00:00'}
};

function el(id){return document.getElementById(id)}
function showStatus(id,msg){el(id).textContent=msg}

function renderNextOpening(hours){
const parts=new Intl.DateTimeFormat('en-US',{
timeZone:'Asia/Taipei',weekday:'short',year:'numeric',
month:'2-digit',day:'2-digit',hour:'2-digit',
minute:'2-digit',hourCycle:'h23'
}).formatToParts(new Date());
const p={};
parts.forEach(x=>p[x.type]=x.value);
const week=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const today=week.indexOf(p.weekday);
const minutes=Number(p.hour)*60+Number(p.minute);
const keys=['sun','mon','tue','wed','thu','fri','sat'];
for(let i=0;i<8;i++){
const d=hours[keys[(today+i)%7]]||defaultHours[keys[(today+i)%7]];
if(!d.open)continue;
const start=d.start||'17:30';
const sm=Number(start.slice(0,2))*60+Number(start.slice(3,5));
if(i===0&&minutes>=sm)continue;
const label=i===0?'\u4eca\u5929':i===1?'\u660e\u5929':d.label;
el('nextOpenView').textContent=label+' '+start+' \u958b\u59cb\u71df\u696d';
return;
}
el('nextOpenView').textContent='--';
}

function renderPublic(info){
el('storeTitle').textContent=info.store_name||'&#39340;&#37428;&#21513;&#30899;&#28907;';
const address=info.store_address||'\u6843\u5712\u5e02\u516b\u5fb7\u5340\u5927\u548c\u91cc\u4ecb\u58fd\u8def\u4e8c\u6bb518\u865f';
el('addressView').textContent=address;
el('mapLink').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address);
renderNextOpening(info.business_hours||defaultHours);
const hours=info.business_hours||defaultHours;
el('hoursView').innerHTML=days.map(day=>{
const d=hours[day]||defaultHours[day];
return `<div class="hours"><span>${d.label}</span><strong class="${d.open?'open':'closed'}">${d.open?`${d.start}－${d.end}`:'公休'}</strong></div>`;
}).join('');
const payments=[];
if(info.payment_cash_enabled)payments.push('現金');
if(info.payment_bank_transfer_enabled)payments.push('銀行轉帳');
el('paymentView').textContent=payments.length?payments.join('、'):'目前未開放付款方式';
if(info.payment_bank_transfer_enabled&&info.bank_transfer_note){
el('paymentView').textContent+=(payments.length?'\n':'')+info.bank_transfer_note;
}
el('pickupView').textContent=info.pickup_notice||'';
}

function renderEditor(info){
el('editName').value=info.store_name||'';
el('editAddress').value=info.store_address||'\u6843\u5712\u5e02\u516b\u5fb7\u5340\u5927\u548c\u91cc\u4ecb\u58fd\u8def\u4e8c\u6bb518\u865f';
el('cashEnabled').checked=!!info.payment_cash_enabled;
el('bankEnabled').checked=!!info.payment_bank_transfer_enabled;
el('bankNote').value=info.bank_transfer_note||'';
el('pickupNotice').value=info.pickup_notice||'';
const hours=info.business_hours||defaultHours;
el('hoursEditor').innerHTML=days.map(day=>{
const d=hours[day]||defaultHours[day];
return `<div class="day-editor">
<strong>${d.label}</strong>
<label><input type="checkbox" data-day="${day}" class="day-open" ${d.open?'checked':''}>營業</label>
<input type="time" data-day="${day}" data-field="start" value="${d.start||'17:30'}">
<input type="time" data-day="${day}" data-field="end" value="${d.end||'00:00'}">
</div>`;
}).join('');
}

async function loadInfo(){
const {data,error}=await db.from('store_public_info').select('*').eq('id',true).single();
if(error){
el('hoursView').textContent='店面資訊載入失敗，請稍後再試。';
el('paymentView').textContent=error.message;
return;
}
currentInfo=data;
renderPublic(data);
if(editing){
el('loginPanel').classList.remove('hidden');
const {data:{session}}=await db.auth.getSession();
if(session)await checkOwner();
}
}

async function checkOwner(){
const {data:{user}}=await db.auth.getUser();
if(user?.app_metadata?.role!=='store_owner'){
await db.auth.signOut();
showStatus('loginStatus','此帳號沒有店家修改權限。');
return;
}
el('loginPanel').classList.add('hidden');
el('editPanel').classList.remove('hidden');
renderEditor(currentInfo);
}

el('loginBtn').addEventListener('click',async()=>{
el('loginBtn').disabled=true;
showStatus('loginStatus','登入中…');
const {error}=await db.auth.signInWithPassword({
email:el('email').value.trim(),
password:el('password').value
});
el('loginBtn').disabled=false;
if(error){showStatus('loginStatus','登入失敗：'+error.message);return;}
await checkOwner();
});

el('saveBtn').addEventListener('click',async()=>{
el('saveBtn').disabled=true;
showStatus('editStatus','儲存中…');
const hours={};
days.forEach(day=>{
const old=(currentInfo.business_hours||defaultHours)[day]||defaultHours[day];
const open=el('hoursEditor').querySelector(`.day-open[data-day="${day}"]`).checked;
hours[day]={
label:old.label,
open,
start:el('hoursEditor').querySelector(`[data-day="${day}"][data-field="start"]`).value,
end:el('hoursEditor').querySelector(`[data-day="${day}"][data-field="end"]`).value
};
});
const update={
store_name:el('editName').value.trim(),
store_address:el('editAddress').value.trim(),
payment_cash_enabled:el('cashEnabled').checked,
payment_bank_transfer_enabled:el('bankEnabled').checked,
bank_transfer_note:el('bankNote').value,
pickup_notice:el('pickupNotice').value,
business_hours:hours,
updated_at:new Date().toISOString()
};
const {data,error}=await db.from('store_public_info').update(update).eq('id',true).select().single();
el('saveBtn').disabled=false;
if(error){showStatus('editStatus','儲存失敗：'+error.message);return;}
currentInfo=data;
renderPublic(data);
renderEditor(data);
showStatus('editStatus','已成功儲存。');
});

el('logoutBtn').addEventListener('click',async()=>{
await db.auth.signOut();
el('editPanel').classList.add('hidden');
el('loginPanel').classList.remove('hidden');
showStatus('loginStatus','已登出。');
});

if(editing)el('loginPanel').classList.remove('hidden');
loadInfo();
</script>
</body>
</html>
