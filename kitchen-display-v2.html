  ];
  const active=all.filter(o=>!['completed','cancelled'].includes(o.status));
  const counts={onsite:0,ubereats:0,foodpanda:0,customer:0};
  active.forEach(o=>{if(counts[o._channel]!==undefined)counts[o._channel]++});
  Object.keys(counts).forEach(ch=>{
    const el=document.getElementById('count-'+ch);
    if(el)el.textContent=counts[ch];
  });
  notifyNewOrders(active);
  if(!notifyReady){notifyReady=true;syncNotifyBtn();}
  renderTickets();
}

function renderTickets(){
  const all=[
    ...pos.map(o=>({...o,_source:'pos',_channel:o.channel})),
    ...customer.filter(o=>!['completed','cancelled'].includes(o.status)).map(o=>({...o,_source:'customer',_channel:'customer'}))
  ];
  const active=all.filter(o=>!['completed','cancelled'].includes(o.status) && o._channel===activeChannel);
  // ??啣?????剝? direction:rtl 敺＊蝷箏??喲?
  active.sort((a,b)=>{
    const na=Number(a.order_no||a.daily_sequence)||0;
    const nb=Number(b.order_no||b.daily_sequence)||0;
    if(na&&nb&&na!==nb)return na-nb;
    return new Date(a.created_at)-new Date(b.created_at);
  });
  const rail=document.getElementById('ticket-rail');
  rail.innerHTML=active.length
    ? active.map(o=>ticket(o)).join('')
    : '<div class="empty">?桀?瘝?敺?????/div>';
}

function ticket(o){
  const isCustomer=o._source==='customer',state=o.status;
  const number=isCustomer?(o.daily_sequence||String(o.id).slice(0,6)):o.order_no;
  const items=Array.isArray(o.items)?o.items:[];
  const statusLabel=isCustomer&&state==='new'?'撠蝣箄?閮':({new:'敺???,confirmed:'撌脩Ⅱ隤?,preparing:'鋆賭?銝?,completed:'撌脣???,cancelled:'撌脣?瘨?}[state]||state);
  function ticketItemRow(i){
    const opts=[];
    if(!i.is_gift){
      if(i.sauce_level)opts.push('?祆?嚗?+esc(i.sauce_level));
      if(i.pepper_level)opts.push('?⊥?嚗?+esc(i.pepper_level));
    }
    return '<div class="ticket-item"><div class="ticket-item-name">'+esc(i.name||i.product_name||'擗?')+' ? '+(Number(i.quantity)||0)+(i.is_gift?' <span style="background:#e4f1df;color:#2d6b3e;font-size:12px;padding:2px 6px;border-radius:5px;font-weight:900">韐?</span>':'')+'</div>'+(opts.length?'<div class="ticket-item-options">'+opts.join('<br>')+'</div>':'')+'</div>';
  }
  const gifts=items.filter(i=>!!i.is_gift);
  const nonGifts=items.filter(i=>!i.is_gift);
  const spiceOrder=['銝麾','撠麾','銝剛麾','憭扯麾',null];
  let itemHtml='';
  if(gifts.length){
    itemHtml+='<section class="ticket-spice-group"><div class="ticket-spice-title">?? 韐?</div>'+gifts.map(ticketItemRow).join('')+'</section>';
  }
  itemHtml+=spiceOrder.map(spice=>{
    const rows=nonGifts.filter(i=>(['銝麾','撠麾','銝剛麾','憭扯麾'].includes(i.spice_level)?i.spice_level:null)===spice);
    if(!rows.length)return '';
    return '<section class="ticket-spice-group"><div class="ticket-spice-title">?儭?'+(spice||'?嗡?')+'</div>'+rows.map(ticketItemRow).join('')+'</section>';
  }).join('');
  const chClass='ch-'+(o._channel||(isCustomer?'customer':'onsite'));
  return '<article class="ticket '+chClass+(state==='completed'?' done':'')+'">'+
    '<div class="ticket-top"><span>'+(isCustomer?'摰Ｖ犖蝺?':'POS')+' #'+esc(number)+'</span><span class="tag">'+statusLabel+'</span></div>'+
    '<div class="ticket-body">'+
      '<div class="ticket-time">'+new Date(o.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+(isCustomer&&o.pickup_time?'??? '+new Date(o.pickup_time).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'')+'</div>'+
      '<div class="ticket-items">'+(itemHtml||'嚗擗??敦嚗?)+'</div>'+
      (isCustomer?'<div class="ticket-time">摰Ｖ犖嚗?+esc(o.customer_name||o.line_display_name||'?芣?靘?)+(o.customer_phone?'?'+esc(o.customer_phone):'')+'</div>':'')+
      ''+
    '</div>'+
    '<div class="ticket-actions">'+
      ((isCustomer?state==='confirmed':(state==='new'||state==='confirmed'))?(isCustomer?'<button class="start" onclick="updateCustomer(\''+o.id+'\',\'preparing\')">??鋆賭?</button>':'<button class="start" onclick="updatePos(\''+o.id+'\',\'preparing\')">??鋆賭?</button>'):'')+
      (state==='preparing'?'<button class="finish" onclick="'+(isCustomer?'updateCustomer(\''+o.id+'\',\'completed\')':'updatePos(\''+o.id+'\',\'completed\')')+'">摰?擗?</button>':'')+
    '</div>'+
  '</article>';
}

async function updatePos(id,status){
  const {error}=await sb.from('pos_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('?湔憭望?嚗?+error.message);return}
  await refresh();
}
async function updateCustomer(id,status){
  const {data,error}=await sb.functions.invoke('customer-orders',{body:{action:'owner-update-status',order_id:id,status}});
  if(error||!data?.ok){alert(data?.error||'摰Ｖ犖閮???啣仃??);return}
  await refresh();
}
function subscribe(){
  if(live)sb.removeChannel(live);
  live=sb.channel('malinji-kitchen-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'pos_orders'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'customer_orders'},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'customer_order_addons'},refresh)
    .subscribe();
}

function isStandaloneApp(){
  return (window.navigator.standalone===true) || window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches;
}
function canUseFullscreenApi(){
  const el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen);
}
function toggleFullscreen(){
  if(isStandaloneApp()){
    // Safari???乩蜓?恍??撌脫?函??函?ｇ?蝟餌絞銝?靘?Fullscreen API
    const btn=document.getElementById('fs-btn');
    if(btn){btn.textContent='撌脫銝餌?Ｗ?Ｗ?';btn.disabled=true;}
    return;
  }
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  if(!req){
    alert('甇斤汗?其??舀?刻撟???Safari??鈭????銝餌?Ｕ?敺蜓?恍?內???喳?亥??刻撟?);
    return;
  }
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(exit)exit.call(document);
  }else{
    const p=req.call(el);
    if(p&&p.catch)p.catch(function(){
      alert('?⊥??脣?刻撟Phone/iPad 隢?具??乩蜓?恍????);
    });
  }
}
function syncFsBtn(){
  const btn=document.getElementById('fs-btn');
  if(!btn)return;
  if(isStandaloneApp()){
    btn.textContent='銝餌?Ｘ芋撘?;
    btn.classList.add('is-fs');
    btn.title='撌脣?銝餌?ａ????祈澈?喟?刻撟＊蝷?;
    return;
  }
  const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  btn.classList.toggle('is-fs',on);
  btn.textContent=on?'????箏?Ｗ?':'???刻撟?;
}
document.addEventListener('fullscreenchange',syncFsBtn);
document.addEventListener('webkitfullscreenchange',syncFsBtn);
document.addEventListener('DOMContentLoaded',syncFsBtn);
setTimeout(syncFsBtn,300);

boot().catch(e=>{console.error(e);showLogin('頛憭望?嚗?+e.message)});

</script>
