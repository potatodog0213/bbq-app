<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬鈴吉碳烤 - 營運管理系統</title>
    <!-- 引入 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #ea580c;
            --primary-hover: #c2410c;
            --primary-light: #fff7ed;
            --bg-color: #fcf8f2; /* 溫和馬鈴薯暖白背景 */
            
            /* 馬鈴薯專屬深淺色系 */
            --card-potato-light: #fffdf9; /* 淺色：熱騰騰馬鈴薯泥 */
            --card-potato-dark: #faf2e8;  /* 深色：帶皮香烤馬鈴薯 */
            
            --text-main: #292524;
            --text-muted: #78716c;
            --border: #e7e5e4;
            --border-potato: #fde68a;     /* 溫暖金黃邊框 */
            --shadow: 0 4px 6px -1px rgba(120, 53, 15, 0.05), 0 2px 4px -2px rgba(120, 53, 15, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(234, 88, 12, 0.12), 0 4px 6px -4px rgba(234, 88, 12, 0.08);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 24px 16px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 700px; 
            margin: 0 auto; 
        }

        /* 質感主視覺 Header */
        .header { 
            text-align: center; 
            margin-bottom: 36px; 
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            padding: 32px 20px;
            border-radius: 20px;
            border: 1px solid #fed7aa;
            box-shadow: var(--shadow);
        }
        .header h1 { 
            font-size: 30px; 
            margin: 0 0 8px 0; 
            color: #9a3412; 
            letter-spacing: 0.5px;
        }
        .header p { 
            color: #c2410c; 
            font-size: 14.5px; 
            margin: 0; 
            font-weight: 500;
        }
        
        /* 主選單格線 (RWD 自動排版) */
        .menu-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 16px; 
        }
        @media (min-width: 600px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* 現代儀表板卡片設計 */
        .menu-card {
            background: var(--card-potato-light);
            padding: 22px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #fde68a;
            position: relative;
            overflow: hidden;
        }
        .menu-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 5px;
            background: #d97706;
            transition: background 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: #f97316;
        }
        .menu-card:hover::before {
            background: var(--primary);
        }
        .menu-card:active { transform: scale(0.98); }

        .menu-card-content h3 { 
            margin: 0 0 6px 0; 
            font-size: 17px; 
            color: var(--text-main); 
            font-weight: 700;
        }
        .menu-card-content span { 
            font-size: 13px; 
            color: var(--text-muted); 
            line-height: 1.4; 
            display: block; 
        }
        .arrow { 
            font-size: 20px; 
            color: #d97706; 
            font-weight: bold; 
            transition: transform 0.2s;
        }
        .menu-card:hover .arrow {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* 子頁面容器 */
        .page-view { 
            display: none; 
            background: #ffffff; 
            padding: 24px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(120, 53, 15, 0.05); 
            border: 1px solid #fde68a;
        }
        
        /* 頂部列 */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 12px;
            border-bottom: 1px solid #fed7aa;
            padding-bottom: 16px;
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn { 
            background: #78716c; 
            color: white; 
            border: none; 
            padding: 9px 14px; 
            border-radius: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13.5px; 
            transition: background 0.2s;
            white-space: nowrap;
        }
        .back-btn:hover { background: #57534e; }

        .action-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 9px 16px; 
            border-radius: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13.5px; 
            transition: background 0.2s;
            box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2);
            white-space: nowrap;
        }
        .action-btn:hover { background: var(--primary-hover); }
        .action-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        /* 資訊面板與搜尋控制列 */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #fffbeb;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #fde68a;
            font-size: 13.5px;
        }
        @media(min-width: 550px) {
            .controls-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .stats-info {
            display: flex;
            gap: 14px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .stats-info b { color: #9a3412; }

        .search-sort-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fcd34d;
            background: white;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
            width: 150px;
            transition: border-color 0.2s, width 0.2s;
        }
        .search-input:focus { border-color: var(--primary); width: 190px; }

        .controls-bar select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fcd34d;
            background: white;
            color: var(--text-main);
            font-size: 13.5px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .controls-bar select:focus { border-color: var(--primary); }

        /* 質感表單容器 */
        .form-card-container {
            background: linear-gradient(to bottom, #ffffff, #fffaf5);
            padding: 28px 20px;
            border-radius: 16px;
            border: 1px solid #fed7aa;
            box-shadow: 0 6px 16px rgba(234, 88, 12, 0.05);
            max-width: 500px;
            margin: 0 auto;
        }
        .form-header-title {
            font-size: 18px;
            font-weight: 700;
            color: #c2410c;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #fed7aa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; color: #44403c; }
        .form-group input { 
            width: 100%; 
            padding: 12px 14px; 
            box-sizing: border-box; 
            border: 1px solid #fed7aa; 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none; 
            background: #ffffff;
            transition: all 0.2s ease; 
        }
        .form-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.12); 
        }

        /* 內嵌提示訊息條 */
        .toast-msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .toast-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 卡片網格與馬鈴薯深淺交錯配色 */
        .items-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 600px) {
            .items-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .item-card { 
            background: var(--card-potato-light); /* 淺色：馬鈴薯泥 */
            border: 1px solid #fde68a; 
            padding: 18px; 
            border-radius: 14px; 
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .item-card.zebra-alt {
            background: var(--card-potato-dark); /* 深色：烤馬鈴薯熟成皮 */
            border-color: #fcd34d;
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: #f97316;
        }
        .item-card h4 { margin: 0 0 8px 0; color: #292524; font-size: 17px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .item-card h4 span { color: #c2410c; font-weight: 700; }
        .item-card p { margin: 4px 0; font-size: 13.5px; color: var(--text-muted); }
        .cost-rate, .total-amount-tag { color: #dc2626; font-weight: 700; }
        
        /* 卡片底部操作按鈕 */
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #fed7aa;
        }
        .card-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .edit-btn { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .edit-btn:hover { background: #dbeafe; }
        .delete-btn { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .delete-btn:hover { background: #fee2e2; }

        .item-card.confirm-delete-state {
            background: #fff5f5 !important;
            border-color: #fecaca;
        }

        /* 滾輪式日期選擇器彈窗 (Picker Modal) */
        .picker-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        .picker-modal {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            width: 320px;
            text-align: center;
            border: 1px solid #fed7aa;
        }
        .picker-modal h4 {
            margin: 0 0 16px 0;
            color: #c2410c;
            font-size: 17px;
        }
        .picker-wheels-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
            height: 160px;
            position: relative;
        }
        .picker-wheels-container::before {
            content: '';
            position: absolute;
            top: 60px; left: 0; width: 100%; height: 40px;
            border-top: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            background: rgba(234, 88, 12, 0.05);
            pointer-events: none;
        }
        .wheel-column {
            flex: 1;
            height: 100%;
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: y mandatory;
            padding: 60px 0;
            box-sizing: border-box;
        }
        .wheel-column::-webkit-scrollbar { display: none; }
        .wheel-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #78716c;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s;
        }
        .wheel-item.selected {
            color: #c2410c;
            font-size: 18px;
            font-weight: 700;
        }
        .picker-btn-group {
            display: flex;
            gap: 10px;
        }
        .picker-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .picker-confirm { background: var(--primary); color: white; }
        .picker-confirm:hover { background: var(--primary-hover); }
        .picker-cancel { background: #e2e8f0; color: #334155; }
        .picker-cancel:hover { background: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 首頁主選單 -->
        <div id="home-view">
            <div class="header">
                <h1>🔥 馬鈴吉碳烤</h1>
                <p>智慧營運管理與成本控制系統</p>
            </div>

            <div class="menu-grid">
                <div class="menu-card" onclick="openPage('products')">
                    <div class="menu-card-content">
                        <h3>販售品項成本表</h3>
                        <span>品項名稱、單價、成本、售價、成本率</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('materials')">
                    <div class="menu-card-content">
                        <h3>原物料與耗材價格表</h3>
                        <span>規格、單價、廠商與最後更新</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('purchases')">
                    <div class="menu-card-content">
                        <h3>每日叫貨記錄表</h3>
                        <span>日期、廠商、品項與實際到貨量</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('expenses')">
                    <div class="menu-card-content">
                        <h3>店內支出記錄表</h3>
                        <span>日期、項目、數量、金額與相關廠商</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('profit')" style="grid-column: 1 / -1;">
                    <div class="menu-card-content">
                        <h3>每月損益總表</h3>
                        <span>營業額、進貨總額、店內支出與淨利自動結算</span>
                    </div>
                    <div class="arrow">›</div>
                </div>
            </div>
        </div>

        <!-- 子頁面容器 -->
        <div id="sub-view" class="page-view">
            <div class="top-bar">
                <div class="top-left-group">
                    <button class="back-btn" onclick="goHome()">← 返回主選單</button>
                    <h2 id="page-title" style="margin:0; font-size: 18px; color:var(--text-main);"></h2>
                </div>
                <div id="top-action-container"></div>
            </div>
            <div id="page-content">載入中...</div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://gyonwgjafukzlmnosykt.supabase.co';
        const rawKey = 'sb_publishable_T6IA7G9XaIvuGN-fOMX7Xw_FlPoi0OP';
        const supabaseKey = rawKey.replace(/[^\x20-\x7E]/g, '').trim();
        
        let _supabase;
        let globalProductsData = [];
        let globalExpensesData = [];
        let currentPage = '';

        try {
            _supabase = supabase.createClient(supabaseUrl.trim(), supabaseKey);
        } catch (e) {
            alert('Supabase 初始化失敗：' + e.message);
        }

        function openPage(pageName) {
            currentPage = pageName;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            
            const titleEl = document.getElementById('page-title');
            const actionContainer = document.getElementById('top-action-container');
            actionContainer.innerHTML = ''; 

            if (pageName === 'products') {
                titleEl.innerText = '販售品項成本表';
                actionContainer.innerHTML = `<button class="action-btn" onclick="renderAddProductForm()">＋ 新增品項</button>`;
                renderProductsList();
            } else if (pageName === 'expenses') {
                titleEl.innerText = '店內支出記錄表';
                actionContainer.innerHTML = `<button class="action-btn" onclick="renderAddExpenseForm()">＋ 新增支出</button>`;
                renderExpensesList();
            } else {
                titleEl.innerText = '功能開發中';
                document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 40px 0;">此模組即將推出，敬請期待...</p>';
            }
        }

        function goHome() {
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }

        // ==================== 販售品項邏輯 ====================
        async function renderProductsList() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 30px 0;">讀取品項資料中...</p>';

            let { data, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                contentEl.innerHTML = '<p style="color:red; text-align:center;">載入失敗：' + error.message + '</p>';
                return;
            }

            globalProductsData = data || [];
            displayProductsWithSort();
        }

        function calculateCostRate(item) {
            if (!item.price || item.price <= 0) return 0;
            return (item.package_cost / item.price) * 100;
        }

        function displayProductsWithSort() {
            const contentEl = document.getElementById('page-content');
            const sortSelectEl = document.getElementById('sort-select');
            const searchInputEl = document.getElementById('search-input');
            
            const sortOrder = sortSelectEl ? sortSelectEl.value : 'price-asc';
            const searchQuery = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';

            let filteredData = globalProductsData.filter(item => {
                if (!searchQuery) return true;
                const nameMatch = item.name && item.name.toLowerCase().includes(searchQuery);
                const noteMatch = item.note && item.note.toLowerCase().includes(searchQuery);
                return nameMatch || noteMatch;
            });

            if (sortOrder === 'price-asc') {
                filteredData.sort((a, b) => (a.price || 0) - (b.price || 0));
            } else if (sortOrder === 'price-desc') {
                filteredData.sort((a, b) => (b.price || 0) - (a.price || 0));
            } else if (sortOrder === 'cost-rate-asc') {
                filteredData.sort((a, b) => calculateCostRate(a) - calculateCostRate(b));
            } else if (sortOrder === 'cost-rate-desc') {
                filteredData.sort((a, b) => calculateCostRate(b) - calculateCostRate(a));
            }

            let totalCostRate = 0;
            if (filteredData.length > 0) {
                const sumRates = filteredData.reduce((acc, item) => acc + calculateCostRate(item), 0);
                totalCostRate = (sumRates / filteredData.length).toFixed(1);
            }

            let html = `
                <div class="controls-bar">
                    <div class="stats-info">
                        <span>共 <b>${filteredData.length}</b> 項</span>
                        <span>平均成本率：<b>${totalCostRate}%</b></span>
                    </div>
                    <div class="search-sort-group">
                        <input type="text" id="search-input" class="search-input" placeholder="🔍 搜尋商品..." value="${searchQuery}" oninput="displayProductsWithSort()">
                        <select id="sort-select" onchange="displayProductsWithSort()">
                            <option value="price-asc" ${sortOrder === 'price-asc' ? 'selected' : ''}>售價：由低到高 ↗</option>
                            <option value="price-desc" ${sortOrder === 'price-desc' ? 'selected' : ''}>售價：由高到低 ↘</option>
                            <option value="cost-rate-asc" ${sortOrder === 'cost-rate-asc' ? 'selected' : ''}>成本率：由低到高 ↗</option>
                            <option value="cost-rate-desc" ${sortOrder === 'cost-rate-desc' ? 'selected' : ''}>成本率：由高到低 ↘</option>
                        </select>
                    </div>
                </div>
            `;

            if (filteredData.length > 0) {
                html += '<div class="items-grid">';
                filteredData.forEach((item, index) => {
                    let costRate = calculateCostRate(item).toFixed(1);
                    let zebraClass = (index % 2 === 1) ? 'zebra-alt' : '';

                    html += `
                        <div class="item-card ${zebraClass}" id="card-${item.id}">
                            <div class="card-main-info">
                                <h4>${item.name} <span>$${item.price} 元</span></h4>
                                <p><b>食材單價：</b>$${item.ingredient_cost}</p>
                                <p><b>總成本：</b>$${item.package_cost} &nbsp;|&nbsp; <span class="cost-rate">成本率：${costRate}%</span></p>
                                <p><b>備註：</b>${item.note || '無'}</p>
                            </div>
                            <div class="card-actions" id="actions-${item.id}">
                                <button class="card-btn edit-btn" onclick="renderEditProductForm(${item.id})">✏️ 修改</button>
                                <button class="card-btn delete-btn" onclick="showDeleteConfirmProduct(${item.id})">🗑️ 刪除</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color:var(--text-muted); text-align:center; padding: 40px 0;">沒有找到符合條件的品項紀錄。</p>';
            }

            contentEl.innerHTML = html;
        }

        function showDeleteConfirmProduct(id) {
            const cardEl = document.getElementById(`card-${id}`);
            const actionsEl = document.getElementById(`actions-${id}`);
            cardEl.classList.add('confirm-delete-state');
            actionsEl.innerHTML = `

        // ==================== 三段式滾輪日曆選擇器核心邏輯 ====================
        let currentWheelCallback = null;

        function openWheelPicker(callback, initialDateStr) {
            currentWheelCallback = callback;
            
            let initDate = new Date();
            if (initialDateStr && !isNaN(new Date(initialDateStr))) {
                initDate = new Date(initialDateStr);
            }
            
            let initYear = initDate.getFullYear();
            let initMonth = initDate.getMonth() + 1;
            let initDay = initDate.getDate();

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'wheel-picker-overlay';

            overlay.innerHTML = `
                <div class="picker-modal">
                    <h4>📅 選擇日期 (滾輪式)</h4>
                    <div class="picker-wheels-container">
                        <div class="wheel-column" id="wheel-year" onscroll="handleWheelScroll('year')"></div>
                        <div class="wheel-column" id="wheel-month" onscroll="handleWheelScroll('month')"></div>
                        <div class="wheel-column" id="wheel-day" onscroll="handleWheelScroll('day')"></div>
                    </div>
                    <div class="picker-btn-group">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmWheelPicker()">確定選取</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            populateWheelColumns(initYear, initMonth, initDay);
        }

        function populateWheelColumns(selYear, selMonth, selDay) {
            const yearCol = document.getElementById('wheel-year');
            const monthCol = document.getElementById('wheel-month');
            const dayCol = document.getElementById('wheel-day');

            let yearHtml = '<div style="height:60px;"></div>';
            for (let y = 2024; y <= 2032; y++) {
                yearHtml += `<div class="wheel-item" data-val="${y}">${y}年</div>`;
            }
            yearHtml += '<div style="height:60px;"></div>';
            yearCol.innerHTML = yearHtml;

            let monthHtml = '<div style="height:60px;"></div>';
            for (let m = 1; m <= 12; m++) {
                let mStr = m < 10 ? '0' + m : m;
                monthHtml += `<div class="wheel-item" data-val="${m}">${mStr}月</div>`;
            }
            monthHtml += '<div style="height:60px;"></div>';
            monthCol.innerHTML = monthHtml;

            updateDaysWheel(selYear, selMonth, selDay);

            setTimeout(() => {
                scrollToValue('year', selYear);
                scrollToValue('month', selMonth);
                scrollToValue('day', selDay);
            }, 50);
        }

        function updateDaysWheel(year, month, selectedDay) {
            const dayCol = document.getElementById('wheel-day');
            const daysInMonth = new Date(year, month, 0).getDate();
            if (selectedDay > daysInMonth) selectedDay = daysInMonth;

            let dayHtml = '<div style="height:60px;"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                let dStr = d < 10 ? '0' + d : d;
                dayHtml += `<div class="wheel-item" data-val="${d}">${dStr}日</div>`;
            }
            dayHtml += '<div style="height:60px;"></div>';
            dayCol.innerHTML = dayHtml;

            scrollToValue('day', selectedDay);
        }

        function scrollToValue(type, val) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            for (let item of items) {
                if (parseInt(item.getAttribute('data-val')) === parseInt(val)) {
                    col.scrollTop = item.offsetTop - 60;
                    break;
                }
            }
            highlightSelected(type);
        }

        function handleWheelScroll(type) {
            highlightSelected(type);

            if (type === 'year' || type === 'month') {
                const y = getSelectedValue('year');
                const m = getSelectedValue('month');
                const currentDay = getSelectedValue('day');
                updateDaysWheel(y, m, currentDay);
            }
        }

        function highlightSelected(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            const scrollTop = col.scrollTop;
            
            let centerPos = scrollTop + 60;
            let closestItem = null;
            let minDiff = 9999;

            items.forEach(item => {
                let itemMiddle = item.offsetTop + 20;
                let diff = Math.abs(centerPos - itemMiddle);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestItem = item;
                }
            });

            items.forEach(item => item.classList.remove('selected'));
            if (closestItem) {
                closestItem.classList.add('selected');
            }
        }

        function getSelectedValue(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return 1;
            const selectedItem = col.querySelector('.wheel-item.selected');
            return selectedItem ? parseInt(selectedItem.getAttribute('data-val')) : 1;
        }

        function confirmWheelPicker() {
            const y = getSelectedValue('year');
            const m = getSelectedValue('month');
            const d = getSelectedValue('day');

            const mStr = m < 10 ? '0' + m : m;
            const dStr = d < 10 ? '0' + d : d;
            const formattedDate = `${y}-${mStr}-${dStr}`;

            if (currentWheelCallback) {
                currentWheelCallback(formattedDate);
            }
            closeWheelPicker();
        }

        function closeWheelPicker() {
            const overlay = document.getElementById('wheel-picker-overlay');
            if (overlay) overlay.remove();
        }
    </script>
