        // 依店內支出項目名稱分開歸類；無法辨識的支出仍計入店內支出總額。
        function classifyOperatingExpenseName(name) {
            const n = String(name || '').replace(/\s/g, '').toLowerCase();
            if (/房租|租金/.test(n)) return 'rent';
            if (/電費|電費帳單|台電|水電電/.test(n)) return 'electricity';
            if (/正職.*(薪|工資)|正職薪資|正職薪水/.test(n)) return 'fulltime';
            if (/工讀.*(薪|工資)|工讀薪資|工讀薪水|兼職.*(薪|工資)/.test(n)) return 'parttime';
            if (/營業稅/.test(n)) return 'businessTax';
            if (/保險費/.test(n)) return 'insurance';
            if (/員工勞保|勞保|員工健保|健保/.test(n)) return 'employeeLaborHealth';
            if (/網路費|網路/.test(n)) return 'internet';
            return 'other';
        }

        // 分類費用仍使用 expenses.name/amount/date 的既有紀錄；
        // 本函式只做顯示分類，總支出仍由既有支出加總一次，避免重複扣款。
        const TRACKED_EXPENSE_TYPES = [
            ['businessTax', '營業稅'],
            ['insurance', '保險費（年繳／月攤）'],
            ['employeeLaborHealth', '員工勞健保'],
            ['internet', '網路費']
        ];
        function sumNamedExpenseType(items, type) {
            return (items || []).filter(item =>
                (item.transaction_type || 'expense') === 'expense' &&
                item.is_depreciable !== true &&
                !isDepositOrPrepaymentExpense(item.name) &&
                classifyOperatingExpenseName(item.name) === type
            ).reduce((total, item) => total + (Number(item.amount) || 0), 0);
        }

        // 保險費輸入的是全年金額：依支出日期所在年度，平均攤入該年度 12 個月份。
        // 這是損益的月攤提；實際現金流仍在原付款月份扣除全年付款金額。
        function getAnnualInsuranceMonthlyAllocation(items, yearMonth) {
            const year = String(yearMonth || '').slice(0, 4);
            if (!/^\d{4}$/.test(year)) return 0;
            const annualAmount = (items || []).filter(item =>
                (item.transaction_type || 'expense') === 'expense' &&
                item.is_depreciable !== true &&
                !isDepositOrPrepaymentExpense(item.name) &&
                classifyOperatingExpenseName(item.name) === 'insurance' &&
                String(item.date || '').slice(0, 4) === year
            ).reduce((total, item) => total + (Number(item.amount) || 0), 0);
            return annualAmount / 12;
        }

        function getInsurancePaidInMonth(items, yearMonth) {
            return sumNamedExpenseType(
                (items || []).filter(item => String(item.date || '').startsWith(yearMonth)),
                'insurance'
            );
        }

        // 押金／訂金屬資金占用或預付款：付款時納入現金流，不直接當作當月營運費用。
        function isDepositOrPrepaymentExpense(name) {
            return /押金|訂金/.test(String(name || '').replace(/\s/g, ''));
        }

        // ==================== 每月損益總表與營運回本試算邏輯 ====================
        let currentProfitMonth = getCurrentYearMonth();

        const DEFAULT_MONTH_SETTINGS = {
            workingDays: 26,
            gas: 0,
            oil: 0,
            charcoal: 0,
            ubereatsAdDaily: 0,
            foodpandaAdMonthly: 0,
            initialCapital: 2000000
        };


        // UberEats 廣告費按日設定；每月金額 = 每日廣告費 × 使用者設定的營業天數。
        // 舊資料若只有月金額，依原營業天數換算成每日金額，維持歷史數值。
        function getMonthlyAdCosts(settings) {
            const s = settings || {};
            const days = Math.max(0, Number(s.workingDays ?? 26) || 0);
            const daily = s.ubereatsAdDaily !== undefined
                ? (Number(s.ubereatsAdDaily) || 0)
                : (Number(s.ubereatsAdMonthly) || 0) / Math.max(1, days);
            return {
                ubereatsDaily: Math.max(0, daily),
                ubereats: Math.max(0, daily) * days,
                foodpanda: Math.max(0, Number(s.foodpandaAdMonthly) || 0),
                workingDays: days
            };
        }

        // 只讀取該月份真正保存的設定；歷史月份缺資料時絕不套用最新月份。
        async function getMonthSettings(monthStr) {
            const { data, error } = await _supabase
                .from('settings')
                .select('*')
                .eq('month', monthStr)
                .maybeSingle();

            if (error) {
                console.error('讀取月份設定失敗：', monthStr, error);
                return null;
            }
            return data && data.settings_json ? data.settings_json : null;
        }

        // 表單使用的預設值；這只方便新增/編輯，不代表歷史月份真的有這些成本。
        async function getMonthSettingsForEditing(monthStr) {
            const saved = await getMonthSettings(monthStr);
            return { ...DEFAULT_MONTH_SETTINGS, ...(saved || {}) };
        }

        // 初始投入本金是全店層級的參數，跨月份沿用最近一次明確保存的本金值；
        // 這不會把最新月份的房租、人事等固定成本回填到歷史月份。
        async function getGlobalInitialCapital() {
            const { data, error } = await _supabase
                .from('settings')
                .select('month,settings_json')
                .order('month', { ascending: false })
                .limit(100);
            if (error) {
                console.error('讀取初始投入本金失敗：', error);
                return 2000000;
            }
            const savedRow = (data || []).find(row =>
                row.settings_json && Number(row.settings_json.initialCapital) > 0
            );
            return savedRow ? Number(savedRow.settings_json.initialCapital) : 2000000;
        }

        async function renderProfitView() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 30px 0;">計算損益與回本目標中...</p>';

            let [productsRes, expensesRes, revenuesRes] = await Promise.all([
                _supabase.from('products').select('*'),
                _supabase.from('expenses').select('*'),
                _supabase.from('revenues').select('*')
            ]);

            const products = productsRes.data || [];
            const expenses = expensesRes.data || [];
            globalRevenuesData = revenuesRes.data || [];
            const platformRates = await getPlatformRates();
            const ueRate = platformRates.ubereatsCommissionRate / 100;
            const fpRate = platformRates.foodpandaCommissionRate / 100;

            let fixedSettings = await getMonthSettingsForEditing(currentProfitMonth);

            const hasMonthlySettings = fixedSettings.fixedCostsConfigured !== false;
            const monthlyAds = hasMonthlySettings ? getMonthlyAdCosts(fixedSettings) : { ubereats: 0, foodpanda: 0 };
            let totalUbereatsAd = monthlyAds.ubereats;
            let totalFoodpandaAd = monthlyAds.foodpanda;

            // 本月設定只包含瓦斯、木炭、炸油及平台廣告；房租/薪資/水電等一律由 expenses 店內支出表讀取。
            let totalFixedCost = hasMonthlySettings
                ? (parseFloat(fixedSettings.gas) || 0) + (parseFloat(fixedSettings.oil) || 0) +
                  (parseFloat(fixedSettings.charcoal) || 0) + totalUbereatsAd + totalFoodpandaAd
                : 0;

            let monthExpenseRows = expenses.filter(i => i.date && i.date.startsWith(currentProfitMonth));
            let monthExpenses = monthExpenseRows.filter(i => (i.transaction_type || 'expense') === 'expense' && i.is_depreciable !== true && !isDepositOrPrepaymentExpense(i.name));
            let monthDepreciableExpenses = monthExpenseRows.filter(i => (i.transaction_type || 'expense') === 'expense' && i.is_depreciable === true);
            let monthExtraIncome = monthExpenseRows.filter(i => i.transaction_type === 'income');
            const expenseByType = type => monthExpenses.filter(i => classifyOperatingExpenseName(i.name) === type).reduce((a,i) => a + (Number(i.amount)||0), 0);
            let rentExpense = expenseByType('rent');
            let electricityExpense = expenseByType('electricity');
            let fulltimeSalaryExpense = expenseByType('fulltime');
            let parttimeSalaryExpense = expenseByType('parttime');
            const trackedExpenseTotals = Object.fromEntries(
                TRACKED_EXPENSE_TYPES.map(([type]) => [type, type === 'insurance'
                    ? getAnnualInsuranceMonthlyAllocation(expenses, currentProfitMonth)
                    : sumNamedExpenseType(monthExpenses, type)])
            );
            // 月損益以保險費全年金額 ÷ 12 攤提；其他支出仍按當月紀錄計算。
            const insurancePaidThisMonth = sumNamedExpenseType(monthExpenses, 'insurance');
            let totalOtherExpenses = monthExpenses.reduce((a,i) => a + (Number(i.amount)||0), 0)
                - insurancePaidThisMonth + trackedExpenseTotals.insurance;
            const averageCostRate = products.length
                ? products.reduce((sum, item) => sum + calculateCostRate(item), 0) / products.length
                : 0;
            let totalDepreciation = 0;
            const currentMonthNumber = Number(currentProfitMonth.slice(0,4))*12 + Number(currentProfitMonth.slice(5,7))-1;
            expenses.filter(i => (i.transaction_type || 'expense') === 'expense' && i.is_depreciable === true).forEach(item => {
                const dateMonth = String(item.date || '').slice(0,7);
                if (!/^\d{4}-\d{2}$/.test(dateMonth)) return;
                const startMonth = Number(dateMonth.slice(0,4))*12 + Number(dateMonth.slice(5,7))-1;
                const usefulLifeYears = Math.max(1, Number(item.useful_life_years) || 5);
                const lifeMonths = usefulLifeYears * 12;
                const annualDepreciation = (Number(item.amount) || 0) / usefulLifeYears;
                const monthlyDepreciation = annualDepreciation / 12;
                const elapsed = currentMonthNumber - startMonth;
                if (elapsed >= 0 && elapsed < lifeMonths) totalDepreciation += monthlyDepreciation;
            });
            let totalExtraIncome = monthExtraIncome.reduce((acc, i) => acc + (parseFloat(i.amount) || 0), 0);
            let monthRevenues = globalRevenuesData.filter(i => i.date && i.date.startsWith(currentProfitMonth));
            let ueGrossSales = monthRevenues.reduce((sum, r) => sum + (parseFloat(r.ubereats) || 0), 0);
            let fpGrossSales = monthRevenues.reduce((sum, r) => sum + (parseFloat(r.foodpanda) || 0), 0);
            let ueCommission = ueGrossSales * ueRate;
            let fpCommission = fpGrossSales * fpRate;
            let totalPlatformCommission = ueCommission + fpCommission;
            let totalGrossSales = monthRevenues.reduce((sum, r) =>
                sum + (parseFloat(r.onsite) || 0) + (parseFloat(r.ubereats) || 0) + (parseFloat(r.foodpanda) || 0), 0);
            // 每月固定總支出：當月所有非折舊、非押金/訂金的一般店內支出
            // （包含房租、電費、正職/工讀薪資、網路、維修及其他雜項）
            // + 月設定瓦斯/炸油/木炭 + UberEats每日廣告×營業天數 + foodpanda月廣告。
            // 廣告費由 getMonthlyAdCosts() 依當月動態參數計算，不寫死金額。
            let monthlySettingsAndStoreExpenseTotal = totalFixedCost + totalOtherExpenses;
            let monthlyFixedTotalCost = monthlySettingsAndStoreExpenseTotal;
            // 平均成本率以百分比轉成小數；成本率38%時，貢獻毛利率為62%。
            let contributionMarginRate = Math.max(0.0001, 1 - (Math.max(0, Number(averageCostRate) || 0) / 100));
            let monthlyBreakEvenRevenue = monthlyFixedTotalCost / contributionMarginRate;
            let dailyBreakEvenRevenue = monthlyBreakEvenRevenue / Math.max(1, Number(fixedSettings.workingDays) || 26);


            
            let profitDaysCount = 0;
            let lossDaysCount = 0;

            let dayOfWeekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            let weekdayTotals = { 0: {sum:0, count:0}, 1: {sum:0, count:0}, 2: {sum:0, count:0}, 3: {sum:0, count:0}, 4: {sum:0, count:0}, 5: {sum:0, count:0}, 6: {sum:0, count:0} };

            let totalActualRevenue = monthRevenues.reduce((acc, i) => {
                let onsite = parseFloat(i.onsite) || 0;
                let ubereatsGross = parseFloat(i.ubereats) || 0;
                let foodpandaGross = parseFloat(i.foodpanda) || 0;
                let dayTotal = onsite + ubereatsGross * (1 - ueRate) + foodpandaGross * (1 - fpRate);
                let dayGrossTotal = onsite + ubereatsGross + foodpandaGross;

                if (dayGrossTotal >= dailyBreakEvenRevenue) profitDaysCount++;
                else lossDaysCount++;

                if (i.date) {
                    let dObj = new Date(i.date);
                    if (!isNaN(dObj.getDay())) {
                        let wDay = dObj.getDay();
                        weekdayTotals[wDay].sum += dayGrossTotal;
                        weekdayTotals[wDay].count += 1;
                    }
                }

                return acc + dayTotal;
            }, 0);

            let bestDay = '尚無資料';
            let worstDay = '尚無資料';
            let maxAvg = -1;
            let minAvg = Infinity;

            for (let w = 0; w < 7; w++) {
                if (weekdayTotals[w].count > 0) {
                    let avg = weekdayTotals[w].sum / weekdayTotals[w].count;
                    if (avg > maxAvg) {
                        maxAvg = avg;
                        bestDay = `${dayOfWeekNames[w]} (平均 $${Math.round(avg).toLocaleString()})`;
                    }
                    if (avg < minAvg) {
                        minAvg = avg;
                        worstDay = `${dayOfWeekNames[w]} (平均 $${Math.round(avg).toLocaleString()})`;
                    }
                }
            }

            // 不以目前商品平均成本率推估歷史食材成本；每日叫貨不列入損益。
            let netProfit = totalGrossSales - totalPlatformCommission - totalFixedCost - totalOtherExpenses + totalExtraIncome - totalDepreciation;
            let revenueGap = totalGrossSales - monthlyBreakEvenRevenue;

            const [pYear, pMonth] = currentProfitMonth.split('-');
            let monthDisplayTitle = `${pYear}年 ${parseInt(pMonth, 10)}月`;

            let html = `
                <div class="controls-bar" style="margin-bottom: 20px;">
                    <div class="stats-info"><span>📊 營運與回本試算儀表板</span></div>
                    <div class="search-sort-group">
                        <input type="text" id="profit-month-search" class="search-input" value="${monthDisplayTitle}" readonly onclick="openYearMonthPicker(changeProfitMonthWheel, '${currentProfitMonth}')" style="cursor: pointer; background: #fff; width: 120px;" title="點擊選擇年月">
                        <button class="action-btn" onclick="openRevenueModal()">＋ 記錄今日營業額</button>
                    </div>
                </div>

                <div class="profit-card">
                    <h3 style="margin-top:0; color:#c2410c; font-size:16px; border-bottom:1px solid #fed7aa; padding-bottom:8px;">⚙️ 本月營運費用與回本門檻</h3>
                    <div class="profit-grid-settings">
                        <div>營業天數：<b>${Number(fixedSettings.workingDays) || 26} 天</b></div>
                        <div>平均成本率：<b>${averageCostRate.toFixed(1)}%</b></div>
                        <div>房租：<b>$${Math.round(rentExpense).toLocaleString()} 元</b></div>
                        <div>電費：<b>$${Math.round(electricityExpense).toLocaleString()} 元</b></div>
                        <div>正職薪水：<b>$${Math.round(fulltimeSalaryExpense).toLocaleString()} 元</b></div>
                        <div>工讀生薪水：<b>$${Math.round(parttimeSalaryExpense).toLocaleString()} 元</b></div>
                        <div>瓦斯費：<b>$${(fixedSettings.gas || 0).toLocaleString()} 元</b></div>
                        <div>炸油費：<b>$${(fixedSettings.oil || 0).toLocaleString()} 元</b></div>
                        <div>木炭費：<b>$${(fixedSettings.charcoal || 0).toLocaleString()} 元</b></div>
                        <div>營業稅：<b>$${Math.round(trackedExpenseTotals.businessTax).toLocaleString()} 元</b></div>
                        <div>保險費（月攤提，全年金額 ÷ 12）：<b>$${Math.round(trackedExpenseTotals.insurance).toLocaleString()} 元</b></div>
                        <div>員工勞健保：<b>$${Math.round(trackedExpenseTotals.employeeLaborHealth).toLocaleString()} 元</b></div>
                        <div>網路費：<b>$${Math.round(trackedExpenseTotals.internet).toLocaleString()} 元</b></div>
                        <div>UberEats 廣告費（每日金額 × 當月營業天數）：<b>$${Math.round(totalUbereatsAd).toLocaleString()} 元</b></div>
                        <div>foodpanda 廣告費（月）：<b>$${Math.round(totalFoodpandaAd).toLocaleString()} 元</b></div>
                        <div>每月設定費用與店內支出合計：<b>$${Math.round(monthlySettingsAndStoreExpenseTotal).toLocaleString()} 元</b></div>
                        <div style="grid-column: 1 / -1;"><b>🎯 月回本營業額目標：$${Math.round(monthlyBreakEvenRevenue).toLocaleString()} 元</b></div>
                    </div>
                    <button class="clear-search-btn" style="width:100%;" onclick="openFixedSettingsModal()">✏️ 設定本月營業天數與費用</button>
                </div>

                <div class="profit-card" style="background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); border-color: #bbf7d0;">
                    <h3 style="margin-top:0; color:#166534; font-size:16px; border-bottom:1px solid #bbf7d0; padding-bottom:8px;">📈 本月實際營運與回本進度</h3>
                    <div class="profit-row">
                        <span>本月原始總營業額（現場＋兩平台）</span>
                        <b style="color: #292524; font-size: 18px;">$${Math.round(totalGrossSales).toLocaleString()} 元</b>
                    </div>
                    
                    <div class="profit-row">
                        <span>每日營業額回本門檻（依平均成本率及全額固定支出）</span>
                        <b>$${Math.round(dailyBreakEvenRevenue).toLocaleString()} 元 / 天</b>
                    </div>
                    <div class="profit-row">
                        <span>本月達標天數統計</span>
                        <b style="color: #1e293b;">🔥 賺錢 ${profitDaysCount} 天 &nbsp;|&nbsp; 💧 賠錢 ${lossDaysCount} 天</b>
                    </div>
                    <div class="profit-row">
                        <span>📅 星期幾營運洞察</span>
                        <b style="color: #9a3412; font-size: 13.5px;">⭐ 賺最多：${bestDay} &nbsp;|&nbsp; 📉 賺最少：${worstDay}</b>
                    </div>
                    <div class="profit-row">
                        <span>🎯 距離月回本目標營業額差距</span>
                        <b style="color: #c2410c;">${revenueGap >= 0 ? '超額達標 ＋' : '還差 －'}$${Math.round(Math.abs(revenueGap)).toLocaleString()} 元</b>
                    </div>
                    <div class="profit-row total-row" style="color: ${netProfit >= 0 ? '#166534' : '#991b1b'}; border-top-color: #86efac;">
                        <span>💰 本月營運損益（含店內支出分類、月設定費用及設備折舊；設備購買本金不重複扣除）</span>
                        <span>${netProfit >= 0 ? '淨賺 ＋' : '淨虧 －'}$${Math.round(Math.abs(netProfit)).toLocaleString()} 元</span>
                    </div>
                </div>

                <h4 style="color:#c2410c; margin: 20px 0 10px 0;">📅 本月每日營業額明細 (含平台實收試算)</h4>
            `;

            if (monthRevenues.length > 0) {
                html += '<div class="items-grid">';
                monthRevenues.sort((a,b) => b.date.localeCompare(a.date)).forEach((rev, index) => {
                    let onsite = parseFloat(rev.onsite) || 0;
                    let ueInput = parseFloat(rev.ubereats) || 0;
                    let fpInput = parseFloat(rev.foodpanda) || 0;
                    let ueFee = ueInput * ueRate;
                    let fpFee = fpInput * fpRate;
                    let ueNet = ueInput - ueFee;
                    let fpNet = fpInput - fpFee;
                    let dayNetTotal = onsite + ueNet + fpNet;

                    // 每日門檻是營業額目標，故以當日原始總營業額比較，避免淨收/毛額口徑混用。
                    let dayGrossTotal = onsite + ueInput + fpInput;
                    let diffToBreakEven = dailyBreakEvenRevenue - dayGrossTotal;
                    
                    let feedbackHtml = '';
                    if (diffToBreakEven <= 0) {
                        feedbackHtml = `<span style="color:#059669; font-weight:700;">🔥 太棒了！有賺錢，超額賺取 $${Math.abs(Math.round(diffToBreakEven)).toLocaleString()} 元！</span>`;
                    } else {
                        feedbackHtml = `<span style="color:#dc2626; font-weight:700;">💪 距離今日回本還差 $${Math.round(diffToBreakEven).toLocaleString()} 元</span>`;
                    }

                    let dObj = new Date(rev.date);
                    let weekDayStr = !isNaN(dObj.getDay()) ? ` (${dayOfWeekNames[dObj.getDay()]})` : '';

                    let zebraClass = (index % 2 === 1) ? 'zebra-alt' : '';
                    html += `
                        <div class="item-card ${zebraClass}" id="rev-card-${rev.id}">
                            <div class="card-main-info">
                                <h4>${rev.date}${weekDayStr} <span style="font-size:15px;">實收總計：$${Math.round(dayNetTotal).toLocaleString()}</span> <span style="font-size:12px;color:#78716c;">營業額：$${Math.round(dayGrossTotal).toLocaleString()}</span></h4>
                                <p><b>現場：</b>$${onsite}</p>
                                <p><b>UberEats：</b>$${ueInput}</p>
                                <p><b>foodpanda：</b>$${fpInput}</p>
                                <p style="margin-top: 8px; font-size: 13px;">${feedbackHtml}</p>
                            </div>
                            <div class="card-actions" id="rev-actions-${rev.id}">
                                <button class="card-btn edit-btn" onclick="openRevenueModal(${rev.id})">✏️ 修改</button>
                                <button class="card-btn delete-btn" onclick="deleteRevenue(${rev.id})">🗑️ 刪除</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color:var(--text-muted); text-align:center; padding: 20px 0;">本月尚無登錄每日營業額紀錄，點擊上方按鈕開始記錄！</p>';
            }

            contentEl.innerHTML = html;
        }

        function changeProfitMonthWheel(ymStr) {
            currentProfitMonth = ymStr;
            renderProfitView();
        }

        async function openRevenueModal(editId = null) {
            let revItem = editId ? globalRevenuesData.find(r => r.id === editId) : null;
            let defaultDate = revItem ? revItem.date : new Date().toISOString().split('T')[0];

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'revenue-modal-overlay';
            overlay.innerHTML = `
                <div class="picker-modal" style="width: 380px; text-align: left;">
                    <h4 style="text-align: center; color: #c2410c;">${editId ? '✏️ 修改每日營業額' : '💰 記錄每日營業額'}</h4>
                    <div id="form-toast" class="toast-msg"></div>
                    <div class="form-group">
                        <label>日期 (點擊選擇)</label>
                        <input type="text" id="rev-date" value="${defaultDate}" readonly onclick="openDatePicker(setRevDate, document.getElementById('rev-date').value)" style="cursor: pointer; background: #fff;">
                    </div>
                    <div class="form-group"><label>現場客人營業額</label><input type="number" step="0.01" id="rev-onsite" value="${revItem ? revItem.onsite || 0 : ''}" placeholder="0"></div>
                    <div class="form-group"><label>UberEats 當日營業額（抽成依平台設定）</label><input type="number" step="0.01" id="rev-ubereats" value="${revItem ? revItem.ubereats || 0 : ''}" placeholder="0"></div>
                    <div class="form-group"><label>foodpanda 當日營業額（抽成依平台設定）</label><input type="number" step="0.01" id="rev-foodpanda" value="${revItem ? revItem.foodpanda || 0 : ''}" placeholder="0"></div>
                    <div class="picker-btn-group" style="margin-top: 16px;">
                        <button class="picker-btn picker-cancel" onclick="document.getElementById('revenue-modal-overlay').remove()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="saveRevenue(${editId})">確認儲存</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function setRevDate(dateStr) { document.getElementById('rev-date').value = dateStr; }

        async function saveRevenue(editId) {
            const date = document.getElementById('rev-date').value;
            const onsite = parseFloat(document.getElementById('rev-onsite').value) || 0;
            const ubereats = parseFloat(document.getElementById('rev-ubereats').value) || 0;
            const foodpanda = parseFloat(document.getElementById('rev-foodpanda').value) || 0;
            const toast = document.getElementById('form-toast');

            if (!date) {
                toast.className = 'toast-msg toast-error'; toast.innerText = '⚠️ 請選擇日期！'; toast.style.display = 'block'; return;
            }

            let res;
            if (editId) {
                res = await _supabase.from('revenues').update({ date, onsite, ubereats, foodpanda }).eq('id', editId);
            } else {
                res = await _supabase.from('revenues').insert([{ date, onsite, ubereats, foodpanda }]);
            }

            if (res.error) {
                toast.className = 'toast-msg toast-error'; toast.innerText = '❌ 儲存失敗：' + res.error.message; toast.style.display = 'block';
            } else {
                document.getElementById('revenue-modal-overlay').remove();
                renderProfitView();
            }
        }

        async function deleteRevenue(id) {
            const { error } = await _supabase.from('revenues').delete().eq('id', id);
            if (error) alert('刪除失敗：' + error.message);
            else renderProfitView();

        // ==================== 💎 全店創業資本與回本追蹤專屬頁面邏輯 ====================
        async function renderCapitalView() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:30px 0;">正在核對全店營運損益、已付款叫貨與現金流...</p>';

            const [productsRes, revenuesRes, expensesRes, purchasesRes, settingsRes] = await Promise.all([
                _supabase.from('products').select('*'),
                _supabase.from('revenues').select('*'),
                _supabase.from('expenses').select('*'),
                _supabase.from('purchases').select('*'),
                _supabase.from('settings').select('month,settings_json')
            ]);

            const failed = [productsRes, revenuesRes, expensesRes, purchasesRes, settingsRes].find(r => r.error);
            if (failed) {
                contentEl.innerHTML = `<p style="color:#dc2626;padding:20px;">讀取回本追蹤資料失敗：${failed.error.message}</p>`;
                return;
            }

            const products = productsRes.data || [];
            const revenues = revenuesRes.data || [];
            const expenses = expensesRes.data || [];
            const purchases = purchasesRes.data || [];
            const settingsRows = settingsRes.data || [];
            const settingsByMonth = {};
            settingsRows.forEach(row => {
                if (row.month && row.settings_json) settingsByMonth[String(row.month)] = row.settings_json;
            });

            const currentMonthKey = getCurrentYearMonth();
            const platformRates = platformRatesFromRows(settingsRows);
            const ueRate = platformRates.ubereatsCommissionRate / 100;
            const fpRate = platformRates.foodpandaCommissionRate / 100;
            const initialCapital = Math.max(0, await getGlobalInitialCapital());

            const monthNumber = ym => {
                const match = /^(\d{4})-(\d{2})$/.exec(String(ym || ''));
                return match ? Number(match[1]) * 12 + Number(match[2]) - 1 : null;
            };
            const validMonth = value => /^\d{4}-\d{2}$/.test(String(value || '').substring(0, 7))
                ? String(value).substring(0, 7) : '';

            // 以最早一筆營收／支出／叫貨／月份設定為起點，連續計算到本月。
            // 不可只列有資料的月份，否則設備折舊會漏掉中間沒有營收或支出紀錄的月份。
            const recordedMonths = [
                ...revenues.map(x => validMonth(x.date)),
                ...expenses.map(x => validMonth(x.date)),
                ...purchases.map(x => validMonth(x.date)),
                ...settingsRows.map(r => validMonth(r.month))
            ].filter(Boolean).filter(ym => ym <= currentMonthKey).sort();
            const monthKeys = [];
            if (recordedMonths.length) {
                const firstMonthNumber = monthNumber(recordedMonths[0]);
                const lastMonthNumber = monthNumber(currentMonthKey);
                for (let n = firstMonthNumber; n <= lastMonthNumber; n++) {
                    const year = Math.floor(n / 12);
                    const month = (n % 12) + 1;
                    monthKeys.push(`${year}-${String(month).padStart(2, '0')}`);
                }
            }

            // 不用目前商品平均成本率回推歷史食材成本；叫貨紀錄不列入營運損益。

            const sum = (items, getter) => items.reduce((total, item) => total + (Number(getter(item)) || 0), 0);
            const monthRows = [];
            let cumulativeOperatingProfit = 0;
            let cumulativeCashMovement = 0;
            let cumulativePurchases = 0;
            let cumulativeDepreciation = 0;
            let cumulativeOrdinaryExpenses = 0;
            let cumulativeRecordedCashExpenses = 0;
            let cumulativeDepositsAndPrepayments = 0;
            let cumulativeMonthlySettingsCosts = 0;
            let totalEquipmentCost = 0;
            let totalEquipmentBookValue = 0;

            const depreciableItems = expenses.filter(e =>
                (e.transaction_type || 'expense') === 'expense' &&
                e.is_depreciable === true &&
                (Number(e.amount) || 0) > 0
            );

            // 設備折舊僅供設備帳面剩餘價值估算；依本次指定的損益口徑，設備購買支出已全額列入支出。
            const depreciationByMonth = Object.fromEntries(monthKeys.map(ym => [ym, 0]));
            depreciableItems.forEach(item => {
                const cost = Number(item.amount) || 0;
                const years = Math.max(1, Number(item.useful_life_years) || 5);
                const usefulMonths = years * 12;
                const purchaseMonth = validMonth(item.date) || currentMonthKey;
                if (purchaseMonth > currentMonthKey) return;
                totalEquipmentCost += cost;

                for (const ym of monthKeys) {
                    const elapsed = monthNumber(ym) - monthNumber(purchaseMonth);
                    if (elapsed >= 0 && elapsed < usefulMonths) {
                        depreciationByMonth[ym] += cost / usefulMonths;
                    }
                }
            });

            for (const ym of monthKeys) {
                const monthRevenues = revenues.filter(x => validMonth(x.date) === ym);
                const monthExpenses = expenses.filter(x => validMonth(x.date) === ym);
                const monthPurchases = purchases.filter(x => validMonth(x.date) === ym);
                const settings = settingsByMonth[ym] || null;
                const hasSettings = !!settings && settings.fixedCostsConfigured !== false;


                const monthAds = getMonthlyAdCosts(settings);
                // 月設定僅讀取瓦斯、木炭、炸油與平台廣告；店租/薪資/水電由 expenses 當月支出讀取。
                const fixedCost = hasSettings
                    ? (Number(settings.gas) || 0) +
                      (Number(settings.oil) || 0) +
                      (Number(settings.charcoal) || 0) +
                      monthAds.ubereats + monthAds.foodpanda
                    : 0;

                const grossRevenue = sum(monthRevenues, r =>
                    (Number(r.onsite) || 0) +
                    (Number(r.ubereats) || 0) +
                    (Number(r.foodpanda) || 0)
                );
                const ubereatsCommission = sum(monthRevenues, r => Number(r.ubereats) || 0) * ueRate;
                const foodpandaCommission = sum(monthRevenues, r => Number(r.foodpanda) || 0) * fpRate;
                const platformCommission = ubereatsCommission + foodpandaCommission;
                const netRevenue = grossRevenue - platformCommission;

                const purchasePaid = sum(monthPurchases, p => p.total_price);
                const extraIncome = sum(monthExpenses.filter(e => e.transaction_type === 'income'), e => e.amount);
                const ordinaryExpenses = sum(monthExpenses.filter(e =>
                    (e.transaction_type || 'expense') === 'expense' && e.is_depreciable !== true && !isDepositOrPrepaymentExpense(e.name)
                ), e => e.amount);
                const depositsAndPrepayments = sum(monthExpenses.filter(e =>
                    (e.transaction_type || 'expense') === 'expense' && isDepositOrPrepaymentExpense(e.name)
                ), e => e.amount);
                const allCashExpenses = sum(monthExpenses.filter(e =>
                    (e.transaction_type || 'expense') === 'expense'
                ), e => e.amount);
                const trackedExpenseTotals = Object.fromEntries(
                    TRACKED_EXPENSE_TYPES.map(([type]) => [type, type === 'insurance'
                        ? getAnnualInsuranceMonthlyAllocation(expenses, ym)
                        : sumNamedExpenseType(monthExpenses, type)])
                );
                const insurancePaidThisMonth = sumNamedExpenseType(monthExpenses, 'insurance');
                const profitBasisExpenses = allCashExpenses - insurancePaidThisMonth + trackedExpenseTotals.insurance;

                const depreciation = depreciationByMonth[ym] || 0;
                // 依使用者指定的歷史累積公式：實收營收－當月叫貨－店內支出表全部支出。
                // 店內支出表的所有 expense 均納入，包含一般支出、押金/訂金及設備購買；
                // 因設備購買已全額列入，不可再把同月折舊重複扣入這個損益口徑。
                const operatingProfitEstimate = netRevenue - purchasePaid - profitBasisExpenses - fixedCost + extraIncome;

                // 現金流：平台抽成在營收端扣一次；設備採購在付款當月全額列現金流出，不再扣折舊。
                const cashMovement = grossRevenue - platformCommission - purchasePaid - allCashExpenses + extraIncome - fixedCost;

                cumulativeOperatingProfit += operatingProfitEstimate;
                cumulativeCashMovement += cashMovement;
                cumulativePurchases += purchasePaid;
                cumulativeDepreciation += depreciation;
                cumulativeOrdinaryExpenses += ordinaryExpenses;
                cumulativeRecordedCashExpenses += allCashExpenses;
                cumulativeDepositsAndPrepayments += depositsAndPrepayments;
                cumulativeMonthlySettingsCosts += fixedCost;

                monthRows.push({
                    month: ym, netRevenue, grossRevenue, ubereatsCommission, foodpandaCommission, platformCommission,
                    purchasePaid, fixedCost, ordinaryExpenses, extraIncome, depreciation,
                    trackedExpenseTotals, operatingProfitEstimate, cashMovement, hasSettings
                });
            }

            totalEquipmentBookValue = Math.max(0, totalEquipmentCost - cumulativeDepreciation);
            // 本金回收缺口以「初始投入資本－目前推算實際現金餘額」計算。
            // 現金餘額 = 初始投入資本 + 歷史累積現金流變動；
            // 設備、裝潢、叫貨及店內支出已反映在累積現金流，不可再加一次。
            const currentCashBalance = initialCapital + cumulativeCashMovement;
            const remainingToRecover = Math.max(0, initialCapital - currentCashBalance);
            const recoveredCapital = Math.max(0, initialCapital - remainingToRecover);
            const recoveryProgress = initialCapital > 0
                ? Math.max(0, Math.min(100, recoveredCapital / initialCapital * 100)) : 0;
            const returnRate = initialCapital > 0
                ? (initialCapital - remainingToRecover) / initialCapital * 100 : 0;
            const excessCashAfterRecovery = Math.max(0, currentCashBalance - initialCapital);

            const money = value => `$${Math.round(value || 0).toLocaleString('zh-TW')} 元`;
            const monthlyRowsHtml = monthRows.slice().reverse().map(row => `
                <tr>
                    <td style="padding:9px 8px;border-bottom:1px solid #f1e5d8;white-space:nowrap;">${row.month}</td>
                    <td style="padding:9px 8px;border-bottom:1px solid #f1e5d8;text-align:right;">${Math.round(row.grossRevenue).toLocaleString('zh-TW')}</td>
                    <td style="padding:9px 8px;border-bottom:1px solid #f1e5d8;text-align:right;color:${row.operatingProfitEstimate >= 0 ? '#15803d' : '#b91c1c'};">${Math.round(row.operatingProfitEstimate).toLocaleString('zh-TW')}</td>
                    <td style="padding:9px 8px;border-bottom:1px solid #f1e5d8;text-align:right;color:${row.cashMovement >= 0 ? '#15803d' : '#b91c1c'};">${Math.round(row.cashMovement).toLocaleString('zh-TW')}</td>
                </tr>
            `).join('');

            contentEl.innerHTML = `
                <div class="controls-bar" style="margin-bottom:20px;">
                    <div class="stats-info"><span>💎 創業資本、營運損益與實際付款現金流分開追蹤</span></div>
                    <div><button class="action-btn" onclick="openCapitalSettingsModal()">⚙️ 設定初始投入資本金額</button></div>
                </div>


                <div class="profit-card">
                    <h3 style="margin-top:0;color:#9a3412;font-size:18px;">👑 創業本金與營運回本</h3>
                    <div class="profit-row"><span>初始投入資本額</span><b>${money(initialCapital)}</b></div>
                    <div class="profit-row"><span>累積營運淨利／虧損（實收營收－叫貨支出－店內支出總額）</span><b style="color:${cumulativeOperatingProfit >= 0 ? '#166534' : '#b91c1c'};">${cumulativeOperatingProfit >= 0 ? '+' : '−'}${money(Math.abs(cumulativeOperatingProfit))}</b></div>
                    <div class="profit-row"><span>目前推算實際現金餘額（初始資本＋累積現金流變動）</span><b>${money(currentCashBalance)}</b></div>
                    <div class="profit-row"><span>本金回收進度（依目前實際現金餘額）</span><b>${recoveryProgress.toFixed(1)}%</b></div>
                    <div style="height:12px;background:#fed7aa;border-radius:99px;overflow:hidden;margin:8px 0 14px;"><div style="height:100%;width:${recoveryProgress}%;background:#ea580c;"></div></div>
                    <div class="profit-row"><span>${remainingToRecover > 0 ? '距離初始投入本金尚差' : '目前現金餘額已達初始本金'}</span><b>${money(remainingToRecover > 0 ? remainingToRecover : excessCashAfterRecovery)}</b></div>
                    <div class="profit-row"><span>本金回收比例（依初始投入本金）</span><b>${returnRate.toFixed(1)}%</b></div>
                </div>

                <div class="profit-card" style="background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);border-color:#bfdbfe;">
                    <h3 style="margin-top:0;color:#1d4ed8;font-size:18px;">💵 累積現金流（已付款叫貨納入）</h3>
                    <div class="profit-row"><span>累積已付款叫貨金額</span><b>${money(cumulativePurchases)}</b></div>
                    <div class="profit-row"><span>現金流公式已逐月扣除平台抽成；廣告費仍依各月設定獨立列入固定支出</span><b>抽成與廣告費分開</b></div>
                    <div class="profit-row"><span>累積現金流淨額（營收－已付款叫貨－已記錄支出－設定固定成本＋額外收入）</span><b style="color:${cumulativeCashMovement >= 0 ? '#166534' : '#b91c1c'};">${cumulativeCashMovement >= 0 ? '+' : '−'}${money(Math.abs(cumulativeCashMovement))}</b></div>
                    <p style="font-size:12px;color:#78716c;margin:8px 0 0;">營業稅、員工勞健保及網路費依支出月份列示；保險費輸入全年金額後，損益按 12 個月平均攤提。現金流仍於實際付款月份扣除全年保險費，不會重複扣款。</p>
                </div>

                <div class="profit-card" style="background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);border-color:#bbf7d0;">
                    <h3 style="margin-top:0;color:#166534;font-size:18px;">🏷️ 設備資產與折舊</h3>
                    <div class="profit-row"><span>列管設備原始總價</span><b>${money(totalEquipmentCost)}</b></div>
                    <div class="profit-row"><span>累計折舊（設備帳面估算）</span><b>−${money(cumulativeDepreciation)}</b></div>
                    <div class="profit-row"><span>設備估算帳面剩餘價值</span><b>${money(totalEquipmentBookValue)}</b></div>
                </div>

                <div class="profit-card">
                    <h3 style="margin-top:0;color:#9a3412;font-size:17px;">📅 每月明細</h3>
                    <div style="overflow-x:auto;">
                        <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px;">
                            <thead><tr style="color:#9a3412;background:#fff7ed;">
                                <th style="text-align:left;padding:10px 8px;">月份</th>

            `;
        }

        let currentWheelCallback = null;

                    <div class="picker-wheels-container">
                        <div class="wheel-column" id="wheel-year" onscroll="handleWheelScroll('year')"></div>
                        <div class="wheel-column" id="wheel-month" onscroll="handleWheelScroll('month')"></div>
                        <div class="wheel-column" id="wheel-day" onscroll="handleWheelScroll('day')"></div>
                    </div>
                    <div class="picker-btn-group">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmWheelPicker()">確定選取</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            populateWheelColumns(initYear, initMonth, initDay, false);
        }

        function openYearMonthPicker(callback, initialYmStr) {
            isYearMonthOnlyMode = true;
            currentWheelCallback = callback;
            let nowY = new Date().getFullYear();
            let initYear = nowY;
            let initMonth = new Date().getMonth() + 1;
            if (initialYmStr && initialYmStr.includes('-')) {
                let parts = initialYmStr.split('-');
                initYear = parseInt(parts[0], 10) || nowY;
                initMonth = parseInt(parts[1], 10) || 1;
            }

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `
                <div class="picker-modal" style="width: 280px;">
                    <h4>📅 選擇年月</h4>
                    <div class="picker-wheels-container" style="justify-content: space-around;">
                        <div class="wheel-column" id="wheel-year" onscroll="handleWheelScroll('year')"></div>
                        <div class="wheel-column" id="wheel-month" onscroll="handleWheelScroll('month')"></div>
                    </div>
                    <div class="picker-btn-group" style="margin-top: 15px;">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmWheelPicker()">確定選取</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            populateWheelColumns(initYear, initMonth, 1, true);
        }

        function populateWheelColumns(selYear, selMonth, selDay, ymOnly) {
            const yearCol = document.getElementById('wheel-year');
            const monthCol = document.getElementById('wheel-month');

            let currentActualYear = new Date().getFullYear();
            let startYear = currentActualYear - 50;
            let endYear = currentActualYear + 50;

            let yearHtml = '<div style="height:47.5px;"></div>';
            for (let y = startYear; y <= endYear; y++) {
                yearHtml += `<div class="wheel-item" data-val="${y}">${y}年</div>`;
            }
            yearHtml += '<div style="height:47.5px;"></div>';
            yearCol.innerHTML = yearHtml;

            let monthHtml = '<div style="height:47.5px;"></div>';
            for (let m = 1; m <= 12; m++) {
                let mStr = m < 10 ? '0' + m : m;
                monthHtml += `<div class="wheel-item" data-val="${m}">${mStr}月</div>`;
            }
            monthHtml += '<div style="height:47.5px;"></div>';
            monthCol.innerHTML = monthHtml;

            if (!ymOnly) {
                updateDaysWheel(selYear, selMonth, selDay);
            }

            requestAnimationFrame(() => {
                scrollToValue('year', selYear);
                scrollToValue('month', selMonth);
                if (!ymOnly) scrollToValue('day', selDay);
            });
        }

        function updateDaysWheel(year, month, selectedDay) {
            const dayCol = document.getElementById('wheel-day');
            if (!dayCol) return;
            const daysInMonth = new Date(year, month, 0).getDate();
            if (selectedDay > daysInMonth) selectedDay = daysInMonth;

            let dayHtml = '<div style="height:47.5px;"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                let dStr = d < 10 ? '0' + d : d;
                dayHtml += `<div class="wheel-item" data-val="${d}">${dStr}日</div>`;
            }
            dayHtml += '<div style="height:47.5px;"></div>';
            dayCol.innerHTML = dayHtml;
            scrollToValue('day', selectedDay);
        }

        function scrollToValue(type, val) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            for (let item of items) {
                if (parseInt(item.getAttribute('data-val')) === parseInt(val)) {
                    col.scrollTop = item.offsetTop - (col.clientHeight / 2) + (item.clientHeight / 2);
                    break;
                }
            }
            highlightSelected(type);
        }

        function handleWheelScroll(type) {
            highlightSelected(type);
            if (!isYearMonthOnlyMode && (type === 'year' || type === 'month')) {
                const y = getSelectedValue('year');
                const m = getSelectedValue('month');
                const currentDay = getSelectedValue('day');
                updateDaysWheel(y, m, currentDay);
            }
        }

        function highlightSelected(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            let containerCenter = col.scrollTop + (col.clientHeight / 2);
            let closestItem = null;
            let minDiff = 9999;

            items.forEach(item => {
                let itemCenter = item.offsetTop + (item.clientHeight / 2);
                let diff = Math.abs(containerCenter - itemCenter);
                if (diff < minDiff) { minDiff = diff; closestItem = item; }
            });

            items.forEach(item => item.classList.remove('selected'));
            if (closestItem) closestItem.classList.add('selected');
        }

        function getSelectedValue(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return 1;
            const selectedItem = col.querySelector('.wheel-item.selected');
            return selectedItem ? selectedItem.getAttribute('data-val') : 1;
        }

        function confirmWheelPicker() {
            const y = getSelectedValue('year');
            const m = getSelectedValue('month');
            const mStr = m < 10 ? '0' + m : m;

            if (isYearMonthOnlyMode) {
                let formattedYm = `${y}-${mStr}`;
                if (currentWheelCallback) currentWheelCallback(formattedYm);
            } else {
                const d = getSelectedValue('day');
                const dStr = d < 10 ? '0' + d : d;
                let formattedDate = `${y}-${mStr}-${dStr}`;
                if (currentWheelCallback) currentWheelCallback(formattedDate);
            }
            closeWheelPicker();
        }

        function closeWheelPicker() {
            const overlay = document.getElementById('wheel-picker-overlay');
            if (overlay) overlay.remove();
        }
    </script>
</body>
</html>
