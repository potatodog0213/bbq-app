        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 24px 16px;
            color: var(--text-main);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        /* ===== POS 風格店務工作台：僅首頁視覺 ===== */
        #home-view {
            --pos-ink: #17212b;
            --pos-muted: #687583;
            --pos-navy: #172b3a;
            --pos-blue: #167c8d;
            --pos-cyan: #dff4f3;
            --pos-line: #dce4e9;
            position: relative;
            isolation: isolate;
            box-sizing: border-box;
            width: 100vw;
            min-height: 100svh;
            margin: -24px 0 0 calc(50% - 50vw);
            padding: 0 max(20px, calc((100vw - 1120px) / 2)) 34px;
            overflow: hidden;
            color: var(--pos-ink);
            background: #edf2f5;
        }
        #home-view::before {
            content: '';
            position: absolute;
            z-index: -1;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #17384a 0%, #167c8d 55%, #f0a34a 100%);
        }
        #home-view::after {
            content: '';
            position: absolute;
            z-index: -1;
            top: 0; right: 0;
            width: 40%; height: 260px;
            opacity: .45;
            pointer-events: none;
            background: radial-gradient(circle at 80% 15%, rgba(22,124,141,.12), transparent 62%);
        }
        #home-view .header {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 0 calc(-1 * max(20px, (100vw - 1120px) / 2)) 27px;
            padding: 23px max(24px, calc((100vw - 1072px) / 2));
            min-height: 94px;
            color: #fff;
            background: var(--pos-navy);
            border: 0;
            border-radius: 0;
            box-shadow: 0 5px 18px rgba(23,43,58,.14);
            overflow: hidden;
        }
        #home-view .header::before {
            content: 'STORE CONSOLE';
            position: absolute;
            right: max(24px, calc((100vw - 1072px) / 2));
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,.34);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.4px;
        }
        #home-view .header::after {
            content: '';
            position: absolute;
            right: 16%; top: -95px;
            width: 260px; height: 260px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
            box-shadow: 0 0 0 26px rgba(255,255,255,.025), 0 0 0 54px rgba(255,255,255,.02);
            pointer-events: none;
        }
        #home-view .brand-mark {
            width: 56px; height: 56px; flex: 0 0 56px;
            display: grid; place-items: center;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(145deg, #e6a24c, #c96d32);
            box-shadow: 0 5px 14px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.25);
            font-size: 29px;
            animation: pos-mark-pulse 4s ease-in-out infinite;
        }
        @keyframes pos-mark-pulse { 0%,100% { box-shadow: 0 5px 14px rgba(0,0,0,.2), 0 0 0 0 rgba(230,162,76,0); } 50% { box-shadow: 0 5px 14px rgba(0,0,0,.2), 0 0 0 7px rgba(230,162,76,.10); } }
        #home-view .header-copy { position: relative; z-index: 1; text-align: left; }
        #home-view .home-logout-btn {
            position: relative; z-index: 2; margin-left: auto; flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,.34); border-radius: 10px;
            padding: 10px 15px; color: #fff; background: rgba(255,255,255,.12);
            font-size: 13px; font-weight: 800; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
        }
        #home-view .home-logout-btn:hover { background: rgba(255,255,255,.2); }
        #home-view .home-logout-btn:active { transform: scale(.97); }
        #home-view .header h1 {
            margin: 0 0 5px;
            color: #fff;
            font-size: clamp(25px, 3.5vw, 31px);
            line-height: 1.12;
            font-weight: 850;
            letter-spacing: 1.5px;
        }
        #home-view .header p {
            margin: 0;
            color: #9ed7d9;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        #home-view .home-section-title {
            display: flex; align-items: center; gap: 10px;
            margin: 0 0 15px 1px;
            color: #405260;
            font-size: 13px;
            font-weight: 850;
            letter-spacing: .8px;
        }
        #home-view .home-section-title::before {
            content: '';
            width: 4px; height: 19px;
            border-radius: 4px;
            background: #168394;
        }
        #home-view .home-section-title::after { content: ''; height: 1px; flex: 1; background: #d2dce2; }
        #home-view .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
        }
        #home-view .menu-card {
            position: relative;
            box-sizing: border-box;
            min-height: 126px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding: 18px 18px;
            border: 1px solid #dce5ea;
            border-left: 4px solid #a8c6cd;
            border-radius: 13px;
            color: var(--pos-ink);
            background: #fff;
            box-shadow: 0 2px 5px rgba(23,43,58,.035), 0 7px 16px rgba(23,43,58,.035);
            cursor: pointer;
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #home-view .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, rgba(22,124,141,.055), transparent 48%);
            opacity: 0;
            transition: opacity .2s ease;
            pointer-events: none;
        }
        #home-view .menu-card:hover { transform: translateY(-3px); border-color: #9bc6cc; border-left-color: #167c8d; box-shadow: 0 9px 22px rgba(23,43,58,.11); }
        #home-view .menu-card:hover::before { opacity: 1; }
        #home-view .menu-card:active { transform: scale(.985); }
        #home-view .menu-icon {
            position: relative; z-index: 1;
            width: 54px; height: 54px; flex: 0 0 54px;
            display: grid; place-items: center;
            border: 1px solid #cfe5e7;
            border-radius: 12px;
            color: #176c7a;
            background: #e7f4f4;
            font-size: 27px;
        }
        #home-view .menu-card:nth-child(2) .menu-icon { color: #8b5c1d; background: #fff4df; border-color: #f1dfbd; }
        #home-view .menu-card:nth-child(3) .menu-icon { color: #47724e; background: #edf5eb; border-color: #d9e8d6; }
        #home-view .menu-card:nth-child(4) .menu-icon { color: #536a8a; background: #edf2fa; border-color: #d9e2f1; }
        #home-view .menu-card:nth-child(5) .menu-icon { color: #9a5a32; background: #fbefe8; border-color: #f0ddd0; }
        #home-view .menu-card:nth-child(6) .menu-icon { color: #8b6b25; background: #f8f3e4; border-color: #e9dfc2; }
        #home-view .menu-card-content { position: relative; z-index: 1; min-width: 0; width: 100%; padding-right: 16px; }
        #home-view .menu-card-content h3 { margin: 0; color: #1c2c38; font-size: 16px; line-height: 1.42; font-weight: 800; letter-spacing: .1px; overflow-wrap: anywhere; }
        #home-view .arrow { position: absolute; right: 14px; bottom: 12px; color: #78909b; font-size: 17px; line-height: 1; font-weight: 800; transition: transform .18s ease, color .18s ease; }
        #home-view .menu-card:hover .arrow { transform: translate(2px,-2px); color: #167c8d; }
        #home-view .menu-card.capital-card {
            grid-column: 1 / -1;
            min-height: 94px;
            flex-direction: row;
            align-items: center;
            gap: 17px;
            padding: 16px 20px;
            border: 1px solid #176d7a;
            border-left: 5px solid #e4a34c;
            border-radius: 13px;
            color: #fff;
            background: linear-gradient(105deg, #174454 0%, #176d7a 100%);
            box-shadow: 0 7px 17px rgba(23,83,96,.17);
        }
        #home-view .menu-card.capital-card::before { background: linear-gradient(105deg, rgba(255,255,255,.08), transparent 65%); }
        #home-view .menu-card.capital-card:hover { border-color: #2b8792; border-left-color: #f0b45e; box-shadow: 0 12px 24px rgba(23,83,96,.23); }
        #home-view .menu-card.capital-card .menu-icon { width: 54px; height: 54px; flex-basis: 54px; border: 1px solid rgba(255,255,255,.24); border-radius: 12px; color: #fff; background: rgba(255,255,255,.12); font-size: 27px; }
        #home-view .menu-card.capital-card .menu-card-content h3 { color: #fff; font-size: 17px; }
        #home-view .menu-card.capital-card .arrow { right: 20px; bottom: 50%; color: #d7f0ee; transform: translateY(50%); }
        #home-view .menu-card.capital-card:hover .arrow { transform: translate(3px,50%); color: #fff; }
        #home-view .home-footnote { margin: 20px 2px 0; color: #778792; font-size: 11px; font-weight: 700; text-align: center; letter-spacing: 1px; }
        @media (max-width: 760px) {
            #home-view { padding: 0 14px 24px; }
            #home-view .header { margin: 0 -14px 19px; padding: 19px 17px; min-height: 76px; }
            #home-view .header::before { content: 'POS STYLE'; right: 16px; font-size: 9px; letter-spacing: 1.5px; }
            #home-view .brand-mark { width: 48px; height: 48px; flex-basis: 48px; border-radius: 12px; font-size: 25px; }
            #home-view .header h1 { font-size: 24px; }
            #home-view .header p { font-size: 9px; letter-spacing: 1.3px; }
            #home-view .home-section-title { margin-bottom: 11px; font-size: 12px; }
            #home-view .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
            #home-view .menu-card { min-height: 112px; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 9px; padding: 12px 11px 14px; border-radius: 11px; }
            #home-view .menu-icon { width: 42px; height: 42px; flex-basis: 42px; border-radius: 10px; font-size: 22px; }
            #home-view .menu-card-content { padding-right: 10px; }
            #home-view .menu-card-content h3 { font-size: 14px; line-height: 1.35; }
            #home-view .arrow { right: 10px; bottom: 10px; font-size: 16px; }
            #home-view .menu-card.capital-card { min-height: 78px; flex-direction: row; align-items: center; padding: 12px; gap: 11px; }
            #home-view .menu-card.capital-card .menu-icon { width: 44px; height: 44px; flex-basis: 44px; font-size: 23px; }
            #home-view .menu-card.capital-card .menu-card-content h3 { font-size: 14px; }
            #home-view .menu-card.capital-card .arrow { right: 13px; }
            #home-view .home-footnote { margin-top: 16px; font-size: 10px; }
        }
        @media (max-width: 360px) {
            #home-view { padding-left: 11px; padding-right: 11px; }
            #home-view .header { margin-left: -11px; margin-right: -11px; padding-left: 13px; }
            #home-view .menu-grid { gap: 7px; }
            #home-view .menu-card { min-height: 106px; padding: 10px 9px 12px; }
            #home-view .menu-card-content h3 { font-size: 13px; }
        }
        @media (prefers-reduced-motion: reduce) { #home-view *, #home-view *::before, #home-view *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

        .purchase-compare-toggle {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:12px 14px; border:1px solid #eadbc7; border-radius:11px;
            background:#fffaf2; margin:4px 0 16px; cursor:pointer;
        }
        .purchase-compare-toggle input { width:19px; height:19px; accent-color:#b97850; }
        .purchase-price-change { margin-top:6px; font-size:13px; font-weight:800; }
        .purchase-price-up { color:#dc2626; }
        .purchase-price-down { color:#16a34a; }
        .purchase-price-same { color:#78716c; }
        .purchase-not-compared { color:#9a8068; font-size:12px; margin-top:6px; }
        .order-layout { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr); gap:16px; align-items:start; }
        .order-category-group { margin:12px 0 18px; }
        .order-category-group h4 { margin:0 0 9px; padding:8px 10px; border-left:4px solid #b97850; border-radius:7px; background:#f7eadb; color:#795238; font-size:14px; }

        /* 子頁面容器 */
        .page-view {
            display: none;
            background: #ffffff;
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(120, 53, 15, 0.06);
            border: 1px solid #fed7aa;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            border-bottom: 1px solid #fed7aa;

        .picker-overlay {

            display: flex;
            justify-content: center;
            align-items: center;

            background: white;

            gap: 8px;
            margin-bottom: 20px;
            height: 140px;
            position: relative;
        }
        .picker-wheels-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 45px;
            transform: translateY(-50%);
            border-top: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            background: rgba(234, 88, 12, 0.05);
            pointer-events: none;
            box-sizing: border-box;
            z-index: 2;
        }
        .wheel-column {
            flex: 1 1 100%;
            width: 100%;
            min-width: 100%;
            align-self: stretch;
            height: 100%;
            min-height: 0;
            overflow-y: scroll;
            touch-action: pan-y;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-snap-type: y mandatory;
            padding: 47.5px 0;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        .wheel-column::-webkit-scrollbar { display: none; }
        .wheel-item {
            pointer-events: none;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            color: #78716c;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s, font-size 0.2s;
            box-sizing: border-box;
            padding: 0 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .wheel-item.selected {
            color: #c2410c;
            font-size: 17px;
            font-weight: 700;
        }
        .picker-btn-group {
            display: flex;
            gap: 10px;

        .picker-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;

            cursor: pointer;
            font-size: 14px;
        }
        .picker-confirm { background: var(--primary); color: white; }
        .picker-confirm:hover { background: var(--primary-hover); }
        .picker-cancel { background: #e2e8f0; color: #334155; }
        .picker-cancel:hover { background: #cbd5e1; }

        function decodeIntegratedMenuGenerator(){const binary=atob(INTEGRATED_MENU_GENERATOR_B64);return new TextDecoder('utf-8').decode(Uint8Array.from(binary,ch=>ch.charCodeAt(0)));}
        let integratedMenuFrame=null, integratedMenuProducts=[];
        let integratedMenuSettingsSaveTimer=null;
        let integratedMenuSettingsSaveQueue=Promise.resolve();
        async function loadIntegratedMenuSettings(){
            const { data, error } = await _supabase.from('menu_generator_settings').select('settings_json').eq('id','default').maybeSingle();
            if(error) throw error;
            return data?.settings_json || null;
        }
        async function saveIntegratedMenuSettings(settings){
            const { error } = await _supabase.from('menu_generator_settings').upsert({id:'default',settings_json:settings,updated_at:new Date().toISOString()},{onConflict:'id'});
            if(error) throw error;
        }
        window.addEventListener('message', async event => {
            if(!integratedMenuFrame || event.source !== integratedMenuFrame.contentWindow || !event.data) return;
            if(event.data.type === 'MALINJI_MENU_READY'){
                integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_PRODUCTS_SYNC',products:integratedMenuProducts},'*');
                try{
                    const settings = await loadIntegratedMenuSettings();
                    integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_MENU_SETTINGS_SYNC',settings},'*');
                }catch(error){
                    integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_MENU_SETTINGS_SAVE_RESULT',ok:false,error:error.message},'*');
                    showAppToast('菜單設定讀取失敗',error.message,'error');
                }
            }
            if(event.data.type === 'MALINJI_MENU_SETTINGS_SAVE'){
                if(event.data.manual !== true) return;
                clearTimeout(integratedMenuSettingsSaveTimer);
                const settings = event.data.settings;
                const saveNow = async () => {
                    try{
                        await saveIntegratedMenuSettings(settings);
                        integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_MENU_SETTINGS_SAVE_RESULT',ok:true,requestId:event.data.requestId||null},'*');
                        if(event.data.requestId) showCenteredAppToast('保存成功','菜單設定已成功保存到雲端。');
                    }catch(error){
                        integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_MENU_SETTINGS_SAVE_RESULT',ok:false,error:error.message,requestId:event.data.requestId||null},'*');
                        showAppToast('菜單設定保存失敗',error.message,'error');
                    }
                };
                integratedMenuSettingsSaveQueue = integratedMenuSettingsSaveQueue.then(saveNow,saveNow);
            }
            if(event.data.type === 'MALINJI_MENU_FRAME_HEIGHT'){
                const height=Math.max(1,Math.ceil(Number(event.data.height)||1)+2);
                if(integratedMenuFrame){integratedMenuFrame.style.height=height+'px';integratedMenuFrame.style.minHeight='0px';integratedMenuFrame.style.display='block';}
            }
        });
        async function fetchIntegratedMenuProducts(){
            const {data,error}=await _supabase.from('products').select('id,name,price').order('id',{ascending:true});
            if(error)throw error;
            integratedMenuProducts=(data||[]).map(item=>({id:item.id,name:item.name,price:item.price}));
            return integratedMenuProducts;
        }
        async function refreshIntegratedMenuProducts(){
            try{await fetchIntegratedMenuProducts();if(integratedMenuFrame?.contentWindow)integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_PRODUCTS_SYNC',products:integratedMenuProducts},'*');showAppToast('品項同步完成',`已從販售品項成本表同步 ${integratedMenuProducts.length} 項。`,'success');}
            catch(error){showAppToast('同步失敗',error.message,'error');}
        }
        async function renderIntegratedMenuGenerator(){
            const content=document.getElementById('page-content');content.innerHTML='<div style="padding:24px;text-align:center;color:#8b5c3d;">正在載入菜單產生器與販售品項……</div>';
            try{await fetchIntegratedMenuProducts();}
            catch(error){content.innerHTML=`<p style="color:#b91c1c;padding:20px;">讀取販售品項失敗：${error.message}</p>`;return;}
            content.innerHTML='<iframe id="integrated-menu-generator-frame" title="雙版本菜單產生器" scrolling="no" style="display:block;width:100%;height:1px;min-height:0;overflow:hidden;border:0;border-radius:12px;background:#fff;"></iframe><button type="button" id="menu-generator-collapse-proxy" class="order-products-collapse-btn" style="position:fixed;right:12px;top:50%;z-index:1201;" onclick="toggleIntegratedMenuList()">收合菜單</button>';
            integratedMenuFrame=document.getElementById('integrated-menu-generator-frame');
            integratedMenuFrame.srcdoc=decodeIntegratedMenuGenerator();
            integratedMenuFrame.addEventListener('load',()=>integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_PRODUCTS_SYNC',products:integratedMenuProducts},'*'));
        }

        function toggleIntegratedMenuList() {
            if (!integratedMenuFrame?.contentWindow) return;
            integratedMenuFrame?.contentWindow?.postMessage({type:'MALINJI_TOGGLE_MENU_LIST'}, '*');
            const button=document.getElementById('menu-generator-collapse-proxy');
            if(button) button.textContent=button.textContent.includes('收合')?'展開菜單':'收合菜單';
        }

        function goHome() {
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            if (_supabase) refreshCustomerHomeUnread();
        }
        async function initCustomerHomeOrderRealtime(){try{const {data:{session}}=await _supabase.auth.getSession();if(!session)return;const {data:{user}}=await _supabase.auth.getUser();if(!customerOwnerRole(user))return;await refreshCustomerHomeUnread();if(customerHomeRealtime)await _supabase.removeChannel(customerHomeRealtime);customerHomeRealtime=_supabase.channel('customer-orders-home-badge').on('postgres_changes',{event:'*',schema:'public',table:'customer_orders'},()=>{refreshCustomerHomeUnread();}).subscribe();}catch(e){console.warn('home order notification init skipped',e);}}
        async function refreshCustomerHomeUnread(){try{const {data:{session}}=await _supabase.auth.getSession();if(!session)return;const {data:{user}}=await _supabase.auth.getUser();if(!customerOwnerRole(user))return;const {data}=await _supabase.from('customer_orders').select('id,status').eq('status','new').order('created_at',{ascending:false}).limit(100);const read=customerReadOrderIds();const count=(data||[]).filter(o=>!read.has(String(o.id))).length;const badge=document.getElementById('customer-home-unread-badge');if(badge){badge.textContent=String(count);badge.style.display=count?'inline-flex':'none';}}catch(e){console.warn('unread badge update skipped',e);}}

        function showAppToast(title, detail = '', type = 'success') {
            const oldToast = document.getElementById('app-toast-notice');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.id = 'app-toast-notice';
            toast.className = `app-toast ${type}`;
            toast.setAttribute('role', 'status');
            toast.innerHTML = `<div class="toast-icon">${type === 'success' ? '✓' : '!'}</div><div style="min-width:0;flex:1;"><p class="toast-title"></p><p class="toast-detail"></p></div><button class="toast-close" aria-label="關閉提示" onclick="this.parentElement.remove()">×</button>`;
            toast.querySelector('.toast-title').textContent = title;
            toast.querySelector('.toast-detail').textContent = detail;
            document.body.appendChild(toast);
            window.setTimeout(() => { if (toast.isConnected) toast.remove(); }, 3600);
        }

        function showCenteredAppToast(title, detail = '') {
            showAppToast(title, detail, 'success');
            const toast = document.getElementById('app-toast-notice');
            if (toast) toast.classList.add('centered');
        }

        function getDetailedTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}:${s}`;
        }

        function getCurrentYearMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        // 共用年月選擇欄：維持原本單一欄位的設計，點擊後使用既有年月選擇器。
        function renderYearMonthDropdowns(prefix, selectedYm, rows = [], handler = '', disabled = false) {
            const safeYm = /^\d{4}-\d{2}$/.test(String(selectedYm || '')) ? selectedYm : getCurrentYearMonth();
            const label = `${safeYm.slice(0, 4)}年 ${Number(safeYm.slice(5, 7))}月`;
            const disabledStyle = disabled ? 'background:#f5f5f4;color:#a8a29e;cursor:not-allowed;' : 'background:#fff;color:#57534e;cursor:pointer;';
            return `<input type="text" id="${prefix}-yearmonth-select" class="search-input" value="📅 ${label}" readonly ${disabled ? 'disabled' : ''}
                onclick="openYearMonthPicker(function(ym){ applyYearMonthSelection('${prefix}', ym); }, '${safeYm}')"
                aria-label="選擇年月" title="點擊選擇年月" style="width:142px;min-width:142px;${disabledStyle}font-weight:600;">`;
        }

        function applyYearMonthSelection(prefix, ym) {
            const value = String(ym || '').slice(0, 7);
            if (!/^\d{4}-\d{2}$/.test(value)) return;
            if (prefix === 'profit') {
                currentProfitMonth = value;
                renderProfitView();
            } else if (prefix === 'expense') {
                expenseSearchDateVal = value;
                displayExpensesList();
            } else if (prefix === 'purchase') {
                currentPurchaseFilterMonth = value;
                purchaseMonthFilterEnabled = true;
                renderPurchasesList();
            }
        }

        // 平台抽成比例沿用既有 settings.settings_json 儲存，不新增或修改資料表欄位。
        const DEFAULT_PLATFORM_RATES = { ubereatsCommissionRate: 0, foodpandaCommissionRate: 0 };
        let globalPlatformRates = { ...DEFAULT_PLATFORM_RATES };
        let selectedPlatformSettingsMonth = getCurrentYearMonth();

        function platformRatesFromRows(rows, month) {
            const row = (rows || []).find(r => String(r.month || '') === String(month || ''));
            const settings = row?.settings_json || {};
            return {
                ubereatsCommissionRate: settings.ubereatsCommissionRate === undefined ? 0 : Math.max(0, Math.min(100, Number(settings.ubereatsCommissionRate) || 0)),
                foodpandaCommissionRate: settings.foodpandaCommissionRate === undefined ? 0 : Math.max(0, Math.min(100, Number(settings.foodpandaCommissionRate) || 0))
            };
        }

        async function getPlatformRatesForMonth(month) {
            const { data, error } = await _supabase.from('settings')
                .select('month,settings_json').eq('month', month).maybeSingle();
            if (error) {
                console.error('讀取平台抽成比例失敗：', month, error);
                return { ...DEFAULT_PLATFORM_RATES };
            }
            return platformRatesFromRows(data ? [data] : [], month);
        }

        async function getPlatformRates() {
            globalPlatformRates = await getPlatformRatesForMonth(getCurrentYearMonth());
            return globalPlatformRates;
        }

        // 外送平台設定共用店內支出記錄表的年月滾輪選擇器。
        function setPlatformSettingsMonth(selectedMonth) {
            const month = String(selectedMonth || '').substring(0, 7);
            if (!/^\d{4}-\d{2}$/.test(month)) return;
            selectedPlatformSettingsMonth = month;
            const monthInput = document.getElementById('platform-settings-month');
            if (monthInput) monthInput.value = `📅 ${month.replace('-', '年 ')}月`;
            loadPlatformRatesForSelectedMonth();
        }

        async function loadPlatformRatesForSelectedMonth() {
            // 顯示欄位為格式化文字，實際年月以 selectedPlatformSettingsMonth 為準。
            const month = selectedPlatformSettingsMonth;
            if (!/^\d{4}-\d{2}$/.test(String(month || ''))) return;
            const rates = await getPlatformRatesForMonth(month);
            // 避免較慢的舊月份讀取結果覆蓋使用者剛切換的新月份。
            if (month !== selectedPlatformSettingsMonth) return;
            const ueInput = document.getElementById('platform-ubereats-rate');
            const fpInput = document.getElementById('platform-foodpanda-rate');
            if (ueInput) ueInput.value = rates.ubereatsCommissionRate;
            if (fpInput) fpInput.value = rates.foodpandaCommissionRate;
        }

        async function savePlatformRates() {
            const ue = Number(document.getElementById('platform-ubereats-rate')?.value);
            const fp = Number(document.getElementById('platform-foodpanda-rate')?.value);
            if (!Number.isFinite(ue) || !Number.isFinite(fp) || ue < 0 || ue > 100 || fp < 0 || fp > 100) {
                alert('請輸入 0 至 100 之間的抽成百分比。');
                return;
            }

            // 顯示欄位是格式化文字；儲存月份一律使用實際選取狀態。
            const month = selectedPlatformSettingsMonth;
            if (!/^\d{4}-\d{2}$/.test(String(month || ''))) {
                alert('請先選擇有效的設定月份。');
                return;
            }
            const { data: existing, error: readError } = await _supabase
                .from('settings').select('month,settings_json').eq('month', month).maybeSingle();
            if (readError) { alert('讀取月份設定失敗：' + readError.message); return; }

            const rates = { ubereatsCommissionRate: ue, foodpandaCommissionRate: fp };
            let result;
            if (existing) {
                result = await _supabase.from('settings')
                    .update({ settings_json: { ...(existing.settings_json || {}), ...rates } })
                    .eq('month', month);
            } else {
                result = await _supabase.from('settings').insert([{
                    month,
                    settings_json: { ...DEFAULT_MONTH_SETTINGS, ...rates, fixedCostsConfigured: false }
                }]);
            }
            if (result.error) { alert('儲存平台抽成失敗：' + result.error.message); return; }

            if (month === getCurrentYearMonth()) globalPlatformRates = rates;
            showAppToast(`${month} 平台抽成比例已儲存`, '只有所選月份的抽成設定會更新，其他月份不受影響。', 'success');
            if (currentPage === 'products') renderProductsList();
            else if (currentPage === 'profit') renderProfitView();
            else if (currentPage === 'capital') renderCapitalView();
        }

        function calculateCostRate(item) {
            if (!item.price || item.price <= 0) return 0;
            return (item.package_cost / item.price) * 100;
        }

        function filterProductsCards() {
            const searchInputEl = document.getElementById('product-search-input');
            const sortSelectEl = document.getElementById('product-sort-select');
            const containerEl = document.getElementById('products-cards-container');
            const statsLabelEl = document.getElementById('product-stats-label');
            if (!containerEl) return;

            const searchQuery = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';
            const sortOrder = sortSelectEl ? sortSelectEl.value : 'price-asc';

            let filteredData = globalProductsData.filter(item => {
                if (!searchQuery) return true;
                return (item.name && item.name.toLowerCase().includes(searchQuery)) || (item.note && item.note.toLowerCase().includes(searchQuery));
            });

            if (sortOrder === 'price-asc') filteredData.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sortOrder === 'price-desc') filteredData.sort((a, b) => (b.price || 0) - (a.price || 0));
            else if (sortOrder === 'cost-rate-asc') filteredData.sort((a, b) => calculateCostRate(a) - calculateCostRate(b));
            else if (sortOrder === 'cost-rate-desc') filteredData.sort((a, b) => calculateCostRate(b) - calculateCostRate(a));

            let totalCostRate = 0;
            if (filteredData.length > 0) {
                totalCostRate = (filteredData.reduce((acc, item) => acc + calculateCostRate(item), 0) / filteredData.length).toFixed(1);
            }

            if (statsLabelEl) {
                statsLabelEl.innerHTML = `共 <b>${filteredData.length}</b> 項 &nbsp;|&nbsp; 平均成本率：<b>${totalCostRate}%</b>`;
            }

            let html = '';
            if (filteredData.length > 0) {
                filteredData.forEach((item, index) => {
                    let costRate = calculateCostRate(item).toFixed(1);
                    let zebraClass = (index % 2 === 1) ? 'zebra-alt' : '';

                    let currentPrice = parseFloat(item.price) || 0;
                    let productCost = parseFloat(item.package_cost) || 0;
                    let ueRate = (Number(globalPlatformRates.ubereatsCommissionRate) || 0) / 100;
                    let fpRate = (Number(globalPlatformRates.foodpandaCommissionRate) || 0) / 100;
                    const ueBreakEvenPrice = ueRate >= 1 ? null : Math.round(currentPrice / (1 - ueRate));
                    const fpBreakEvenPrice = fpRate >= 1 ? null : Math.round(currentPrice / (1 - fpRate));
                    const formatBreakEvenPrice = value => value === null ? '無法計算' : `$${value} 元`;

                    html += `
                        <div class="item-card ${zebraClass}" id="card-${item.id}">
                            <div class="card-main-info">
                                <h4>${item.name} <span>現場售價：$${item.price} 元</span></h4>
                                <p><b>食材單價：</b>$${item.ingredient_cost}</p>
                                <p><b>總成本：</b>$${item.package_cost} &nbsp;|&nbsp; <span class="cost-rate">成本率：${costRate}%</span></p>
                                <p><b>原本商品毛利：</b>$${(currentPrice - productCost).toFixed(2)} 元</p>
                                <div class="platform-breakeven-box">
                                    <div><b style="color:#059669;">UberEats（抽成 ${ueRate * 100}%）打平售價</b><b>${formatBreakEvenPrice(ueBreakEvenPrice)}</b></div>
                                    <div style="border-top:1px dashed #fed7aa;padding-top:6px;margin-top:6px;"><b style="color:#d97706;">foodpanda（抽成 ${fpRate * 100}%）打平售價</b><b>${formatBreakEvenPrice(fpBreakEvenPrice)}</b></div>
                                </div>
                                <p style="margin-top:6px;"><b>備註：</b>${parseProductNote(item.note).note || '無'}</p>
                            </div>
                            <div class="card-actions" id="actions-${item.id}">
                                <button class="card-btn edit-btn" onclick="renderEditProductForm(${item.id})">✏️ 修改</button>
                                <button class="card-btn delete-btn" onclick="showDeleteConfirmProduct(${item.id})">🗑️ 刪除</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                html = '<p style="color:var(--text-muted); text-align:center; padding: 40px 0; grid-column: 1 / -1;">沒有找到符合條件的品項紀錄。</p>';
            }
            containerEl.innerHTML = html;
        }

        function showDeleteConfirmProduct(id) {
            const cardEl = document.getElementById(`card-${id}`);
            const actionsEl = document.getElementById(`actions-${id}`);
            cardEl.classList.add('confirm-delete-state');
            actionsEl.innerHTML = `
                <span style="font-size: 12.5px; font-weight: 700; color: #dc2626; display: flex; align-items: center; flex: 1;">確定刪除？</span>
                <button class="card-btn" style="background: #ef4444; color: white;" onclick="deleteProduct(${id})">確定</button>
                <button class="card-btn" style="background: #e2e8f0; color: #334155;" onclick="filterProductsCards()">取消</button>
            `;
        }

        const PRODUCT_META_PREFIX = '__MALINJI_COST_V1__';

        function parseProductNote(rawNote) {
            const raw = String(rawNote || '');
            if (!raw.startsWith(PRODUCT_META_PREFIX)) return { note: raw, selections: { bambooId: '', bambooQuantity: 1, sauce: false, pepperId: '', extraEnabled: false, extraIds: [] } };
            try {
                const parsed = JSON.parse(raw.slice(PRODUCT_META_PREFIX.length));
                return {
                    note: String(parsed.note || ''),
                    selections: {
                        bambooId: String(parsed.selections?.bambooId || ''),
                        bambooQuantity: Math.max(1, parseInt(parsed.selections?.bambooQuantity, 10) || 1),
                        sauce: !!parsed.selections?.sauce,
                        pepperId: String(parsed.selections?.pepperId || ''),
                        extraEnabled: !!parsed.selections?.extraEnabled,
                        extraIds: Array.isArray(parsed.selections?.extraIds) ? parsed.selections.extraIds.map(String) : []
                    }
                };
            } catch (e) {
                return { note: raw, selections: { bambooId: '', bambooQuantity: 1, sauce: false, pepperId: '', extraEnabled: false, extraIds: [] } };
            }

        function makeProductNote(note, selections) {

        async function getMaterialsForProductForm() {

        function openMaterialChoice(selectId) {
            const select = document.getElementById(selectId);
            if (!select) return;
            document.querySelector('.material-choice-backdrop')?.remove();
            const title = selectId.includes('bamboo') ? '選擇竹籤' : '選擇胡椒';
            const backdrop = document.createElement('div');
            backdrop.className = 'material-choice-backdrop';
            const dialog = document.createElement('div');
            dialog.className = 'material-choice-dialog';
            const heading = document.createElement('div'); heading.className = 'material-choice-title'; heading.textContent = title;
            dialog.appendChild(heading);
            Array.from(select.options).forEach(option => {
                const button = document.createElement('button'); button.type = 'button'; button.className = 'material-choice-option'; button.textContent = option.textContent;
                if (option.value === select.value) button.style.borderColor = '#ea580c';
                button.addEventListener('click', () => {
                    select.value = option.value;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    const trigger = document.getElementById(selectId + '-trigger');
                    if (trigger) trigger.textContent = option.textContent;
                    backdrop.remove();
                });
                dialog.appendChild(button);
            });
            const close = document.createElement('button'); close.type = 'button'; close.className = 'material-choice-close'; close.textContent = '取消'; close.addEventListener('click', () => backdrop.remove());
            dialog.appendChild(close); backdrop.appendChild(dialog);
            backdrop.addEventListener('click', event => { if (event.target === backdrop) backdrop.remove(); });
            document.body.appendChild(backdrop);
        }

        function buildProductCostOptions(materials, selections = {}) {
            const bamboo = materials.filter(m => String(m.name || '').includes('竹籤'));
            const sauces = materials.filter(m => String(m.name || '').includes('烤醬粉'));
            const peppers = materials.filter(m => /胡椒|椒鹽/.test(String(m.name || '')));
            const extras = ['封口膜', '吸管', '500ml飲料杯', '700ml飲料杯'];
            const selectedExtraIds = new Set((selections.extraIds || []).map(String));
            const option = (m, selected) => `<option value="${m.id}" ${String(m.id) === String(selected || '') ? 'selected' : ''}>${m.name}（$${Number(m.unit_price || 0).toFixed(2)}）</option>`;
            return `
                <div class="form-group">
                    <label>竹籤</label>
                    <select id="prod-bamboo" class="cost-material-select" onchange="updateProductCostPreview()" style="display:none">
                        <option value="">不使用竹籤</option>${bamboo.map(m => option(m, selections.bambooId)).join('')}
                    </select>
                    <button type="button" class="material-choice-button" onclick="openMaterialChoice('prod-bamboo')" id="prod-bamboo-trigger">${selections.bambooId ? (bamboo.find(m=>String(m.id)===String(selections.bambooId))?.name || '選擇竹籤') : '不使用竹籤'}</button>
                    <label style="display:block;margin-top:9px;">使用數量</label>

                <div class="form-group">
                    <label><input id="prod-sauce" type="checkbox" ${(selections.sauce === undefined ? true : !!selections.sauce) ? 'checked' : ''} onchange="updateProductCostPreview()" style="width:auto;margin-right:7px;">是否有醬（烤醬粉）</label>
                    <div class="small">${sauces.length ? sauces.map(m => `${m.name}：$${Number(m.unit_price || 0).toFixed(2)}`).join('、') : '原物料表尚無名稱包含「烤醬粉」的資料'}</div>
                </div>
                <div class="form-group">
                    <label>胡椒</label>
                    <select id="prod-pepper" class="cost-material-select" onchange="updateProductCostPreview()" style="display:none">
                        <option value="">不使用胡椒</option>${peppers.map(m => option(m, selections.pepperId)).join('')}

                </div>

                    <label><input id="prod-extra-enabled" type="checkbox" ${selections.extraEnabled ? 'checked' : ''} onchange="toggleProductExtraMaterials();updateProductCostPreview()" style="width:auto;margin-right:7px;">是否有額外材料</label>
                    <div id="prod-extra-materials" style="display:${selections.extraEnabled ? 'block' : 'none'};padding:12px;border:1px solid #fed7aa;border-radius:10px;background:#fffaf2;">
                        ${extras.map(name => {
                            const material = materials.find(m => String(m.name || '').trim() === name);
                            if (!material) return `<div class="small">${name}：原物料與耗材價格表尚無此名稱</div>`;
                            return `<label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:600;"><input type="checkbox" class="prod-extra-choice" value="${material.id}" ${selectedExtraIds.has(String(material.id)) ? 'checked' : ''} onchange="updateProductCostPreview()" style="width:auto;">${name}（$${Number(material.unit_price || 0).toFixed(2)}）</label>`;
                        }).join('')}

        function toggleProductExtraMaterials() {
            const enabled = document.getElementById('prod-extra-enabled')?.checked ?? document.getElementById('edit-extra-enabled')?.checked;
            const box = document.getElementById('prod-extra-materials') || document.getElementById('edit-extra-materials');
            if (box) box.style.display = enabled ? 'block' : 'none';
        }

        function updateProductCostPreview() {
            const base = parseFloat(document.getElementById('prod-unit-price')?.value || document.getElementById('edit-unit-price')?.value) || 0;
            const materials = window.currentProductMaterials || [];
            const getMaterial = id => materials.find(m => String(m.id) === String(id));
            const bambooId = document.getElementById('prod-bamboo')?.value || document.getElementById('edit-bamboo')?.value || '';
            const bambooQuantity = Math.max(1, parseInt(document.getElementById('prod-bamboo-qty')?.value || document.getElementById('edit-bamboo-qty')?.value || '1', 10) || 1);
            const pepperId = document.getElementById('prod-pepper')?.value || document.getElementById('edit-pepper')?.value || '';
            const sauce = !!(document.getElementById('prod-sauce')?.checked ?? document.getElementById('edit-sauce')?.checked);
            const extraEnabled = !!(document.getElementById('prod-extra-enabled')?.checked ?? document.getElementById('edit-extra-enabled')?.checked);
            const extraIds = Array.from(document.querySelectorAll('.prod-extra-choice:checked,.edit-extra-choice:checked')).map(el => el.value);
            const sauceMaterial = materials.find(m => String(m.name || '').includes('烤醬粉'));
            const selected = [];
            const bambooMaterial = getMaterial(bambooId);
            if (bambooMaterial) selected.push({...bambooMaterial, calculatedCost:(Number(bambooMaterial.unit_price)||0)*bambooQuantity, quantity:bambooQuantity});
            if (sauce && sauceMaterial) selected.push({...sauceMaterial, calculatedCost:Number(sauceMaterial.unit_price)||0});
            if (getMaterial(pepperId)) selected.push({...getMaterial(pepperId), calculatedCost:Number(getMaterial(pepperId).unit_price)||0});
            if (extraEnabled) extraIds.forEach(id => { if (getMaterial(id)) selected.push({...getMaterial(id), calculatedCost:Number(getMaterial(id).unit_price)||0}); });
            const total = base + selected.reduce((sum, m) => sum + (Number(m.calculatedCost) || 0), 0);
            const costEl = document.getElementById('prod-cost') || document.getElementById('edit-cost');
            if (costEl) costEl.value = total.toFixed(2);
            const breakdown = document.getElementById('product-cost-breakdown');
            if (breakdown) {
                const detail = selected.map(m => `${m.name}${m.quantity ? ` × ${m.quantity}` : ''} $${Number(m.calculatedCost || 0).toFixed(2)}`);
                breakdown.textContent = `總成本：$${total.toFixed(2)}${detail.length ? '（' + detail.join('＋') + '）' : ''}`;
            }
        }

        function collectProductCostSelections() {
            return {

                bambooQuantity: Math.max(1, parseInt(document.getElementById('prod-bamboo-qty')?.value || document.getElementById('edit-bamboo-qty')?.value || '1', 10) || 1),

        }

            const actionContainer = document.getElementById('top-action-container');
            titleEl.innerText = '修改原物料資料';
            actionContainer.innerHTML = `<button class="back-btn" onclick="openPage('materials')">← 回列表</button>`;
            const currentTimestamp = getDetailedTimestamp();
            contentEl.innerHTML = `
                <div class="form-card-container">
                    <h3 class="form-header-title">✏️ 正在修改：${item.name}</h3>
                    <div id="form-toast" class="toast-msg"></div>
                    <div class="form-group"><label>品項名稱</label><input type="text" id="edit-mat-name" value="${item.name}"></div>
                    <div class="form-group"><label>規格 / 單位</label><input type="text" id="edit-mat-spec" value="${item.spec || ''}"></div>
                    <div class="form-group"><label>單價 (進貨價格)</label><input type="number" step="0.01" id="edit-mat-price" value="${item.unit_price}"></div>
                    <div class="form-group"><label>合作廠商</label><input type="text" id="edit-mat-vendor" value="${item.vendor || ''}"></div>
                    <div class="form-group">
                        <label>最後更新時間 (將更新為當下時間)</label>
                        <input type="text" id="edit-mat-updated-at" value="${currentTimestamp}" readonly style="background: #f5f5f4; color: #78716c; cursor: not-allowed;">
                    </div>
                    <button id="update-mat-btn" class="action-btn" style="width:100%; padding:13px; margin-top:8px; font-size:16px; border-radius:10px;" onclick="updateMaterial(${item.id})">確認更新變更</button>
                </div>
            `;
        }

        async function updateMaterial(id) {
            const name = document.getElementById('edit-mat-name').value.trim();
            const spec = document.getElementById('edit-mat-spec').value.trim();
            const unit_price = parseFloat(document.getElementById('edit-mat-price').value) || 0;
            const vendor = document.getElementById('edit-mat-vendor').value.trim();
            const updated_at = getDetailedTimestamp();
            const toast = document.getElementById('form-toast');
            const updateBtn = document.getElementById('update-mat-btn');

            if (!name || unit_price <= 0) { toast.className = 'toast-msg toast-error'; toast.innerText = '⚠️ 請填寫完整品項名稱與有效單價！'; toast.style.display = 'block'; return; }
            if (globalMaterialsData.some(item => item.name === name && item.id !== id)) { toast.className = 'toast-msg toast-error'; toast.innerText = `⚠️ 已經有其他原物料叫「${name}」了！`; toast.style.display = 'block'; return; }

            updateBtn.disabled = true; updateBtn.innerText = '更新中...';
            const { error } = await _supabase.from('materials').update({ name, spec, unit_price, vendor, updated_at }).eq('id', id);
            if (error) { toast.className = 'toast-msg toast-error'; toast.innerText = '❌ 更新失敗：' + error.message; toast.style.display = 'block'; updateBtn.disabled = false; updateBtn.innerText = '確認更新變更'; }
            else { toast.className = 'toast-msg toast-success'; toast.innerText = '✅ 修改成功！正在返回列表...'; toast.style.display = 'block'; setTimeout(() => openPage('materials'), 1000); }
        }

        async function deleteMaterial(id) {
            const { error } = await _supabase.from('materials').delete().eq('id', id);
            if (error) alert('刪除失敗：' + error.message);
            else renderMaterialsList();
        }


        // ==================== 每日叫貨記錄表邏輯 ====================
        let currentPurchaseFilterMonth = getCurrentYearMonth();
        let purchaseMonthFilterEnabled = true; // 可自行決定是否限制在指定年月
        let purchaseSearchVendorVal = '';

        function getPurchaseCompareExcludedIds() {
            try { return JSON.parse(localStorage.getItem(PURCHASE_COMPARE_STORAGE_KEY) || '[]').map(String); }
            catch (e) { return []; }
        }
        function isPurchaseCompareEnabled(item) {
            return !getPurchaseCompareExcludedIds().includes(String(item.id));
        }
        function setPurchaseCompareEnabled(id, enabled) {
            const excluded = getPurchaseCompareExcludedIds().filter(x => x !== String(id));
            if (!enabled) excluded.push(String(id));
            localStorage.setItem(PURCHASE_COMPARE_STORAGE_KEY, JSON.stringify(excluded));
            renderPurchasesList();
        }
        function getPurchaseUnitOptionsHtml(selected) {
            const current = PURCHASE_UNITS.includes(selected) ? selected : PURCHASE_UNITS[0];
            return `<button type="button" class="order-time-btn" style="font-size:15px;padding:11px 13px;" onclick="openPurchaseUnitPicker('${current}')"><span id="${purchaseUnitTargetId || 'pur-unit-display'}">${current}　⌄</span></button>`;
        }
        function openPurchaseUnitPicker(currentUnit) {
            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay order-time-picker-overlay';
            overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `
                <div class="picker-modal" style="width:280px;">
                    <h4>📦 選擇叫貨單位</h4>
                    <div class="picker-wheels-container" style="height:120px;width:100%;box-sizing:border-box;padding:0 12px;">
                        <div class="wheel-column" id="wheel-unit" onscroll="handleWheelScroll('unit')" style="padding:37.5px 0;width:100%;min-width:100%;"></div>
                    </div>
                    <div class="picker-btn-group">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmPurchaseUnitPicker()">確定選取</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            const col = document.getElementById('wheel-unit');
            col.innerHTML = '<div style="height:37.5px;"></div>' +
                PURCHASE_UNITS.map(unit => `<div class="wheel-item" data-val="${unit}">${unit}</div>`).join('') +
                '<div style="height:37.5px;"></div>';
            requestAnimationFrame(() => {
                const target = PURCHASE_UNITS.includes(currentUnit) ? currentUnit : PURCHASE_UNITS[0];
                const item = [...col.querySelectorAll('.wheel-item')].find(el => el.dataset.val === target);
                if (item) col.scrollTop = item.offsetTop - col.clientHeight / 2 + item.clientHeight / 2;
                highlightSelected('unit');
            });
        }
        function confirmPurchaseUnitPicker() {
            const selected = getSelectedValue('unit');
            const inputId = purchaseUnitTargetId;
            const input = document.getElementById(inputId);
            if (input) input.value = selected;
            const display = document.getElementById(inputId + '-display');
            if (display) display.textContent = selected + '　⌄';
            closeWheelPicker();
        }

        async function renderPurchasesList() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 30px 0;">讀取叫貨記錄中...</p>';

            let { data, error } = await _supabase.from('purchases').select('*').order('date', { ascending: true }).order('id', { ascending: true });
            if (error) { contentEl.innerHTML = '<p style="color:red; text-align:center;">載入失敗：' + error.message + '</p>'; return; }
            globalPurchasesData = data || [];

            let monthSet = new Set();
            monthSet.add(getCurrentYearMonth());
            globalPurchasesData.forEach(item => {
                if (item.date && item.date.length >= 7) monthSet.add(item.date.substring(0, 7));
            });

            const [pYear, pMonth] = currentPurchaseFilterMonth.split('-');
            let monthDisplayTitle = purchaseMonthFilterEnabled ? `${pYear}年 ${parseInt(pMonth, 10)}月` : '不限制年月';
            let vendorDisplayStr = purchaseSearchVendorVal ? `廠商：${purchaseSearchVendorVal}` : '全部廠商';

            let html = `
                <div class="controls-bar">
                    <div class="stats-info"><span id="purchase-stats-label">載入中...</span></div>
                    <div class="search-sort-group">
                        ${renderYearMonthDropdowns('purchase', currentPurchaseFilterMonth, globalPurchasesData, 'changePurchaseYearMonth()', !purchaseMonthFilterEnabled)}
                        <label style="display:inline-flex;align-items:center;gap:5px;padding:8px 10px;background:#fff;border:1px solid #e7d9ca;border-radius:9px;font-size:12px;white-space:nowrap;"><input type="checkbox" id="purchase-month-filter-toggle" ${purchaseMonthFilterEnabled ? 'checked' : ''} onchange="togglePurchaseMonthFilter(this.checked)" style="width:16px;height:16px;">年月篩選</label>
                        <input type="text" id="purchase-vendor-filter-input" class="search-input" value="${vendorDisplayStr}" readonly onclick="openPurchaseVendorPicker()" style="cursor: pointer; background: #fff; width: 120px;">
                        <input type="text" id="purchase-search-input" class="search-input" placeholder="🔍 搜尋品項..." oninput="filterPurchasesCards()" style="width: 110px;">
                        ${(purchaseSearchVendorVal || !purchaseMonthFilterEnabled || currentPurchaseFilterMonth !== getCurrentYearMonth() || document.getElementById('purchase-search-input')?.value) ? `<button class="clear-search-btn" onclick="clearPurchaseSearch()">❌ 清除</button>` : ''}
                    </div>
                </div>
                <div id="purchases-cards-container" class="items-grid"></div>
            `;
            contentEl.innerHTML = html;
            filterPurchasesCards();
        }

        function changePurchaseMonthWheel(ymStr) {
            currentPurchaseFilterMonth = ymStr;
            purchaseMonthFilterEnabled = true;
            renderPurchasesList();
        }

        function changePurchaseYearMonth() {
            const year = document.getElementById('purchase-year-select')?.value;
            const month = document.getElementById('purchase-month-select')?.value;
            if (year && month) currentPurchaseFilterMonth = `${year}-${month}`;
            purchaseMonthFilterEnabled = true;
            const toggle = document.getElementById('purchase-month-filter-toggle');
            if (toggle) toggle.checked = true;
            renderPurchasesList();
        }

        function togglePurchaseMonthFilter(enabled) {
            purchaseMonthFilterEnabled = !!enabled;
            const yearMonthSelect = document.getElementById('purchase-yearmonth-select');
            if (yearMonthSelect) {
                yearMonthSelect.disabled = !purchaseMonthFilterEnabled;
                yearMonthSelect.style.background = purchaseMonthFilterEnabled ? '#fff' : '#f5f5f4';
                yearMonthSelect.style.cursor = purchaseMonthFilterEnabled ? 'pointer' : 'not-allowed';
            }
            filterPurchasesCards();
        }

        function filterPurchasesCards() {
            const searchInputEl = document.getElementById('purchase-search-input');
            const statsLabelEl = document.getElementById('purchase-stats-label');
            const containerEl = document.getElementById('purchases-cards-container');
            if (!containerEl) return;

            const searchQuery = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';
            let monthFilteredData = globalPurchasesData.filter(item => {
                if (!purchaseMonthFilterEnabled) return true;
                return item.date && item.date.startsWith(currentPurchaseFilterMonth);
            });

            let monthDisplayText = purchaseMonthFilterEnabled ? `${currentPurchaseFilterMonth.slice(0,4)}年 ${Number(currentPurchaseFilterMonth.slice(5,7))}月` : '所有月份';

            let vendorFilteredData = monthFilteredData.filter(item => {
                if (!purchaseSearchVendorVal) return true;
                return item.vendor && item.vendor === purchaseSearchVendorVal;
            });

            let finalData = vendorFilteredData.filter(item => {
                if (!searchQuery) return true;
                return (item.item_name && item.item_name.toLowerCase().includes(searchQuery)) ||
                       (item.vendor && item.vendor.toLowerCase().includes(searchQuery)) ||
                       (item.date && item.date.toLowerCase().includes(searchQuery));
            });

            if (statsLabelEl) {
                let vendorTextExtra = purchaseSearchVendorVal ? `（${purchaseSearchVendorVal}）` : '';
                statsLabelEl.innerHTML = `目前為 <b>${monthDisplayText}</b>${vendorTextExtra}，共 <b>${finalData.length}</b> 筆叫貨紀錄`;
            }

            let priceHistory = {};
            let cardHtmlMap = {};
            const excludedIds = getPurchaseCompareExcludedIds();
            let sortedAll = [...globalPurchasesData].sort((a,b) => {
                const dateCompare = String(a.date || '').localeCompare(String(b.date || ''));
                return dateCompare || (Number(a.id) - Number(b.id));
            });

            sortedAll.forEach(item => {
                const qty = parseFloat(item.quantity) || 1;
                const total = parseFloat(item.total_price) || 0;
                const unitPrice = qty > 0 ? total / qty : 0;
                const itemKey = `${String(item.item_name || '').trim().toLowerCase()}__${String(item.unit || '').trim()}`;
                const compareEnabled = !excludedIds.includes(String(item.id));
                const lastRecord = priceHistory[itemKey];
                let change = null;
                let previousDate = null;
                if (compareEnabled && lastRecord !== undefined && unitPrice > 0) {
                    change = unitPrice - lastRecord.unitPrice;
                    previousDate = lastRecord.date;
                }
                if (compareEnabled && unitPrice > 0) priceHistory[itemKey] = { unitPrice, date: item.date };
                cardHtmlMap[item.id] = { unitPrice, change, compareEnabled, previousDate };
            });

            let html = '';
            let displayList = [...finalData].sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')) || (Number(b.id) - Number(a.id)));

            if (displayList.length > 0) {
                // 先依日期，再依廠商分組：同一天同一廠商只顯示一張卡片。
                const dateGroups = new Map();
                displayList.forEach(item => {
                    const dateKey = item.date || '未設定日期';
                    const vendorKey = String(item.vendor || '').trim() || '未設定廠商';
                    if (!dateGroups.has(dateKey)) dateGroups.set(dateKey, new Map());
                    const vendorGroups = dateGroups.get(dateKey);
                    if (!vendorGroups.has(vendorKey)) vendorGroups.set(vendorKey, []);
                    vendorGroups.get(vendorKey).push(item);
                });

                dateGroups.forEach((vendorGroups, dateKey) => {
                    const dateItems = [...vendorGroups.values()].flat();
                    const dateTotal = dateItems.reduce((sum, item) => sum + (parseFloat(item.total_price) || 0), 0);
                    html += `
                        <section class="purchase-date-group" style="grid-column:1/-1;margin:8px 0 18px;">
                            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:10px;border-radius:12px;background:#f3e8d9;border:1px solid #e5d2bd;color:#6f4e37;">
                                <strong style="font-size:16px;">📅 ${dateKey}</strong>
                                <span style="font-size:13px;">${dateItems.length} 筆細項・${vendorGroups.size} 家廠商・當日合計 <b>$${dateTotal.toLocaleString()}</b></span>
                            </div>
                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px;">
                    `;

                    vendorGroups.forEach((items, vendorName) => {
                        const vendorTotal = items.reduce((sum, item) => sum + (parseFloat(item.total_price) || 0), 0);
                        const itemRows = items.map(item => {
                            const info = cardHtmlMap[item.id] || { unitPrice: 0, change: null, compareEnabled: true };
                            const qty = parseFloat(item.quantity) || 1;
                            const total = parseFloat(item.total_price) || 0;
                            const unit = item.unit || '條';
                            const previousDateText = info.previousDate ? `${new Date(info.previousDate + 'T00:00:00').getFullYear()}年${new Date(info.previousDate + 'T00:00:00').getMonth()+1}月${new Date(info.previousDate + 'T00:00:00').getDate()}日` : '';
                            const changeBadge = !info.compareEnabled
                                ? `<div class="purchase-not-compared">⏸ 此筆紀錄不參與比價</div>`
                                : info.change === null ? ''
                                : info.change > 0
                                    ? `<div class="purchase-price-change purchase-price-up">▲ 比上次（${previousDateText}）貴 $${Math.abs(info.change).toFixed(2)} / ${unit}</div>`
                                    : info.change < 0
                                        ? `<div class="purchase-price-change purchase-price-down">▼ 比上次（${previousDateText}）便宜 $${Math.abs(info.change).toFixed(2)} / ${unit}</div>`
                                        : `<div class="purchase-price-change purchase-price-same">＝ 與上次（${previousDateText}）價格相同</div>`;
                            const compareChecked = info.compareEnabled ? 'checked' : '';
                            const priceClass = info.change > 0 ? 'purchase-price-up' : info.change < 0 ? 'purchase-price-down' : '';
                            return `
                                <div class="purchase-vendor-item" style="padding:12px 0;border-top:1px solid #eee2d5;">
                                    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
                                        <div style="min-width:0;">
                                            <strong style="color:#5f4634;">${item.item_name || '未命名品項'}</strong>
                                            <div style="font-size:13px;color:#806b57;margin-top:5px;">數量：${qty} ${unit}　|　單價：$${Math.round(info.unitPrice).toLocaleString()} / ${unit}</div>
                                            <div style="font-size:13px;color:#806b57;margin-top:3px;">小計：<b>$${total.toLocaleString()}</b></div>
                                        </div>
                                        <div class="card-actions" style="flex-shrink:0;">
                                            <button class="card-btn edit-btn" onclick="renderEditPurchaseForm(${item.id})">✏️ 修改</button>
                                            <button class="card-btn delete-btn" onclick="showDeleteConfirmPurchase(${item.id})">🗑️ 刪除</button>
                                        </div>
                                    </div>
                                    ${changeBadge}
                                    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:#806b57;">
                                        <input type="checkbox" ${compareChecked} onchange="setPurchaseCompareEnabled(${item.id}, this.checked)" style="width:17px;height:17px;accent-color:#b97850;">
                                        參與價格比較
                                    </label>
                                </div>
                            `;
                        }).join('');

                        html += `
                            <details class="purchase-vendor-card" style="background:#fff;border:1px solid #e7d9ca;border-radius:14px;padding:0 14px;box-shadow:0 2px 8px rgba(90,60,35,.06);">
                                <summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;color:#654b37;">
                                    <span style="font-weight:800;">🏢 ${vendorName}</span>
                                    <span style="font-size:13px;color:#806b57;text-align:right;">${items.length} 筆　合計 <b style="color:#8d5737;">$${vendorTotal.toLocaleString()}</b>　⌄</span>
                                </summary>
                                <div style="padding-bottom:8px;">
                                    ${itemRows}
                                </div>
                            </details>
                        `;
                    });

                    html += `</div></section>`;
                });
            } else {
                html = '<p style="color:var(--text-muted); text-align:center; padding: 40px 0;">此條件下沒有叫貨紀錄。</p>';
            }
            containerEl.innerHTML = html;
        }

        function openPurchaseVendorPicker() {
            let vendors = ['全部廠商'];
            globalPurchasesData.forEach(item => { if (item.vendor && !vendors.includes(item.vendor)) vendors.push(item.vendor); });
            let currentSel = purchaseSearchVendorVal || '全部廠商';

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `
                <div class="picker-modal">
                    <h4>🏢 選擇合作廠商篩選</h4>
                    <div class="picker-wheels-container" style="height: 120px;">
                        <div class="wheel-column" id="wheel-vendor" onscroll="handleWheelScroll('vendor')" style="padding: 37.5px 0;"></div>
                    </div>
                    <div class="picker-btn-group">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmVendorPicker()">確定選取</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const col = document.getElementById('wheel-vendor');
            let html = '<div style="height:37.5px;"></div>';
            vendors.forEach(v => { html += `<div class="wheel-item" data-val="${v}">${v}</div>`; });
            html += '<div style="height:37.5px;"></div>';
            col.innerHTML = html;

            requestAnimationFrame(() => {
                const items = col.querySelectorAll('.wheel-item');
                for (let item of items) {
                    if (item.getAttribute('data-val') === currentSel) {
                        col.scrollTop = item.offsetTop - (col.clientHeight / 2) + (item.clientHeight / 2);
                        break;
                    }
                }
                highlightSelected('vendor');
            });
        }

        function confirmVendorPicker() {
            const col = document.getElementById('wheel-vendor');
            if (col) {
                const selItem = col.querySelector('.wheel-item.selected');
                if (selItem) {
                    let val = selItem.getAttribute('data-val');
                    purchaseSearchVendorVal = (val === 'ALL' || val === '全部廠商') ? '' : val;
                    renderPurchasesList();
                }
            }
            closeWheelPicker();
        }

        function clearPurchaseSearch() {
            purchaseSearchVendorVal = '';
            currentPurchaseFilterMonth = getCurrentYearMonth();
            purchaseMonthFilterEnabled = true;
            const searchInput = document.getElementById('purchase-search-input');
            if (searchInput) searchInput.value = '';
            renderPurchasesList();
        }

        function showDeleteConfirmPurchase(id) {
            const cardEl = document.getElementById(`purchase-card-${id}`);
            const actionsEl = document.getElementById(`purchase-actions-${id}`);
            cardEl.classList.add('confirm-delete-state');
            actionsEl.innerHTML = `
                <span style="font-size: 12.5px; font-weight: 700; color: #dc2626; display: flex; align-items: center; flex: 1;">確定刪除？</span>
                <button class="card-btn" style="background: #ef4444; color: white;" onclick="deletePurchase(${id})">確定</button>
                <button class="card-btn" style="background: #e2e8f0; color: #334155;" onclick="renderPurchasesList()">取消</button>
            `;
        }

        const PURCHASE_VENDOR_STORAGE_KEY = 'malinji_purchase_custom_vendors_v1';
        const DEFAULT_PURCHASE_VENDORS = ['菜商', '源生食品行', '美味家食品企業社', '甄香食品行', '祥創企業社'];
        function escapePurchaseVendorHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        function getPurchaseVendorOptions(currentVendor = '') {
            let custom = [];
            try {
                const saved = JSON.parse(localStorage.getItem(PURCHASE_VENDOR_STORAGE_KEY) || '[]');
                if (Array.isArray(saved)) custom = saved.filter(v => typeof v === 'string' && v.trim());
            } catch (e) {}
            const existing = (globalPurchasesData || []).map(item => String(item.vendor || '').trim()).filter(Boolean);
            return [...new Set([...DEFAULT_PURCHASE_VENDORS, ...custom, ...existing, String(currentVendor || '').trim()].filter(Boolean))];
        }
        let purchaseVendorPickerPrefix = '';
        function renderPurchaseVendorField(prefix, currentVendor = '') {
            const selected = String(currentVendor || '');
            return `
                <div class="form-group">
                    <label>廠商名稱</label>
                    <input type="hidden" id="${prefix}-vendor" value="${escapePurchaseVendorHtml(selected)}">
                    <button type="button" class="order-time-btn" id="${prefix}-vendor-display" onclick="openPurchaseVendorFormPicker('${prefix}')" style="width:100%;text-align:left;justify-content:space-between;">
                        <span>${selected ? escapePurchaseVendorHtml(selected) : '請選擇廠商'}</span><span>⌄</span>
                    </button>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <input type="text" id="${prefix}-vendor-new" placeholder="有新廠商？輸入廠商名稱" style="flex:1;min-width:0;">
                        <button type="button" class="card-btn" onclick="addPurchaseVendorOption('${prefix}')" style="white-space:nowrap;">＋加入選單</button>
                    </div>
                </div>`;
        }
        function savePurchaseVendorOptions(options) {
            try { localStorage.setItem(PURCHASE_VENDOR_STORAGE_KEY, JSON.stringify(options.filter(v => !DEFAULT_PURCHASE_VENDORS.includes(v)))); } catch (e) {}
        }
        function setPurchaseVendorSelection(prefix, name) {
            const hidden = document.getElementById(`${prefix}-vendor`);
            const display = document.getElementById(`${prefix}-vendor-display`);
            if (hidden) hidden.value = name;
            if (display) display.innerHTML = `<span>${escapePurchaseVendorHtml(name || '請選擇廠商')}</span><span>⌄</span>`;
        }
        function addPurchaseVendorOption(prefix) {
            const input = document.getElementById(`${prefix}-vendor-new`);
            if (!input) return;
            const name = input.value.trim();
            if (!name) { input.focus(); return; }
            const options = getPurchaseVendorOptions();

        async function addPurchase() {
            const date = document.getElementById('pur-date').value;

            const item_name = document.getElementById('pur-item-name').value.trim();
            const quantity = parseFloat(document.getElementById('pur-qty').value) || 1;
