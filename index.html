<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬鈴吉碳烤 - 營運管理系統</title>
    <!-- 引入 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; margin-bottom: 5px; color: #2c3e50; }
        .header p { color: #7f8c8d; font-size: 14px; margin: 0; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 12px; }
        .menu-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 6px solid #e67e22;
        }
        .menu-card:active { transform: scale(0.98); }
        .menu-card h3 { margin: 0 0 4px 0; font-size: 17px; color: #2c3e50; }
        .menu-card span { font-size: 12px; color: #95a5a6; }
        .arrow { font-size: 20px; color: #bdc3c7; }

        .page-view { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: #7f8c8d; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .action-btn { background: #e67e22; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .action-btn:hover { background: #d35400; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #34495e; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #dcdde1; border-radius: 6px; font-size: 14px; }
        
        .item-card { background: #fdfbf7; border: 1px solid #fae5d3; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .item-card h4 { margin: 0 0 6px 0; color: #d35400; font-size: 16px; }
        .item-card p { margin: 3px 0; font-size: 13px; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 首頁主選單 -->
        <div id="home-view">
            <div class="header">
                <h1>🔥 馬鈴吉碳烤</h1>
                <p>營運管理與記帳系統</p>
            </div>

            <div class="menu-grid">
                <div class="menu-card" onclick="openPage('products')">
                    <div>
                        <h3>【 販售品項成本表 】</h3>
                        <span>品項名稱、單價、成本、售價、成本率、備註</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('materials')">
                    <div>
                        <h3>【 原物料與耗材價格表 】</h3>
                        <span>品項名稱, 規格, 單價, 廠商, 最後更新日期</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('purchases')">
                    <div>
                        <h3>【 每日叫貨記錄表 】</h3>
                        <span>日期, 叫貨廠商, 品項名稱, 實際到貨量, 金額</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('expenses')">
                    <div>
                        <h3>【 店內支出記錄表 】</h3>
                        <span>日期, 類別, 品項名稱, 金額, 廠商</span>
                    </div>
                    <div class="arrow">›</div>
                </div>

                <div class="menu-card" onclick="openPage('profit')">
                    <div>
                        <h3>【 每月損益表 】</h3>
                        <span>營業額、進貨總額、店內支出、本月淨利自動結算</span>
                    </div>
                    <div class="arrow">›</div>
                </div>
            </div>
        </div>

        <!-- 子頁面容器 -->
        <div id="sub-view" class="page-view">
            <div class="top-bar">
                <button class="back-btn" onclick="goHome()">← 返回主選單</button>
                <div id="top-action-container"></div>
            </div>
            <h2 id="page-title" style="margin-top:0; color:#2c3e50;"></h2>
            <div id="page-content">載入中...</div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://gyonwgjafukzlmnosykt.supabase.co';
        const supabaseKey = 'sb_publishable_T6IA7G9XaIvuGN-fOMX7Xw_FlPoi0OP';
        
        let _supabase;
        try {
            const cleanUrl = supabaseUrl.trim();
            const cleanKey = supabaseKey.trim();
            _supabase = supabase.createClient(cleanUrl, cleanKey);
        } catch (e) {
            alert('Supabase 初始化失敗，請檢查金鑰格式！');
        }

        function openPage(pageName) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            
            const titleEl = document.getElementById('page-title');
            const contentEl = document.getElementById('page-content');
            const actionContainer = document.getElementById('top-action-container');
            actionContainer.innerHTML = ''; 

            if (pageName === 'products') {
                titleEl.innerText = '販售品項成本表';
                actionContainer.innerHTML = `<button class="action-btn" onclick="renderAddProductForm()">＋ 新增品項</button>`;
                renderProductsList();
            } else {
                titleEl.innerText = '功能開發中';
                contentEl.innerHTML = '<p style="color:#7f8c8d;">此功能即將推出...</p>';
            }
        }

        function goHome() {
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }

        // 讀取品項列表（如果資料庫是空的，自動幫你寫入第一筆豆干資料！）
        async function renderProductsList() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:#7f8c8d;">讀取品項資料中...</p>';

            let { data, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                contentEl.innerHTML = '<p style="color:red;">載入失敗：' + error.message + '</p>';
                return;
            }

            // 如果資料庫目前完全沒有資料，自動幫你把第一筆「豆干」存進去！
            if (!data || data.length === 0) {
                const defaultItem = {
                    name: '豆干',
                    ingredient_cost: 4.71,
                    package_cost: 5.63,
                    price: 15,
                    note: '8吋（0.2元）'
                };

                const { error: insertError } = await _supabase.from('products').insert([defaultItem]);
                if (!insertError) {
                    const reload = await _supabase.from('products').select('*').order('id', { ascending: false });
                    data = reload.data;
                }
            }

            let html = '';
            if (data && data.length > 0) {
                data.forEach(item => {
                    let costRate = 0;
                    if (item.price > 0) {
                        costRate = ((item.package_cost / item.price) * 100).toFixed(1);
                    }

                    html += `
                        <div class="item-card">
                            <h4>🔥 ${item.name}</h4>
                            <p><b>單價：</b>$${item.ingredient_cost} 元 &nbsp;&nbsp;|&nbsp;&nbsp; <b>成本：</b>$${item.package_cost} 元</p>
                            <p><b>售價：</b>$${item.price} 元 &nbsp;&nbsp;|&nbsp;&nbsp; <b style="color: #c0392b;">成本率：${costRate}%</b></p>
                            <p><b>備註：</b>${item.note || '無'}</p>
                        </div>
                    `;
                });
            } else {
                html = '<p style="color:#7f8c8d;">目前尚無任何品項紀錄。</p>';
            }

            contentEl.innerHTML = html;
        }

        // 顯示新增表單
        function renderAddProductForm() {
            const titleEl = document.getElementById('page-title');
            const contentEl = document.getElementById('page-content');
            const actionContainer = document.getElementById('top-action-container');

            titleEl.innerText = '新增販售品項';
            actionContainer.innerHTML = `<button class="back-btn" onclick="openPage('products')">← 回列表</button>`;

            contentEl.innerHTML = `
                <div style="background: #fdfbf7; padding: 15px; border-radius: 8px; border: 1px solid #fae5d3;">
                    <div class="form-group">
                        <label>品項名稱</label>
                        <input type="text" id="prod-name" placeholder="例如: 豬血糕">
                    </div>
                    <div class="form-group">
                        <label>單價</label>
                        <input type="number" step="0.01" id="prod-unit-price" placeholder="請輸入數字">
                    </div>
                    <div class="form-group">
                        <label>總成本 (食材+包材)</label>
                        <input type="number" step="0.01" id="prod-cost" placeholder="請輸入數字">
                    </div>
                    <div class="form-group">
                        <label>售價</label>
                        <input type="number" step="0.01" id="prod-price" placeholder="請輸入數字">
                    </div>
                    <div class="form-group">
                        <label>備註</label>
                        <input type="text" id="prod-note" placeholder="例如: 備註說明">
                    </div>
                    <button class="action-btn" style="width:100%; padding:12px; margin-top:10px;" onclick="addProduct()">確認儲存品項</button>
                </div>
            `;
        }

        // 新增品項送出
        async function addProduct() {
            const name = document.getElementById('prod-name').value;
            const ingredient_cost = parseFloat(document.getElementById('prod-unit-price').value) || 0;
            const package_cost = parseFloat(document.getElementById('prod-cost').value) || 0;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const note = document.getElementById('prod-note').value;

            if (!name) {
                alert('請輸入品項名稱！');
                return;
            }

            const { error } = await _supabase
                .from('products')
                .insert([{ 
                    name: name, 
                    ingredient_cost: ingredient_cost, 
                    package_cost: package_cost, 
                    price: price, 
                    note: note 
                }]);

            if (error) {
                alert('儲存失敗：' + error.message);
            } else {
                alert('新增成功！');
                openPage('products');
            }
        }
    </script>
</body>
</html>
