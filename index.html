            while((m=multiPattern.exec(text))!==null){
                const name=m[1].replace(/^[\s　、,，；;]+|[\s　、,，；;]+$/g,'').trim();
                const quantity=Number(m[2]);
                if(name&&Number.isFinite(quantity)&&quantity>0)parsed.push({name,quantity});
            }
            if(parsed.length)return parsed;
            const name=text.replace(/^[\s　、,，；;]+|[\s　、,，；;]+$/g,'').trim();
            return name?[{name,quantity:1}]:[];
        }
        function parsePastedCustomerOrder() {
            const input=document.getElementById('order-paste-input');
            const result=document.getElementById('order-paste-match-result');
            if(!input||!result)return;

            // 先撤銷上一次由貼上文字自動加入的數量，再依目前文字重算，避免即時輸入時重複累加。
            Object.entries(orderPasteApplied).forEach(([id,quantity])=>{
                const left=Math.max(0,(Number(orderCart[id])||0)-Number(quantity||0));
                if(left>0)orderCart[id]=left;
                else {delete orderCart[id];orderSelectionOrder=orderSelectionOrder.filter(x=>x!==String(id));}
            });
            orderPasteApplied={};

            if(!input.value.trim()){
                result.style.display='none';result.innerHTML='';
                renderOrderProducts();
                return;
            }
            // 取餐時間支援「21:30取餐」及「9點取餐／9時／9取」；只寫小時時分鐘預設為00。
            // 未標示上午／下午時，1至11點視為晚上；12點維持中午，0點視為午夜。
            const timeMatches=[...input.value.matchAll(/(?:^|\n)\s*(\d{1,2})(?:(?:[:：](\d{1,2}))|(?:\s*(?:點|時)))?\s*(?:取餐|取|自取|外帶)?\s*(?=\n|$)/g)];
            if(timeMatches.length){
                const last=timeMatches[timeMatches.length-1];
                let hour=Number(last[1]); const minute=last[2]===undefined?0:Number(last[2]);
                if(hour>=0&&hour<=23&&minute>=0&&minute<=59){
                    if(hour>=1&&hour<=11)hour+=12;
                    orderSelectedTime=`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
                    const timeDisplay=document.getElementById('order-time-display');
                    if(timeDisplay)timeDisplay.innerHTML=`<span class=\"order-time-value\">${orderSelectedTime}</span><span class=\"order-time-arrow\">⌄</span>`;
                }
            }
            const lines=input.value.split(/\r?\n/).filter(line=>!/^[\s　]*\d{1,2}(?:(?:[:：]\d{1,2})|(?:\s*(?:點|時)))?\s*(?:取餐|取|自取|外帶)?\s*$/.test(line)).flatMap(parseCustomerOrderLine).filter(Boolean);
            const matched=[],unmatched=[];
            lines.forEach(line=>{
                const normalized=normalizeOrderMatchText(line.name);
                const exact=globalProductsData.filter(product=>normalizeOrderMatchText(product.name)===normalized);
                const byCheapestThenOrder=(a,b)=>(Number(a.price)||0)-(Number(b.price)||0)||globalProductsData.indexOf(a)-globalProductsData.indexOf(b);
                // 有寫容量／口味／尺寸等完整名稱時，先精準選擇對應品項。
                if(exact.length){
                    matched.push({...line,product:exact.slice().sort(byCheapestThenOrder)[0],score:1,review:false});return;
                }
                // 只寫主名稱時（例如冬瓜茶、甜不辣、豬血糕），才從同系列規格中選最低價；
                // 價格相同時依菜單原始順序選第一個。
                const containsCandidates=globalProductsData.filter(product=>normalizeOrderMatchText(product.name).includes(normalized));
                if(containsCandidates.length){
                    matched.push({...line,product:containsCandidates.slice().sort(byCheapestThenOrder)[0],score:0.99,review:false});return;
                }
                const ranked=globalProductsData.map((product,index)=>({product,score:scoreOrderName(line.name,product.name),index}))
                    .sort((a,b)=>b.score-a.score||(Number(a.product.price)||0)-(Number(b.product.price)||0)||a.index-b.index);
                const best=ranked[0];
                // 拼字略有不同時採最高相似度；相似度達標便自動選取，同分時最低價格優先。
                if(best && best.score>=0.84) matched.push({...line,product:best.product,score:best.score,review:false});
                else unmatched.push({...line,candidates:ranked.slice(0,4)});
            });
            matched.forEach(item=>{
                const id=String(item.product.id);
                if(!Number(orderCart[id]))orderSelectionOrder.push(id);
                orderCart[id]=(Number(orderCart[id])||0)+item.quantity;
                orderPasteApplied[id]=(Number(orderPasteApplied[id])||0)+item.quantity;
            });
            renderOrderProducts();
            updateOrderSummary();
            const matchHtml=matched.length?matched.map(x=>`<div style="color:#38734b;">✓「${escapeOrderHtml(x.name)}」→ ${escapeOrderHtml(x.product.name)} × ${x.quantity}</div>`).join(''):'<div style="color:#92765e;">目前沒有可直接確定的餐點。</div>';
            const unmatchedHtml=unmatched.map(x=>`<div style="color:#b45309;margin-top:4px;">？「${escapeOrderHtml(x.name)}」× ${x.quantity}：${x.candidates.length?'可能品項：'+x.candidates.map(c=>escapeOrderHtml(c.product.name)).join('、'):'找不到相符品項'}，請補完整名稱或確認菜單品名。</div>`).join('');
            result.style.display='block';
            result.innerHTML=`<div style="font-weight:800;color:#72543e;margin-bottom:4px;">即時辨識：已加入 ${matched.length} 項，待確認 ${unmatched.length} 項</div>${matchHtml}${unmatchedHtml}<div style="color:#92765e;margin-top:5px;">辨識會隨文字修改即時重算；不必輸入單位；只寫主名稱時會優先選最低價格的品項，同價則依菜單順序選取。</div>`;
        }
        function clearPastedCustomerOrder() {
            const input=document.getElementById('order-paste-input');
            if(input)input.value='';
            parsePastedCustomerOrder();
        }

        function getOrderDetails() {

            return orderSelectionOrder.map(id=>byId.get(String(id))).filter(p=>p&&Number(orderCart[p.id])>0).map(p=>{
                const quantity=Number(orderCart[p.id]),price=Number(p.price)||0;
                return {id:String(p.id),name:p.name,quantity,price,subtotal:price*quantity};
            });

                <div style="font-size:12px;color:#9a8068;">共 ${itemKinds} 樣餐點／${totalQuantity} 份</div>
                <div class="order-total"><span>總金額</span><span>$${total.toLocaleString('zh-TW')}</span></div>`;
            const baseMessage = items.length ? `${items.map(item => `${item.name} × ${item.quantity}　$${item.subtotal.toLocaleString('zh-TW')}`).join('\n')}\n\n您好，這樣金額總共是 $${total.toLocaleString('zh-TW')} 元噢\n幫您準備 ${orderSelectedTime} 取餐囉\n後續如果餐點有什麼問題都可以跟我反應，謝謝您的點餐` : '';
            const giftCount=Math.floor(total/400);
            const availableDrinks=['紅茶','冬瓜茶'].filter(name=>orderDrinkAvailability[name]!==false);
            const drinkAvailabilityText=availableDrinks.length===2?`目前飲品類選擇有${availableDrinks.join('或')}噢`:availableDrinks.length===1?`目前飲品類選擇只有${availableDrinks[0]}噢`:'目前沒有供應的飲料噢';
            const giftMessage=giftCount>0?`\n您的金額有滿400送飲料，您的金額可以選擇${giftCount}瓶飲料，${drinkAvailabilityText}`:'';
            preview.value=items.length?baseMessage+giftMessage:'';
            updateOrderDrinkButtons();
        }

                    html += `<section class="expense-date-group" data-expense-date-group style="grid-column:1/-1;margin:8px 0 18px;">

                            <strong style="font-size:16px;">📅 ${dateKey}</strong>

                            </summary><div style="padding-bottom:10px;">${itemRows}</div>
                        </details>`;
                    });
                    html += '</div></section>';
                });
            }
            html += '</div>';
            html += '<p id="expense-no-keyword-results" style="display:none; color:var(--text-muted); text-align:center; padding:30px 0;">沒有找到符合條件的支出紀錄。</p>';
            contentEl.innerHTML = html;
            applyExpenseKeywordFilter();
        }

        function changeExpenseYearMonth() {

        function setExpenseKeywordSearch(value) {
            // 與「販售品項成本表」相同：只更新卡片顯示，不重建 page-content，
            // 保留原本搜尋輸入框 DOM，避免中文注音／倉頡輸入法組字被中斷。
            expenseKeywordSearchVal = String(value ?? '');
            applyExpenseKeywordFilter();
        }

        function applyExpenseKeywordFilter() {
            const container = document.getElementById('expense-cards-container');
            if (!container) return;

            const keyword = String(expenseKeywordSearchVal ?? '').trim().toLocaleLowerCase();
            const cards = Array.from(container.querySelectorAll('.item-card[id^="expense-card-"]'));
            let visibleCount = 0;
            let visibleExpenseTotal = 0;
            let visibleIncomeTotal = 0;

            cards.forEach(card => {
                // 搜尋支出項目名稱及相關廠商；符合的細項保留在原日期／廠商卡片內。
                const name = String(card.dataset.expenseName ?? '').toLocaleLowerCase();
                const vendor = String(card.dataset.expenseVendor ?? '').toLocaleLowerCase();
                const matched = !keyword || name.includes(keyword) || vendor.includes(keyword);
                card.style.display = matched ? '' : 'none';
                if (matched) {
                    visibleCount++;
                    const amount = Number(card.dataset.expenseAmount) || 0;
                    if (card.dataset.expenseType === 'income') visibleIncomeTotal += amount;
                    else visibleExpenseTotal += amount;
                }
            });
            container.querySelectorAll('[data-expense-vendor-group]').forEach(group => {
                group.style.display = group.querySelector('.item-card:not([style*="display: none"])') ? '' : 'none';
            });
            container.querySelectorAll('[data-expense-date-group]').forEach(group => {
                group.style.display = group.querySelector('[data-expense-vendor-group]:not([style*="display: none"])') ? '' : 'none';
            });

            const noResults = document.getElementById('expense-no-keyword-results');
            if (noResults) noResults.style.display = visibleCount === 0 ? 'block' : 'none';

            const countEl = document.getElementById('expense-visible-count');
            const expenseTotalEl = document.getElementById('expense-visible-total');
            const incomeTotalEl = document.getElementById('income-visible-total');
            if (countEl) countEl.textContent = String(visibleCount);
            if (expenseTotalEl) expenseTotalEl.textContent = '$' + visibleExpenseTotal.toLocaleString() + ' 元';
            if (incomeTotalEl) incomeTotalEl.textContent = '$' + visibleIncomeTotal.toLocaleString() + ' 元';
        }

        function clearExpenseSearch() {
            expenseKeywordSearchVal = '';
            expenseSearchDepFilterVal = 'ALL';
            expenseSearchDateVal = getCurrentYearMonth();
            expenseDateFilterEnabled = true;
            expenseAmountSortVal = 'none';
            displayExpensesList();
        }

        function showDeleteConfirmExpense(id) {
            const cardEl = document.getElementById(`expense-card-${id}`);
            const actionsEl = document.getElementById(`expense-actions-${id}`);
            cardEl.classList.add('confirm-delete-state');
            actionsEl.innerHTML = `
                <span style="font-size: 12.5px; font-weight: 700; color: #dc2626; display: flex; align-items: center; flex: 1;">確定刪除？</span>
                <button class="card-btn" style="background: #ef4444; color: white;" onclick="deleteExpense(${id})">確定</button>
                <button class="card-btn" style="background: #e2e8f0; color: #334155;" onclick="displayExpensesList()">取消</button>
            `;
        }

        // 質感按鈕群組折舊年限變數
        let selectedDepYears = 5;

        // 店內支出相關廠商選單：沿用每日叫貨的滾輪選擇器操作，不改動資料庫欄位。
        const EXPENSE_VENDOR_STORAGE_KEY = 'malinji_expense_custom_vendors_v1';
        let expenseVendorPickerPrefix = '';
        function escapeExpenseVendorHtml(value) { return escapeExpenseSearchAttribute(value); }
        function getExpenseVendorOptions(currentVendor = '') {
            let custom = [];
            try {
                const saved = JSON.parse(localStorage.getItem(EXPENSE_VENDOR_STORAGE_KEY) || '[]');
                if (Array.isArray(saved)) custom = saved.filter(v => typeof v === 'string' && v.trim());
            } catch (e) {}
            const existing = (globalExpensesData || []).map(item => String(item.vendor || '').trim()).filter(Boolean);
            return [...new Set([...custom, ...existing, String(currentVendor || '').trim()].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
        }
        function saveExpenseVendorOptions(options) {
            try { localStorage.setItem(EXPENSE_VENDOR_STORAGE_KEY, JSON.stringify(options)); } catch (e) {}
        }
        function renderExpenseVendorField(prefix, currentVendor = '') {
            const selected = String(currentVendor || '');
            return `<div class="form-group"><label>相關廠商</label>
                <input type="hidden" id="${prefix}-vendor" value="${escapeExpenseVendorHtml(selected)}">
                <button type="button" class="order-time-btn" id="${prefix}-vendor-display" onclick="openExpenseVendorFormPicker('${prefix}')" style="width:100%;text-align:left;justify-content:space-between;">
                    <span>${selected ? escapeExpenseVendorHtml(selected) : '請選擇相關廠商（可留空）'}</span><span>⌄</span>
                </button>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <input type="text" id="${prefix}-vendor-new" placeholder="有新廠商？輸入名稱" style="flex:1;min-width:0;">
                    <button type="button" class="card-btn" onclick="addExpenseVendorOption('${prefix}')" style="white-space:nowrap;">＋加入選單</button>
                </div></div>`;
        }
        function setExpenseVendorSelection(prefix, name) {
            const hidden = document.getElementById(`${prefix}-vendor`);
            const display = document.getElementById(`${prefix}-vendor-display`);
            if (hidden) hidden.value = name;
            if (display) display.innerHTML = `<span>${escapeExpenseVendorHtml(name || '請選擇相關廠商（可留空）')}</span><span>⌄</span>`;
        }
        function addExpenseVendorOption(prefix) {
            const input = document.getElementById(`${prefix}-vendor-new`);
            const name = input?.value.trim() || '';
            if (!name) { input?.focus(); return; }
            const options = getExpenseVendorOptions();
            if (!options.includes(name)) options.push(name);
            saveExpenseVendorOptions(options);
            setExpenseVendorSelection(prefix, name);
            if (input) input.value = '';
        }
        function getExpenseVendorValue(prefix) {
            const input = document.getElementById(`${prefix}-vendor-new`);
            const typed = input?.value.trim() || '';
            if (typed) {
                const options = getExpenseVendorOptions();
                if (!options.includes(typed)) options.push(typed);
                saveExpenseVendorOptions(options);
                setExpenseVendorSelection(prefix, typed);
                input.value = '';
                return typed;
            }
            return document.getElementById(`${prefix}-vendor`)?.value.trim() || '';
        }
        function openExpenseVendorFormPicker(prefix) {
            expenseVendorPickerPrefix = prefix;
            const options = getExpenseVendorOptions();
            const current = document.getElementById(`${prefix}-vendor`)?.value || '';
            const selectedIndex = Math.max(0, options.indexOf(current));
            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay'; overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `<div class="picker-modal" style="width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:22px 16px;">
                <h4>🏷️ 選擇相關廠商</h4>
                <div class="picker-wheels-container" style="justify-content:center;">
                    <div class="wheel-column" id="wheel-expense-vendor" onscroll="highlightSelected('expense-vendor')" style="width:100%;max-width:100%;">
                        <div style="height:47.5px;"></div>${options.map((name,index)=>`<div class="wheel-item" data-val="${index}">${escapeExpenseVendorHtml(name)}</div>`).join('')}<div style="height:47.5px;"></div>
                    </div>
                </div><div class="picker-btn-group"><button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button><button class="picker-btn picker-confirm" onclick="confirmExpenseVendorPicker()">確定選取</button></div></div>`;
            document.body.appendChild(overlay);
            requestAnimationFrame(() => {
                const col = document.getElementById('wheel-expense-vendor');
                const item = col?.querySelectorAll('.wheel-item')[selectedIndex];
                if (col && item) { col.scrollTop = item.offsetTop - col.clientHeight / 2 + item.clientHeight / 2; highlightSelected('expense-vendor'); }
            });
        }
        function confirmExpenseVendorPicker() {
            const index = Number(getSelectedValue('expense-vendor'));
            const options = getExpenseVendorOptions();
            if (options[index]) setExpenseVendorSelection(expenseVendorPickerPrefix, options[index]);
            closeWheelPicker();
        }

            const todayStr = new Date().toISOString().split('T')[0];

            contentEl.innerHTML = `

                    <div class="form-group"><label>數量</label><input type="number" step="1" id="exp-qty" value="1" placeholder="請輸入數量"></div>
                    <div class="form-group"><label>金額 (總金額)</label><input type="number" step="0.01" id="exp-amount" placeholder="請輸入總金額"></div>
                    ${renderExpenseVendorField('exp')}

                    <!-- 超質感點擊式折舊開關卡片 -->
                    <div class="form-group" id="add-depreciation-group">
                        <label>折舊攤提設定</label>
                        <div id="dep-toggle-card" class="depreciation-toggle-card" onclick="toggleDepreciationCard()">
                            <div class="custom-checkbox-circle"></div>
                            <div>
                                <div style="font-weight: 700; color: #9a3412; font-size: 14.5px;">此為生財器具/設備，需要進行折舊攤提</div>
                                <div style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">勾選後系統將自動依年限計算每月資產耗損與殘值</div>
                            </div>
                        </div>
                    </div>

                    <div id="depreciation-options-box" style="display: none; background: #fffbeb; padding: 14px; border-radius: 10px; border: 1px solid #fde68a; margin-bottom: 18px;">

                            <span id="selected-dep-label-badge" class="selected-dep-badge">⭐ 目前選擇：5 年</span>
                        </div>

                            <div class="dep-year-btn" data-years="3" onclick="selectDepYears(3)">3 年</div>
                            <div class="dep-year-btn active" data-years="5" onclick="selectDepYears(5)">5 年 (推薦)</div>
                            <div class="dep-year-btn" data-years="8" onclick="selectDepYears(8)">8 年</div>
                            <div class="dep-year-btn" data-years="10" onclick="selectDepYears(10)">10 年</div>
                        </div>

                    <button id="submit-exp-btn" class="action-btn" style="width:100%; padding:13px; margin-top:8px; font-size:16px; border-radius:10px;" onclick="addExpense()">確認儲存支出</button>
                </div>
            `;
        }

        function toggleExpenseTypeFields(isEdit) {
            const type = document.getElementById(isEdit ? 'edit-exp-type' : 'exp-type')?.value || 'expense';
            const group = document.getElementById(isEdit ? 'edit-depreciation-group' : 'add-depreciation-group');
            if (group) group.style.display = type === 'income' ? 'none' : 'block';
            const card = document.getElementById(isEdit ? 'edit-dep-toggle-card' : 'dep-toggle-card');
            if (type === 'income' && card) { card.classList.remove('active'); const box = document.getElementById(isEdit ? 'edit-depreciation-options-box' : 'depreciation-options-box'); if (box) box.style.display = 'none'; }
        }

        function toggleDepreciationCard() {
            const card = document.getElementById('dep-toggle-card');
            card.classList.toggle('active');
            const isDep = card.classList.contains('active');
            const box = document.getElementById('depreciation-options-box');
            box.style.display = isDep ? 'block' : 'none';
        }

        function selectDepYears(years) {
            selectedDepYears = years;
            document.querySelectorAll('.dep-year-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-years')) === years) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            const badge = document.getElementById('selected-dep-label-badge');
            if (badge) {
                let recDesc = years === 5 ? ' (推薦)' : '';
                badge.innerText = `⭐ 目前選擇：${years} 年${recDesc}`;
            }
        }

        function setAddExpenseDate(dateStr) { document.getElementById('exp-date').value = dateStr; }

        async function addExpense() {
            const date = document.getElementById('exp-date').value;
            const name = document.getElementById('exp-name').value.trim();
            const quantity = parseFloat(document.getElementById('exp-qty').value) || 1;
            const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
            const vendor = getExpenseVendorValue('exp');
            const transaction_type = document.getElementById('exp-type').value;
            const is_depreciable = transaction_type === 'expense' && document.getElementById('dep-toggle-card').classList.contains('active');
            const useful_life_years = is_depreciable ? selectedDepYears : 0;

            const toast = document.getElementById('form-toast');
            const submitBtn = document.getElementById('submit-exp-btn');

            if (!date || !name || amount <= 0) { toast.className = 'toast-msg toast-error'; toast.innerText = '⚠️ 請填寫完整日期、項目名稱與有效金額！'; toast.style.display = 'block'; return; }

            submitBtn.disabled = true; submitBtn.innerText = '儲存中...';
            const { error } = await _supabase.from('expenses').insert([{ date, name, quantity, amount, vendor, transaction_type, is_depreciable, useful_life_years }]);
            if (error) { toast.className = 'toast-msg toast-error'; toast.innerText = '❌ 儲存失敗：' + error.message; toast.style.display = 'block'; submitBtn.disabled = false; submitBtn.innerText = '確認儲存紀錄'; }
            else { toast.className = 'toast-msg toast-success'; toast.innerText = '✅ 新增成功！正在返回列表...'; toast.style.display = 'block'; setTimeout(() => openPage('expenses'), 1000); }
        }

        function renderEditExpenseForm(id) {
            const item = globalExpensesData.find(e => e.id === id);
            if (!item) return;
            const titleEl = document.getElementById('page-title');
            const contentEl = document.getElementById('page-content');
            const actionContainer = document.getElementById('top-action-container');
            titleEl.innerText = '修改支出紀錄';
            actionContainer.innerHTML = `<button class="back-btn" onclick="openPage('expenses')">← 回列表</button>`;

            const isIncome = item.transaction_type === 'income';
            const isDep = !isIncome && (item.is_depreciable || false);
            selectedDepYears = item.useful_life_years || 5;

            contentEl.innerHTML = `
                <div class="form-card-container">

                    <div id="edit-depreciation-options-box" style="display: ${isDep ? 'block' : 'none'}; background: #fffbeb; padding: 14px; border-radius: 10px; border: 1px solid #fde68a; margin-bottom: 18px;">

        async function updateExpense(id) {
            const date = document.getElementById('edit-exp-date').value;
            const name = document.getElementById('edit-exp-name').value.trim();
            const quantity = parseFloat(document.getElementById('edit-exp-qty').value) || 1;

        async function deleteExpense(id) {
            const { error } = await _supabase.from('expenses').delete().eq('id', id);
            if (error) alert('刪除失敗：' + error.message);

        }


        // 依店內支出項目名稱分開歸類；無法辨識的支出仍計入店內支出總額。
        function classifyOperatingExpenseName(name) {
            const n = String(name || '').replace(/\s/g, '').toLowerCase();
            if (/房租|租金/.test(n)) return 'rent';
            if (/電費|電費帳單|台電|水電電/.test(n)) return 'electricity';
            if (/正職.*(薪|工資)|正職薪資|正職薪水/.test(n)) return 'fulltime';
            if (/工讀.*(薪|工資)|工讀薪資|工讀薪水|兼職.*(薪|工資)/.test(n)) return 'parttime';
            if (/營業稅/.test(n)) return 'businessTax';
            if (/保險費/.test(n)) return 'insurance';
            if (/員工勞保|勞保|員工健保|健保/.test(n)) return 'employeeLaborHealth';
            if (/網路費|網路/.test(n)) return 'internet';
            return 'other';
        }

        // 分類費用仍使用 expenses.name/amount/date 的既有紀錄；
        // 本函式只做顯示分類，總支出仍由既有支出加總一次，避免重複扣款。
        const TRACKED_EXPENSE_TYPES = [
            ['businessTax', '營業稅'],
            ['insurance', '保險費（年繳／月攤）'],
            ['employeeLaborHealth', '員工勞健保'],
            ['internet', '網路費']
        ];
        function sumNamedExpenseType(items, type) {
            return (items || []).filter(item =>
                (item.transaction_type || 'expense') === 'expense' &&
                item.is_depreciable !== true &&
                !isDepositOrPrepaymentExpense(item.name) &&
                classifyOperatingExpenseName(item.name) === type
            ).reduce((total, item) => total + (Number(item.amount) || 0), 0);
        }

        // 保險費輸入的是全年金額：依支出日期所在年度，平均攤入該年度 12 個月份。
        // 這是損益的月攤提；實際現金流仍在原付款月份扣除全年付款金額。
        function getAnnualInsuranceMonthlyAllocation(items, yearMonth) {
            const year = String(yearMonth || '').slice(0, 4);
            if (!/^\d{4}$/.test(year)) return 0;
            const annualAmount = (items || []).filter(item =>
                (item.transaction_type || 'expense') === 'expense' &&
                item.is_depreciable !== true &&
                !isDepositOrPrepaymentExpense(item.name) &&
                classifyOperatingExpenseName(item.name) === 'insurance' &&
                String(item.date || '').slice(0, 4) === year
            ).reduce((total, item) => total + (Number(item.amount) || 0), 0);
            return annualAmount / 12;
        }

        function getInsurancePaidInMonth(items, yearMonth) {
            return sumNamedExpenseType(
                (items || []).filter(item => String(item.date || '').startsWith(yearMonth)),
                'insurance'
            );
        }

        // 押金／訂金屬資金占用或預付款：付款時納入現金流，不直接當作當月營運費用。
        function isDepositOrPrepaymentExpense(name) {
            return /押金|訂金/.test(String(name || '').replace(/\s/g, ''));
        }

        // ==================== 每月損益總表與營運回本試算邏輯 ====================
        let currentProfitMonth = getCurrentYearMonth();

        const DEFAULT_MONTH_SETTINGS = {
            workingDays: 26,
            gas: 0,
            oil: 0,
            charcoal: 0,
            ubereatsAdDaily: 0,
            foodpandaAdMonthly: 0,
            initialCapital: 2000000
        };


        // UberEats 行銷費用與 foodpanda 一樣以每月金額設定。
        // 相容舊資料：若舊月份只有每日金額，依該月份原本設定的營業天數換算，
        // 保留原本的每月總金額，不會因這次介面調整而改變歷史損益。
        function getMonthlyAdCosts(settings) {
            const s = settings || {};
            const days = Math.max(0, Number(s.workingDays ?? 26) || 0);
            const ubereatsMonthly = s.ubereatsAdMonthly !== undefined
                ? (Number(s.ubereatsAdMonthly) || 0)
                : (Number(s.ubereatsAdDaily) || 0) * days;
            return {
                ubereats: Math.max(0, ubereatsMonthly),
                foodpanda: Math.max(0, Number(s.foodpandaAdMonthly) || 0),
                workingDays: days
            };
        }

        // 單一月度帳務計算核心：損益儀表板與創業資本明細必須共用此結果。
        // workingDays 統一採該月實際有營收紀錄的日期數；舊版每日廣告設定也依此換算。
        function calculateMonthlyMetrics(yearMonth, data) {
            const d = data || {};
            const products = d.products || [];
            const expenses = d.expenses || [];
            const revenues = d.revenues || [];
            const settings = d.settings || {};
            const platformRates = d.platformRates || { ubereatsCommissionRate: 0, foodpandaCommissionRate: 0 };
            const monthRevenues = revenues.filter(r => String(r.date || '').startsWith(yearMonth));
            const recordedBusinessDays = new Set(monthRevenues
                .map(r => String(r.date || '').slice(0, 10))
                .filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date))).size;
            const hasSettings = settings.fixedCostsConfigured !== false;
            const monthAds = hasSettings
                ? getMonthlyAdCosts({ ...settings, workingDays: recordedBusinessDays })
                : { ubereats: 0, foodpanda: 0, workingDays: recordedBusinessDays };
            const gas = hasSettings ? (Number(settings.gas) || 0) : 0;
            const oil = hasSettings ? (Number(settings.oil) || 0) : 0;
            const charcoal = hasSettings ? (Number(settings.charcoal) || 0) : 0;
            const fixedCost = gas + oil + charcoal + monthAds.ubereats + monthAds.foodpanda;
            const cashFixedCost = monthAds.ubereats + monthAds.foodpanda;

            const monthExpenseRows = expenses.filter(e => String(e.date || '').startsWith(yearMonth));
            const monthExpenses = monthExpenseRows.filter(e =>
                (e.transaction_type || 'expense') === 'expense' && e.is_depreciable !== true && !isDepositOrPrepaymentExpense(e.name));
            const monthDepreciableExpenses = monthExpenseRows.filter(e =>
                (e.transaction_type || 'expense') === 'expense' && e.is_depreciable === true);
            const monthExtraIncome = monthExpenseRows.filter(e => e.transaction_type === 'income');
            const sum = (items, getter) => items.reduce((total, item) => total + (Number(getter(item)) || 0), 0);
            const insurancePaidThisMonth = sumNamedExpenseType(monthExpenses, 'insurance');
            const insuranceAllocation = getAnnualInsuranceMonthlyAllocation(expenses, yearMonth);
            const totalOtherExpenses = sum(monthExpenses, e => e.amount) - insurancePaidThisMonth + insuranceAllocation;
            const trackedExpenseTotals = Object.fromEntries(TRACKED_EXPENSE_TYPES.map(([type]) => [type,
                type === 'insurance' ? insuranceAllocation : sumNamedExpenseType(monthExpenses, type)]));

            const averageCostRate = products.length
                ? products.reduce((total, item) => total + calculateCostRate(item), 0) / products.length
                : 0;
            const ingredientCostRate = Math.max(0, Number(averageCostRate) || 0) / 100;
            const totalGrossSales = sum(monthRevenues, r =>
                (Number(r.onsite) || 0) + (Number(r.ubereats) || 0) + (Number(r.foodpanda) || 0));
            const ueGrossSales = sum(monthRevenues, r => r.ubereats);
            const fpGrossSales = sum(monthRevenues, r => r.foodpanda);
            const ueRate = (Number(platformRates.ubereatsCommissionRate) || 0) / 100;
            const fpRate = (Number(platformRates.foodpandaCommissionRate) || 0) / 100;
            const ueCommission = ueGrossSales * ueRate;
            const fpCommission = fpGrossSales * fpRate;
            const totalPlatformCommission = ueCommission + fpCommission;
            const weightedPlatformCommissionRate = totalGrossSales > 0 ? totalPlatformCommission / totalGrossSales : 0;

            // 折舊依設備購買月份及耐用年限逐月提列；設備本金仍只進現金流。
            const targetMonthNumber = Number(yearMonth.slice(0, 4)) * 12 + Number(yearMonth.slice(5, 7)) - 1;
            let totalDepreciation = 0;
            expenses.filter(e => (e.transaction_type || 'expense') === 'expense' && e.is_depreciable === true).forEach(item => {
                const dateMonth = String(item.date || '').slice(0, 7);
                if (!/^\d{4}-\d{2}$/.test(dateMonth)) return;
                const startMonthNumber = Number(dateMonth.slice(0, 4)) * 12 + Number(dateMonth.slice(5, 7)) - 1;
                const lifeMonths = Math.max(1, Number(item.useful_life_years) || 5) * 12;
                const elapsed = targetMonthNumber - startMonthNumber;
                if (elapsed >= 0 && elapsed < lifeMonths) totalDepreciation += (Number(item.amount) || 0) / lifeMonths;
            });
            const totalExtraIncome = sum(monthExtraIncome, e => e.amount);
            const estimatedIngredientCost = totalGrossSales * ingredientCostRate;
            const operatingProfitEstimate = totalGrossSales - estimatedIngredientCost - totalPlatformCommission
                - fixedCost - totalOtherExpenses + totalExtraIncome - totalDepreciation;
            const monthlyFixedTotalCost = fixedCost + totalOtherExpenses;
            const contributionMarginRate = 1 - ingredientCostRate - weightedPlatformCommissionRate;
            const monthlyBreakEvenRevenue = contributionMarginRate > 0
                ? (monthlyFixedTotalCost + totalDepreciation - totalExtraIncome) / contributionMarginRate
                : Infinity;
            return {
                yearMonth, settings, hasSettings, monthRevenues, recordedBusinessDays, monthAds,
                totalUbereatsAd: monthAds.ubereats, totalFoodpandaAd: monthAds.foodpanda,
                gas, oil, charcoal, fixedCost, cashFixedCost,
                monthExpenseRows, monthExpenses, monthDepreciableExpenses, monthExtraIncome,
                trackedExpenseTotals, totalOtherExpenses, averageCostRate, ingredientCostRate,
                totalGrossSales, ueGrossSales, fpGrossSales, ueCommission, fpCommission,
                totalPlatformCommission, weightedPlatformCommissionRate, totalDepreciation,
                totalExtraIncome, estimatedIngredientCost, operatingProfitEstimate,
                monthlyFixedTotalCost, contributionMarginRate, monthlyBreakEvenRevenue,
                revenueGap: totalGrossSales - monthlyBreakEvenRevenue
            };
        }

        // 只讀取該月份真正保存的設定；歷史月份缺資料時絕不套用最新月份。
        async function getMonthSettings(monthStr) {
            const { data, error } = await _supabase
                .from('settings')
                .select('*')
                .eq('month', monthStr)
                .maybeSingle();

            if (error) {
                console.error('讀取月份設定失敗：', monthStr, error);
                return null;
            }
            return data && data.settings_json ? data.settings_json : null;
        }

        // 表單使用的預設值；這只方便新增/編輯，不代表歷史月份真的有這些成本。
        async function getMonthSettingsForEditing(monthStr) {
            const saved = await getMonthSettings(monthStr);
            return { ...DEFAULT_MONTH_SETTINGS, ...(saved || {}) };
        }

        // 初始投入本金是全店層級的參數，跨月份沿用最近一次明確保存的本金值；
        // 這不會把最新月份的房租、人事等固定成本回填到歷史月份。
        const CAPITAL_PARTNERS = ['許曜麟', '許仁駿', '黃祈瀚'];
        async function getGlobalCapitalSettings() {
            const { data, error } = await _supabase
                .from('settings')
                .select('month,settings_json')
                .order('month', { ascending: false })
                .limit(1000);
            if (error) {
                console.error('讀取創業投入資本失敗：', error);
                return { legacyCapital: 2000000, contributions: null, month: null };
            }
            // 優先讀取曾明確保存的三人分配資料，避免其他月份的舊版 initialCapital 預設值蓋過合夥人設定。
            const contributionRow = (data || []).find(row => row.settings_json && row.settings_json.capitalContributions && typeof row.settings_json.capitalContributions === 'object');
            const savedRow = contributionRow || (data || []).find(row => row.settings_json && Object.prototype.hasOwnProperty.call(row.settings_json, 'initialCapital'));
            if (!savedRow) return { legacyCapital: 2000000, contributions: null, month: null };
            const json = savedRow.settings_json || {};
            const contributions = json.capitalContributions && typeof json.capitalContributions === 'object'
                ? Object.fromEntries(CAPITAL_PARTNERS.map(name => [name, Math.max(0, Number(json.capitalContributions[name]) || 0)]))
                : null;
            return { legacyCapital: Math.max(0, Number(json.initialCapital) || 0), contributions, month: savedRow.month || null };
        }
        async function getGlobalCapitalContributions() {
            const data = await getGlobalCapitalSettings();
            return data.contributions || Object.fromEntries(CAPITAL_PARTNERS.map(name => [name, 0]));
        }
        async function getGlobalInitialCapital() {
            const data = await getGlobalCapitalSettings();
            if (data.contributions) return CAPITAL_PARTNERS.reduce((sum, name) => sum + (Number(data.contributions[name]) || 0), 0);
            return data.legacyCapital || 2000000;
        }

        async function renderProfitView() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 30px 0;">計算損益與回本目標中...</p>';

            let [productsRes, expensesRes, revenuesRes] = await Promise.all([
                _supabase.from('products').select('*'),
                _supabase.from('expenses').select('*'),
                _supabase.from('revenues').select('*')
            ]);

            const products = productsRes.data || [];
            const expenses = expensesRes.data || [];
            globalRevenuesData = revenuesRes.data || [];
            const platformRates = await getPlatformRatesForMonth(currentProfitMonth);
            const ueRate = platformRates.ubereatsCommissionRate / 100;
            const fpRate = platformRates.foodpandaCommissionRate / 100;

            let fixedSettings = await getMonthSettingsForEditing(currentProfitMonth);
            const monthMetrics = calculateMonthlyMetrics(currentProfitMonth, {
                products, expenses, revenues: globalRevenuesData, settings: fixedSettings, platformRates
            });
            const {
                hasSettings: hasMonthlySettings, monthRevenues, recordedBusinessDays,
                totalUbereatsAd, totalFoodpandaAd, fixedCost: totalFixedCost,
                monthExpenses, monthDepreciableExpenses, monthExtraIncome, trackedExpenseTotals,
                totalOtherExpenses, averageCostRate, totalDepreciation, totalExtraIncome,
                ueGrossSales, fpGrossSales, ueCommission, fpCommission,
                totalPlatformCommission, totalGrossSales, monthlyFixedTotalCost,
                estimatedIngredientCost, weightedPlatformCommissionRate,
                contributionMarginRate, monthlyBreakEvenRevenue, ingredientCostRate, operatingProfitEstimate
            } = monthMetrics;
            // 舊畫面欄位沿用此名稱；統一指向共用計算核心的月固定／營運費用總額。
            const monthlySettingsAndStoreExpenseTotal = monthlyFixedTotalCost;
            const expenseByType = type => monthExpenses.filter(i => classifyOperatingExpenseName(i.name) === type)
                .reduce((total, item) => total + (Number(item.amount) || 0), 0);
            let rentExpense = expenseByType('rent');
            let electricityExpense = expenseByType('electricity');
            let fulltimeSalaryExpense = expenseByType('fulltime');
            let parttimeSalaryExpense = expenseByType('parttime');
            const workingDays = Math.max(1, recordedBusinessDays);
            let dailyBreakEvenRevenue = monthlyBreakEvenRevenue / workingDays;
            const dailyFixedCostAllocation = (monthlyFixedTotalCost + totalDepreciation - totalExtraIncome) / workingDays;



            let profitDaysCount = 0;
            let lossDaysCount = 0;

            let dayOfWeekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            let weekdayTotals = { 0: {sum:0, count:0}, 1: {sum:0, count:0}, 2: {sum:0, count:0}, 3: {sum:0, count:0}, 4: {sum:0, count:0}, 5: {sum:0, count:0}, 6: {sum:0, count:0} };

            let totalActualRevenue = monthRevenues.reduce((acc, i) => {
                let onsite = parseFloat(i.onsite) || 0;
                let ubereatsGross = parseFloat(i.ubereats) || 0;
                let foodpandaGross = parseFloat(i.foodpanda) || 0;
                let dayTotal = onsite + ubereatsGross * (1 - ueRate) + foodpandaGross * (1 - fpRate);
                let dayGrossTotal = onsite + ubereatsGross + foodpandaGross;

                const dayPlatformCommission = ubereatsGross * ueRate + foodpandaGross * fpRate;
                const dayEstimatedIngredientCost = dayGrossTotal * ingredientCostRate;
                const dayOperatingProfitEstimate = dayGrossTotal - dayPlatformCommission - dayEstimatedIngredientCost - dailyFixedCostAllocation;
                if (dayOperatingProfitEstimate >= 0) profitDaysCount++;
                else lossDaysCount++;

                if (i.date) {
                    let dObj = new Date(i.date);
                    if (!isNaN(dObj.getDay())) {
                        let wDay = dObj.getDay();
                        if (wDay !== 3) { // 星期三不納入星期平均洞察
                            weekdayTotals[wDay].sum += dayGrossTotal;
                            weekdayTotals[wDay].count += 1;
                        }
                    }
                }

                return acc + dayTotal;
            }, 0);

            let bestDay = '尚無資料';
            let worstDay = '尚無資料';
            let maxAvg = -1;
            let minAvg = Infinity;

            for (let w = 0; w < 7; w++) {
                if (weekdayTotals[w].count > 0) {
                    let avg = weekdayTotals[w].sum / weekdayTotals[w].count;
                    if (avg > maxAvg) {
                        maxAvg = avg;
                        bestDay = `${dayOfWeekNames[w]} (平均 $${Math.round(avg).toLocaleString()})`;
                    }
                    if (avg < minAvg) {
                        minAvg = avg;
                        worstDay = `${dayOfWeekNames[w]} (平均 $${Math.round(avg).toLocaleString()})`;
                    }
                }
            }

            // 預估食材成本依月營業額及目前商品平均成本率估算；已付款叫貨僅影響現金流，不列入營運損益。
            let netProfit = operatingProfitEstimate;
            let revenueGap = totalGrossSales - monthlyBreakEvenRevenue;

        // ==================== 💎 全店創業資本與回本追蹤專屬頁面邏輯 ====================
        async function renderCapitalView() {
            const contentEl = document.getElementById('page-content');
            contentEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:30px 0;">正在核對全店營運損益、已付款叫貨與現金流...</p>';

            const [productsRes, revenuesRes, expensesRes, purchasesRes, settingsRes] = await Promise.all([
                _supabase.from('products').select('*'),
                _supabase.from('revenues').select('*'),
                _supabase.from('expenses').select('*'),
                _supabase.from('purchases').select('*'),
                _supabase.from('settings').select('month,settings_json')
            ]);

            const failed = [productsRes, revenuesRes, expensesRes, purchasesRes, settingsRes].find(r => r.error);
            if (failed) {
                contentEl.innerHTML = `<p style="color:#dc2626;padding:20px;">讀取回本追蹤資料失敗：${failed.error.message}</p>`;
                return;
            }

            const products = productsRes.data || [];
            const revenues = revenuesRes.data || [];
            const expenses = expensesRes.data || [];
            const purchases = purchasesRes.data || [];
            const settingsRows = settingsRes.data || [];
            const settingsByMonth = {};
            settingsRows.forEach(row => {
                if (row.month && row.settings_json) settingsByMonth[String(row.month)] = row.settings_json;
            });

            const currentMonthKey = getCurrentYearMonth();
            // 各月份在下方迴圈中分別讀取自己的平台抽成設定，歷史月份不套用最新月份比例。
            // 與「每月損益總表與回本試算」相同：使用目前商品平均成本率計算各月回本營業額目標。
            const capitalSettingsData = await getGlobalCapitalSettings();
            const capitalContributions = capitalSettingsData.contributions || Object.fromEntries(CAPITAL_PARTNERS.map(name => [name, 0]));
            const capitalContributionTotal = CAPITAL_PARTNERS.reduce((sum, name) => sum + (Number(capitalContributions[name]) || 0), 0);
            const legacyUnallocatedCapital = capitalSettingsData.contributions ? 0 : Math.max(0, Number(capitalSettingsData.legacyCapital) || 0);
            const initialCapital = capitalSettingsData.contributions ? capitalContributionTotal : (legacyUnallocatedCapital || 2000000);

            const monthNumber = ym => {
                const match = /^(\d{4})-(\d{2})$/.exec(String(ym || ''));
                return match ? Number(match[1]) * 12 + Number(match[2]) - 1 : null;
            };
            const validMonth = value => /^\d{4}-\d{2}$/.test(String(value || '').substring(0, 7))
                ? String(value).substring(0, 7) : '';

            // 以最早一筆營收／支出／叫貨／月份設定為起點，連續計算到本月。
            // 不可只列有資料的月份，否則設備折舊會漏掉中間沒有營收或支出紀錄的月份。
            const recordedMonths = [
                ...revenues.map(x => validMonth(x.date)),
                ...expenses.map(x => validMonth(x.date)),
                ...purchases.map(x => validMonth(x.date)),
                ...settingsRows.map(r => validMonth(r.month))
            ].filter(Boolean).filter(ym => ym <= currentMonthKey).sort();
            const monthKeys = [];
            if (recordedMonths.length) {
                const firstMonthNumber = monthNumber(recordedMonths[0]);
                const lastMonthNumber = monthNumber(currentMonthKey);
                for (let n = firstMonthNumber; n <= lastMonthNumber; n++) {
                    const year = Math.floor(n / 12);
                    const month = (n % 12) + 1;
                    monthKeys.push(`${year}-${String(month).padStart(2, '0')}`);
                }
            }

            // 營運損益沿用每月損益總表公式；叫貨付款只列入現金流，不直接當成當月商品成本。

            const sum = (items, getter) => items.reduce((total, item) => total + (Number(getter(item)) || 0), 0);
            const monthRows = [];
            let cumulativeOperatingProfit = 0;
            let cumulativeCashMovement = 0;
            let cumulativePurchases = 0;
            let cumulativeDepreciation = 0;
            let cumulativeOrdinaryExpenses = 0;
            let cumulativeRecordedCashExpenses = 0;
            let cumulativeDepositsAndPrepayments = 0;
            let cumulativeMonthlySettingsCosts = 0;
            let totalEquipmentCost = 0;
            let totalEquipmentBookValue = 0;

            const depreciableItems = expenses.filter(e =>
                (e.transaction_type || 'expense') === 'expense' &&
                e.is_depreciable === true &&
                (Number(e.amount) || 0) > 0
            );

            // 設備本金總額用於帳面價值；每月折舊只由 calculateMonthlyMetrics() 計算。
            depreciableItems.forEach(item => {
                const purchaseMonth = validMonth(item.date) || currentMonthKey;
                if (purchaseMonth <= currentMonthKey) totalEquipmentCost += Number(item.amount) || 0;
            });

            for (const ym of monthKeys) {
                const monthRevenues = revenues.filter(x => validMonth(x.date) === ym);
                const monthExpenses = expenses.filter(x => validMonth(x.date) === ym);
                const monthPurchases = purchases.filter(x => validMonth(x.date) === ym);
                const settings = settingsByMonth[ym] || null;
                const monthPlatformRates = platformRatesFromRows(settingsRows, ym);
                const monthMetrics = calculateMonthlyMetrics(ym, {
                    products, expenses, revenues, settings: settings || {},
                    platformRates: monthPlatformRates
                });
                const {
                    hasSettings, monthAds, fixedCost, cashFixedCost,
                    totalGrossSales: grossRevenue, ueCommission: ubereatsCommission,
                    fpCommission: foodpandaCommission, totalPlatformCommission: platformCommission,
                    monthExpenses: monthOperatingExpenses, trackedExpenseTotals, totalExtraIncome: extraIncome,
                    totalDepreciation: depreciation, estimatedIngredientCost,
                    operatingProfitEstimate, monthlyBreakEvenRevenue, revenueGap,
                    totalOtherExpenses
                } = monthMetrics;
                const monthExpensesRawForCash = monthMetrics.monthExpenseRows;
                const netRevenue = grossRevenue - platformCommission;
                const purchasePaid = sum(monthPurchases, p => p.total_price);
                const ordinaryExpenses = sum(monthOperatingExpenses, e => e.amount);
                const depositsAndPrepayments = sum(monthExpensesRawForCash.filter(e =>
                    (e.transaction_type || 'expense') === 'expense' && isDepositOrPrepaymentExpense(e.name)), e => e.amount);
                const allCashExpenses = sum(monthExpensesRawForCash.filter(e => (e.transaction_type || 'expense') === 'expense'), e => e.amount);
                const profitBasisExpenses = totalOtherExpenses;
                const cashMovement = grossRevenue - platformCommission - purchasePaid - allCashExpenses + extraIncome - cashFixedCost;

                cumulativeOperatingProfit += operatingProfitEstimate;
                cumulativeCashMovement += cashMovement;
                cumulativePurchases += purchasePaid;
                cumulativeDepreciation += depreciation;
                cumulativeOrdinaryExpenses += ordinaryExpenses;
                cumulativeRecordedCashExpenses += allCashExpenses;
                cumulativeDepositsAndPrepayments += depositsAndPrepayments;
                cumulativeMonthlySettingsCosts += fixedCost;

                monthRows.push({
                    month: ym, netRevenue, grossRevenue, ubereatsCommission, foodpandaCommission, platformCommission,
                    purchasePaid, fixedCost, cashFixedCost, ordinaryExpenses, extraIncome, depreciation, estimatedIngredientCost,
                    trackedExpenseTotals, operatingProfitEstimate, cashMovement, hasSettings,
                    monthlyBreakEvenRevenue, revenueGap, allCashExpenses, depositsAndPrepayments,
                    ubereatsCommission, foodpandaCommission, profitBasisExpenses, totalOtherExpenses
                });
            }

            totalEquipmentBookValue = Math.max(0, totalEquipmentCost - cumulativeDepreciation);
            // 本金回收缺口以「初始投入資本－目前推算實際現金餘額」計算。
            // 現金餘額 = 初始投入資本 + 歷史累積現金流變動；
            // 設備、裝潢、叫貨及店內支出已反映在累積現金流，不可再加一次。

            const remainingToRecover = Math.max(0, initialCapital - currentCashBalance);
            const recoveredCapital = Math.max(0, initialCapital - remainingToRecover);
            const recoveryProgress = initialCapital > 0
                ? Math.max(0, Math.min(100, recoveredCapital / initialCapital * 100)) : 0;
            const returnRate = initialCapital > 0
                ? (initialCapital - remainingToRecover) / initialCapital * 100 : 0;

                            </div>
                        </div>
                        <details style="margin-top:12px;border-top:1px solid #f1e5d8;padding-top:10px;">

                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>月回本營業額目標</span><b>${Number.isFinite(row.monthlyBreakEvenRevenue) ? moneyPlain(row.monthlyBreakEvenRevenue) : '目前成本率下無法達成'}</b></div>
                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>預估食材成本（營運損益使用）</span><b>${moneyPlain(row.estimatedIngredientCost)}</b></div>
                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>已付款商品叫貨</span><b>${moneyPlain(row.purchasePaid)}</b></div>
                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>店內實際支出（含設備、押金等）</span><b>${moneyPlain(row.allCashExpenses)}</b></div>
                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>保險費每月攤提（營運損益使用）</span><b>${moneyPlain(row.trackedExpenseTotals.insurance || 0)}</b></div>

                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>額外收入</span><b>${moneyPlain(row.extraIncome)}</b></div>
                                <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;"><span>平台抽成</span><b>${moneyPlain(row.platformCommission)}</b></div>

                                </div>

            }).join('');

            contentEl.innerHTML = `

                    <div class="profit-row"><span>目前推算實際現金餘額（初始資本＋累積現金流變動）</span><b>${money(currentCashBalance)}</b></div>
                    <div class="profit-row"><span>本金回收進度（依目前實際現金餘額）</span><b>${recoveryProgress.toFixed(1)}%</b></div>
                    <div style="height:12px;background:#fed7aa;border-radius:99px;overflow:hidden;margin:8px 0 14px;"><div style="height:100%;width:${recoveryProgress}%;background:#ea580c;"></div></div>
                    <div class="profit-row"><span>${remainingToRecover > 0 ? '距離初始投入本金尚差' : '目前現金餘額已達初始本金'}</span><b>${money(remainingToRecover > 0 ? remainingToRecover : excessCashAfterRecovery)}</b></div>

                    ${monthlyRowsHtml || '<p style="padding:16px;text-align:center;color:#78716c;">尚無資料</p>'}
                </div>

                <div class="profit-card" style="background:#fffbeb;border-color:#fde68a;">
                    <details>
                        <summary style="cursor:pointer;font-weight:800;color:#92400e;font-size:16px;">❓ 數字怎麼計算？（點開查看說明）</summary>
                        <div style="font-size:13px;line-height:1.75;color:#57534e;padding-top:12px;">
                            <p><b>① 月總營業額</b><br>現場營業額＋Uber Eats 營業額＋foodpanda 營業額，這是平台抽成前的營業額。</p>
                            <p><b>② 距離月回本目標</b><br>本月總營業額－月回本營業額目標。負數代表還差多少營業額；正數代表已超過多少。</p>

                            <p><b>⑤ 為什麼營運損益和現金流不同？</b><br>商品叫貨付款、設備購買、押金及預付款會影響實際現金流，但不一定全部是當月營運費用。設備購買本金不會一次全部扣進營運損益，而是依使用年限計算每月折舊。</p>

                        </div>

        }

        // 全域金額格式化：資本設定彈窗在 renderCapitalView 外執行，也需要使用。
        function money(value) {
            return `$${Math.round(Number(value) || 0).toLocaleString('zh-TW')} 元`;
        }

        async function openCapitalSettingsModal() {
            const capitalData = await getGlobalCapitalSettings();
            const contributions = capitalData.contributions || Object.fromEntries(CAPITAL_PARTNERS.map(name => [name, 0]));
            const legacyNote = !capitalData.contributions && capitalData.legacyCapital > 0
                ? `<p style="font-size:12px;color:#9a3412;background:#fff7ed;padding:9px 11px;border-radius:9px;line-height:1.6;">目前舊設定的總投入資本為 ${money(capitalData.legacyCapital)}，尚未分配到個別合夥人。請依實際出資填入三人的金額；確認後會以三人金額合計作為新的初始投入資本。</p>` : '';
            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'capital-modal-overlay';
            overlay.style.zIndex = '10050';
            overlay.innerHTML = `
                <div class="picker-modal" style="width:min(460px,calc(100vw - 28px));max-height:90vh;overflow:auto;text-align:left;">

                    ${CAPITAL_PARTNERS.map((name, index) => `<div class="form-group"><label for="capital-partner-${index}">${name} 投入金額（元）</label><input type="number" inputmode="decimal" min="0" step="1" id="capital-partner-${index}" value="${Number(contributions[name]) || 0}" placeholder="請輸入 ${name} 的投入金額" autocomplete="off" style="display:block;width:100%;min-height:48px;pointer-events:auto;user-select:text;position:relative;z-index:2;"></div>`).join('')}

        function updateCapitalContributionPreview() {
            const values = CAPITAL_PARTNERS.map((name, index) => Math.max(0, Number(document.getElementById(`capital-partner-${index}`)?.value) || 0));

            preview.innerHTML = `<b>目前投入總額：${money(total)}</b><div style="display:grid;gap:4px;margin-top:6px;">${CAPITAL_PARTNERS.map((name, index) => `<div style="display:flex;justify-content:space-between;gap:10px;"><span>${name}</span><span>${money(values[index])}（${total ? (values[index] / total * 100).toFixed(1) : '0.0'}%）</span></div>`).join('')}</div>`;

        async function saveCapitalSettings() {
            const inputs = CAPITAL_PARTNERS.map((name, index) => document.getElementById(`capital-partner-${index}`));
            if (inputs.some(input => !input)) { alert('找不到合夥人金額欄位，請關閉設定視窗後重新開啟。'); return; }
            const amounts = Object.fromEntries(CAPITAL_PARTNERS.map((name, index) => {
                const value = Number(inputs[index].value);
                return [name, Number.isFinite(value) && value >= 0 ? value : 0];
            }));
            const newCap = CAPITAL_PARTNERS.reduce((sum, name) => sum + amounts[name], 0);
            if (newCap <= 0) { alert('請至少填寫一位合夥人的實際投入金額。'); return; }

            const saveButton = document.querySelector('#capital-modal-overlay .picker-confirm');
            if (saveButton) { saveButton.disabled = true; saveButton.textContent = '保存中…'; }
            try {
                // 創業初始資本是全店共用設定：固定寫入目前月份的既有 settings_json，保留該月其他設定。
                const targetMonth = getCurrentYearMonth();
                const fixedSettings = await getMonthSettingsForEditing(targetMonth);
                fixedSettings.capitalContributions = amounts;
                fixedSettings.initialCapital = newCap;

                const { data: existing, error: readError } = await _supabase
                    .from('settings').select('month').eq('month', targetMonth).maybeSingle();
                if (readError) throw readError;

                if (!existing) fixedSettings.fixedCostsConfigured = false;
                const result = existing
                    ? await _supabase.from('settings').update({ settings_json: fixedSettings }).eq('month', targetMonth)
                    : await _supabase.from('settings').insert([{ month: targetMonth, settings_json: fixedSettings }]);
                if (result.error) throw result.error;

                document.getElementById('capital-modal-overlay')?.remove();
                showAppToast('投入資本已保存', `三位合夥人投入總額 ${money(newCap)}，各自佔比已更新。`, 'success');
                await renderCapitalView();
            } catch (error) {
                console.error('保存合夥人投入資本失敗：', error);
                alert('保存合夥人投入資本失敗：' + (error?.message || error));
                if (saveButton) { saveButton.disabled = false; saveButton.textContent = '確認儲存'; }
            }
        }



        // ==================== 滾輪選擇器核心邏輯 ====================
        let currentWheelCallback = null;
        let isYearMonthOnlyMode = false;

        function openDatePicker(callback, initialDateStr) {
            isYearMonthOnlyMode = false;
            currentWheelCallback = callback;
            let initDate = new Date();
            if (initialDateStr && !isNaN(new Date(initialDateStr))) initDate = new Date(initialDateStr);

            let initYear = initDate.getFullYear();
            let initMonth = initDate.getMonth() + 1;
            let initDay = initDate.getDate();

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `
                <div class="picker-modal" style="width:360px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:22px 16px;">
                    <h4>📅 選擇日期</h4>
                    <div class="picker-wheels-container" style="display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;overflow:hidden;">
                        <div class="wheel-column" id="wheel-year" onscroll="handleWheelScroll('year')" style="flex:1 1 0;width:33.333%;min-width:0;max-width:33.333%;"></div>
                        <div class="wheel-column" id="wheel-month" onscroll="handleWheelScroll('month')" style="flex:1 1 0;width:33.333%;min-width:0;max-width:33.333%;"></div>
                        <div class="wheel-column" id="wheel-day" onscroll="handleWheelScroll('day')" style="flex:1 1 0;width:33.333%;min-width:0;max-width:33.333%;"></div>
                    </div>
                    <div class="picker-btn-group">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmWheelPicker()">確定選取</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            populateWheelColumns(initYear, initMonth, initDay, false);
        }

        function openYearMonthPicker(callback, initialYmStr) {
            isYearMonthOnlyMode = true;
            currentWheelCallback = callback;
            let nowY = new Date().getFullYear();
            let initYear = nowY;
            let initMonth = new Date().getMonth() + 1;
            if (initialYmStr && initialYmStr.includes('-')) {
                let parts = initialYmStr.split('-');
                initYear = parseInt(parts[0], 10) || nowY;
                initMonth = parseInt(parts[1], 10) || 1;
            }

            const overlay = document.createElement('div');
            overlay.className = 'picker-overlay';
            overlay.id = 'wheel-picker-overlay';
            overlay.innerHTML = `
                <div class="picker-modal" style="width:320px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:22px 16px;">
                    <h4>📅 選擇年月</h4>
                    <div class="picker-wheels-container" style="display:flex;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;overflow:hidden;">
                        <div class="wheel-column" id="wheel-year" onscroll="handleWheelScroll('year')" style="flex:1 1 0;width:50%;min-width:0;max-width:50%;"></div>
                        <div class="wheel-column" id="wheel-month" onscroll="handleWheelScroll('month')" style="flex:1 1 0;width:50%;min-width:0;max-width:50%;"></div>
                    </div>
                    <div class="picker-btn-group" style="margin-top: 15px;">
                        <button class="picker-btn picker-cancel" onclick="closeWheelPicker()">取消</button>
                        <button class="picker-btn picker-confirm" onclick="confirmWheelPicker()">確定選取</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            populateWheelColumns(initYear, initMonth, 1, true);
        }

        function populateWheelColumns(selYear, selMonth, selDay, ymOnly) {
            const yearCol = document.getElementById('wheel-year');
            const monthCol = document.getElementById('wheel-month');

            let currentActualYear = new Date().getFullYear();
            // 年份範圍以今年為中心，前後各可選 100 年（共 201 年）。
            let startYear = currentActualYear - 100;
            let endYear = currentActualYear + 100;

            let yearHtml = '<div style="height:47.5px;"></div>';
            for (let y = startYear; y <= endYear; y++) {
                yearHtml += `<div class="wheel-item" data-val="${y}">${y}年</div>`;
            }
            yearHtml += '<div style="height:47.5px;"></div>';
            yearCol.innerHTML = yearHtml;

            let monthHtml = '<div style="height:47.5px;"></div>';
            for (let m = 1; m <= 12; m++) {
                let mStr = m < 10 ? '0' + m : m;
                monthHtml += `<div class="wheel-item" data-val="${m}">${mStr}月</div>`;
            }
            monthHtml += '<div style="height:47.5px;"></div>';
            monthCol.innerHTML = monthHtml;

            if (!ymOnly) {
                updateDaysWheel(selYear, selMonth, selDay);
            }

            requestAnimationFrame(() => {
                scrollToValue('year', selYear);
                scrollToValue('month', selMonth);
                if (!ymOnly) scrollToValue('day', selDay);
            });
        }

        function updateDaysWheel(year, month, selectedDay) {
            const dayCol = document.getElementById('wheel-day');
            if (!dayCol) return;
            const daysInMonth = new Date(year, month, 0).getDate();
            if (selectedDay > daysInMonth) selectedDay = daysInMonth;

            let dayHtml = '<div style="height:47.5px;"></div>';
            for (let d = 1; d <= daysInMonth; d++) {
                let dStr = d < 10 ? '0' + d : d;
                dayHtml += `<div class="wheel-item" data-val="${d}">${dStr}日</div>`;
            }
            dayHtml += '<div style="height:47.5px;"></div>';
            dayCol.innerHTML = dayHtml;
            scrollToValue('day', selectedDay);
        }

        function scrollToValue(type, val) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            for (let item of items) {
                if (parseInt(item.getAttribute('data-val')) === parseInt(val)) {
                    col.scrollTop = item.offsetTop - (col.clientHeight / 2) + (item.clientHeight / 2);
                    break;
                }
            }
            highlightSelected(type);
        }

        function handleWheelScroll(type) {
            highlightSelected(type);
            if (!isYearMonthOnlyMode && (type === 'year' || type === 'month')) {
                const y = getSelectedValue('year');
                const m = getSelectedValue('month');
                const currentDay = getSelectedValue('day');
                updateDaysWheel(y, m, currentDay);
            }
        }

        function highlightSelected(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return;
            const items = col.querySelectorAll('.wheel-item');
            let containerCenter = col.scrollTop + (col.clientHeight / 2);
            let closestItem = null;
            let minDiff = 9999;

            items.forEach(item => {
                let itemCenter = item.offsetTop + (item.clientHeight / 2);
                let diff = Math.abs(containerCenter - itemCenter);
                if (diff < minDiff) { minDiff = diff; closestItem = item; }
            });

            items.forEach(item => item.classList.remove('selected'));
            if (closestItem) closestItem.classList.add('selected');
        }

        function getSelectedValue(type) {
            const col = document.getElementById(`wheel-${type}`);
            if (!col) return 1;
            const selectedItem = col.querySelector('.wheel-item.selected');
            return selectedItem ? selectedItem.getAttribute('data-val') : 1;
        }

        function confirmWheelPicker() {
            const y = getSelectedValue('year');
            const m = getSelectedValue('month');
            const mStr = m < 10 ? '0' + m : m;

            if (isYearMonthOnlyMode) {
                let formattedYm = `${y}-${mStr}`;
                if (currentWheelCallback) currentWheelCallback(formattedYm);
            } else {
                const d = getSelectedValue('day');
                const dStr = d < 10 ? '0' + d : d;
                let formattedDate = `${y}-${mStr}-${dStr}`;
                if (currentWheelCallback) currentWheelCallback(formattedDate);
            }
            closeWheelPicker();
        }

        function closeWheelPicker() {
            const overlay = document.getElementById('wheel-picker-overlay');
            if (overlay) overlay.remove();
        }
    </script>

    <!-- PWA Service Worker：只快取 App 外殼與圖示，不快取 Supabase/API 資料 -->
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./service-worker.js')
            .catch(function (error) { console.warn('App 離線外殼註冊失敗：', error); });
        });
      }
      window.addEventListener('DOMContentLoaded', async function () {
        // 僅移除 ChatGPT 加上的來源追蹤參數，不影響點餐／歷史訂單等功能參數。
        const params = new URLSearchParams(location.search);
        if (params.get('utm_source') === 'chatgpt.com') {
          params.delete('utm_source');
          const cleanQuery = params.toString();
          history.replaceState(history.state, '', location.pathname + (cleanQuery ? '?' + cleanQuery : '') + location.hash);
        }
        if (params.get('customer-order') === '1') {
          document.documentElement.classList.remove('store-auth-required');
          renderCustomerPublicPage();
        } else if (params.get('customer-history') === '1') {
          document.documentElement.classList.remove('store-auth-required');
          renderCustomerHistoryPage();
        } else if (params.get('customer-order-admin') === '1') {
          customerLoginDestination='admin';
          openPage('customer-orders-admin');
          document.documentElement.classList.remove('store-auth-required');
        } else {
          const {data:{session}}=await _supabase.auth.getSession();
          const {data:{user},error:userError}=session?await _supabase.auth.getUser():{data:{user:null},error:null};
          if(!session||userError||!customerOwnerRole(user)){
            if(session)await _supabase.auth.signOut();
            customerLoginDestination='home';
            openPage('customer-orders-admin');
          }else{
            document.getElementById('sub-view').style.display='none';
            document.getElementById('home-view').style.display='block';
            initCustomerHomeOrderRealtime();
          }
          document.documentElement.classList.remove('store-auth-required');
        }
      });
    </script>
